name: Apply leader BLE scan
on:
  push:
    branches:
      - fix/android-ble-discovery-rfcomm
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-ble-discovery-rfcomm
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply leader BLE scan cleanup
        run: python .github/tmp/apply-leader-ble-scan.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run focused Bluetooth regression
        run: node --test test/workerPortalAndroidRfcommResilience.test.js
      - name: Commit validated implementation
        run: |
          rm -f .github/tmp/apply-leader-ble-scan.py .github/workflows/apply-leader-ble-scan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(android): usar BLE exclusivo para escaneo del líder'
          git push origin HEAD:fix/android-ble-discovery-rfcomm
