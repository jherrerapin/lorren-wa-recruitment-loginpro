name: tmp-align-conversation-audit-vacancy-info-v2
on:
  push:
    branches: [fix/production-ad-flow-20260808]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Align audit semantics and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/services/conversationAudit.js')
          text = p.read_text(encoding='utf-8')
          start_marker = "    const configuredVacancyInfo = Boolean("
          end_marker = "      addIssue(issues, buildIssue(\n        'VACANCY_INFO_SKIPPED'"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'audit markers missing: start={start}, end={end}')
          replacement = r'''    const configuredVacancyInfo = Boolean(
              candidate?.vacancy?.roleDescription
              || candidate?.vacancy?.requirements
              || candidate?.vacancy?.conditions
              || candidate?.vacancy?.operationAddress
              || candidate?.vacancy?.requiredDocuments
              || Number.isInteger(candidate?.vacancy?.minAge)
              || Number.isInteger(candidate?.vacancy?.maxAge)
              || ['YES', 'NO'].includes(String(candidate?.vacancy?.experienceRequired || '').toUpperCase())
            );
            if (replyKind === 'ACTIVE_VACANCY_INTEREST_PROMPT'
              && configuredVacancyInfo
              && !/\b(requisitos?|condiciones?|zona de operaci[oó]n|el cargo consiste|documentos? registrados?|rango de edad|edad m[ií]nima|edad m[aá]xima|edad configurada|experiencia requerida|se requiere experiencia|no se requiere experiencia)\b/i.test(body)) {
          '''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          p = Path('test/conversationAuditPaidAdRegressions.test.js')
          text = p.read_text(encoding='utf-8')
          if 'considera edad y experiencia estructuradas como información configurada' not in text:
              text += r'''

          test('auditor: considera edad y experiencia estructuradas como información configurada de vacante', () => {
            const cand = candidate({
              dataConsentAcceptedAt: new Date(Date.UTC(2026, 7, 8, 13, 0)),
              vacancy: { id: 'vac-structured-only', title: 'Auxiliar Logístico', city: 'Bogotá', minAge: 20, maxAge: 45, experienceRequired: 'YES', experienceTimeText: 'mínimo 6 meses', schedulingEnabled: false }
            });
            const result = analyzeConversationSession([
              message('1', 20, 'INBOUND', 'Auxiliar logístico Bogotá', {}, cand),
              message('2', 21, 'OUTBOUND', 'Encontré la vacante de Auxiliar Logístico en Bogotá. ¿Te interesa continuar?', { source: 'vacancy_first_gate', replyKind: 'ACTIVE_VACANCY_INTEREST_PROMPT' }, cand)
            ], { now: new Date(Date.UTC(2026, 7, 8, 13, 22)), checkCurrentState: false });
            assert.equal(codes(result).has('VACANCY_INFO_SKIPPED'), true);
          });

          test('auditor: reconoce rango de edad estructurado cuando sí fue presentado', () => {
            const cand = candidate({
              dataConsentAcceptedAt: new Date(Date.UTC(2026, 7, 8, 13, 0)),
              vacancy: { id: 'vac-age-presented', title: 'Auxiliar Logístico', city: 'Bogotá', minAge: 20, maxAge: 45, schedulingEnabled: false }
            });
            const result = analyzeConversationSession([
              message('1', 20, 'INBOUND', 'Auxiliar logístico Bogotá', {}, cand),
              message('2', 21, 'OUTBOUND', 'Te comparto la información de Auxiliar Logístico en Bogotá. El rango de edad configurado es de 20 a 45 años. Si te interesa continuar, confírmame.', { source: 'vacancy_first_gate', replyKind: 'ACTIVE_VACANCY_INTEREST_PROMPT' }, cand)
            ], { now: new Date(Date.UTC(2026, 7, 8, 13, 22)), checkCurrentState: false });
            assert.equal(codes(result).has('VACANCY_INFO_SKIPPED'), false);
          });
          '''
          p.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run prisma:generate
      - name: Validate focused recruitment contract
        run: |
          node --check src/services/conversationAudit.js
          node --check test/conversationAuditPaidAdRegressions.test.js
          node --test \
            test/conversationAuditPaidAdRegressions.test.js \
            test/vacancyConfiguredInformationContract.test.js \
            test/productionPaidAdFlowRegressions.test.js \
            test/vacancyFirstGate.test.js \
            test/vacancyBeforeConsentReplay.test.js \
            test/dataConsentOrderReplay.test.js
      - name: Commit and remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-align-conversation-audit-vacancy-info.yml
          rm -f .github/workflows/tmp-align-conversation-audit-vacancy-info-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: alinear auditor con configuración estructurada de vacante"
          git push origin HEAD:fix/production-ad-flow-20260808
