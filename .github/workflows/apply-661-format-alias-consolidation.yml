name: Apply format alias consolidation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/661-format-alias-test-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply verified consolidation patch
        run: node scripts/apply-661-format-alias-consolidation.mjs

      - name: Validate focused contracts
        run: |
          node --check src/routes/webhook.js
          node --check test/webhookReadinessAliasRemoval.test.js
          node --test test/transitionalCodeInventory.test.js test/webhookReadinessAliasRemoval.test.js

      - name: Prepare and verify publishable reduction
        run: |
          set -euo pipefail

          git checkout -- .github/workflows/ci.yml
          rm -f \
            test/webhookRequiredFieldAliasRemoval.test.js \
            scripts/apply-661-format-alias-consolidation.mjs

          git add -A

          printf '%s\n' \
            'config/transitional-code-inventory.json' \
            'docs/architecture/transitional-code-inventory.md' \
            'scripts/apply-661-format-alias-consolidation.mjs' \
            'src/routes/webhook.js' \
            'test/webhookReadinessAliasRemoval.test.js' \
            'test/webhookRequiredFieldAliasRemoval.test.js' \
            | sort > /tmp/expected-paths.txt

          git diff --cached --name-only | sort | tee /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Commit publishable reduction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: retirar formatFieldList y consolidar pruebas"

      - name: Push publishable reduction
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git push origin "HEAD:${HEAD_REF}"
