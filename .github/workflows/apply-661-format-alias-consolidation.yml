name: Apply format alias consolidation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/661-format-alias-test-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply verified consolidation patch
        run: node scripts/apply-661-format-alias-consolidation.mjs

      - name: Validate focused contracts
        run: |
          node --check src/routes/webhook.js
          node --check test/webhookReadinessAliasRemoval.test.js
          node --test test/transitionalCodeInventory.test.js test/webhookReadinessAliasRemoval.test.js

      - name: Commit final reduction and remove temporary machinery
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f \
            test/webhookRequiredFieldAliasRemoval.test.js \
            scripts/apply-661-format-alias-consolidation.mjs \
            .github/workflows/apply-661-format-alias-consolidation.yml

          git add -A

          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/apply-661-format-alias-consolidation.yml
          .github/workflows/ci.yml
          config/transitional-code-inventory.json
          docs/architecture/transitional-code-inventory.md
          scripts/apply-661-format-alias-consolidation.mjs
          src/routes/webhook.js
          test/webhookReadinessAliasRemoval.test.js
          test/webhookRequiredFieldAliasRemoval.test.js
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          git commit -m "refactor: retirar formatFieldList y consolidar pruebas"
          git push origin "HEAD:${HEAD_REF}"
