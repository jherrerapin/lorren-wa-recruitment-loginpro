name: Preserve dispatch features during Cloud API migration

on:
  push:
    branches:
      - feat/1027-dispatch-whatsapp-cloud-api
    paths:
      - .github/workflows/dispatch-cloud-preserve-features.yml

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: feat/1027-dispatch-whatsapp-cloud-api

      - name: Apply feature-preservation patch
        run: python scripts/preserve-dispatch-cloud-features.py

      - name: Validate migration scope
        shell: bash
        run: |
          node --check src/routes/dispatchOpsExtras.js
          node --check src/routes/dispatchAssignmentConfirmations.js
          node --check src/services/dispatchAuditMiddleware.js
          node --test test/dispatchWhatsappCloudCutover.test.js
          grep -q 'data-async-assignment-action="confirmar"' src/views/operacionesAsignacionesConfirmacion.ejs
          grep -q 'Enviar WhatsApp a todos' src/views/operacionesAsignacionesConfirmacion.ejs
          grep -q 'JSON.stringify({phone,context})' src/views/operacionesAsignacionesConfirmacion.ejs
          ! grep -q 'whatsapp-web.js' package.json
          ! grep -q 'qrcode-terminal' package.json

      - name: Commit corrected scope
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dispatchOpsExtras.js src/routes/dispatchAssignmentConfirmations.js src/services/dispatchAuditMiddleware.js src/views/operacionesAsignacionesConfirmacion.ejs test/dispatchWhatsappCloudCutover.test.js
          git commit -m "fix(dispatch): preserve messaging and manual confirmation on Cloud API"
          git push origin HEAD:feat/1027-dispatch-whatsapp-cloud-api
