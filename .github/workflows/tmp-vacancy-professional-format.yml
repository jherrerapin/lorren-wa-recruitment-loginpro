name: tmp-vacancy-professional-format
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Apply professional vacancy presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def regex_replace_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return updated

          p = Path('src/services/vacancyFirstGate.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "import { cleanConfiguredFragment, getConfiguredAgeRequirementText, getConfiguredExperienceRequirementText, getConfiguredPublicRequirementSentences } from './vacancyPublicInfo.js';",
              "import { cleanConfiguredFragment, getConfiguredAgeRequirementText, getConfiguredExperienceRequirementText } from './vacancyPublicInfo.js';",
              'vacancy public info import'
          )

          overview = r'''function ensureProfessionalSentence(value = '') {
            const clean = cleanConfiguredFragment(value);
            return clean ? `${clean}.` : '';
          }

          function buildAgeOverviewLine(vacancy = {}, requirements = '') {
            if (/\bedad\b|\b\d{1,2}\s*(?:a|-)\s*\d{1,2}\s*a[nñ]os?\b/i.test(requirements)) return '';
            const minAge = Number.isInteger(vacancy?.minAge) ? vacancy.minAge : null;
            const maxAge = Number.isInteger(vacancy?.maxAge) ? vacancy.maxAge : null;
            if (minAge !== null && maxAge !== null) {
              return minAge === maxAge ? `Edad: ${minAge} años.` : `Edad: ${minAge} a ${maxAge} años.`;
            }
            if (minAge !== null) return `Edad mínima: ${minAge} años.`;
            if (maxAge !== null) return `Edad máxima: ${maxAge} años.`;
            return '';
          }

          function buildExperienceOverviewLine(vacancy = {}, requirements = '') {
            if (/\bexperiencia\b/i.test(requirements)) return '';
            const mode = String(vacancy?.experienceRequired || '').trim().toUpperCase();
            const time = cleanConfiguredFragment(vacancy?.experienceTimeText);
            if (mode === 'YES') {
              if (time) return `Experiencia: ${time.charAt(0).toUpperCase()}${time.slice(1)}.`;
              return 'Experiencia: Requerida.';
            }
            if (mode === 'NO') return 'Experiencia: No requerida.';
            return '';
          }

          function buildVacancyOverview(vacancy = {}) {
            const city = vacancyCity(vacancy);
            const title = vacancyTitle(vacancy);
            const roleDescription = cleanConfiguredFragment(vacancy?.roleDescription);
            const requirements = cleanConfiguredFragment(vacancy?.requirements);
            const conditions = cleanConfiguredFragment(vacancy?.conditions);
            const address = cleanConfiguredFragment(vacancy?.operationAddress);
            const documents = cleanConfiguredFragment(vacancy?.requiredDocuments);
            const sections = [
              `*Vacante: ${title}*`,
              city ? `Ciudad: ${city}` : null,
              address ? `Zona de trabajo: ${address}` : null
            ].filter(Boolean);

            if (roleDescription) sections.push(`*Funciones*\n${ensureProfessionalSentence(roleDescription)}`);

            const requirementLines = [
              requirements ? ensureProfessionalSentence(requirements) : '',
              buildAgeOverviewLine(vacancy, requirements),
              buildExperienceOverviewLine(vacancy, requirements)
            ].filter(Boolean);
            if (requirementLines.length) sections.push(`*Requisitos*\n${requirementLines.join('\n')}`);
            if (conditions) sections.push(`*Condiciones*\n${ensureProfessionalSentence(conditions)}`);
            if (documents) sections.push(`*Documentación para el proceso*\n${ensureProfessionalSentence(documents)}`);

            const hasDetails = Boolean(roleDescription || requirements || conditions || documents
              || Number.isInteger(vacancy?.minAge) || Number.isInteger(vacancy?.maxAge)
              || ['YES', 'NO'].includes(String(vacancy?.experienceRequired || '').trim().toUpperCase()));
            if (!hasDetails) sections.push('No hay información adicional cargada para esta vacante.');

            return sections.join('\n\n');
          }

          function buildActiveVacancyInterestReply'''
          text = regex_replace_once(
              text,
              r"function buildVacancyOverview\(vacancy = \{\}\) \{.*?\n\}\n\nfunction buildActiveVacancyInterestReply",
              overview,
              'buildVacancyOverview replacement'
          )
          text = replace_once(
              text,
              "  return `${answer} Si después de revisar esta información te interesa continuar, confírmame y seguimos con la postulación.`;",
              "  return `${answer}\\n\\n¿Te interesa continuar con esta vacante? Si es así, confírmame y seguimos con la postulación.`;",
              'interest closing format'
          )
          text = regex_replace_once(
              text,
              r"\n  const facts = \[\];\n  if \(roleDescription\) facts\.push\(`El cargo consiste en \$\{roleDescription\}\.\`\);.*?\n\}\n\nfunction buildInactiveVacancyReply",
              "\n  return buildVacancyOverview(vacancy);\n}\n\nfunction buildInactiveVacancyReply",
              'generic vacancy answer replacement'
          )
          p.write_text(text, encoding='utf-8')

          p = Path('src/services/conversationAudit.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "&& !/\\b(requisitos?|condiciones?|zona de operaci[oó]n|el cargo consiste|documentos? registrados?|rango de edad|edad m[ií]nima|edad m[aá]xima|edad configurada|experiencia requerida|se requiere experiencia|no se requiere experiencia)\\b/i.test(body)) {",
              "&& !/\\b(requisitos?|condiciones?|zona de operaci[oó]n|zona de trabajo|funciones?|el cargo consiste|documentaci[oó]n para el proceso|documentos? registrados?|rango de edad|edad m[ií]nima|edad m[aá]xima|edad configurada|experiencia requerida|se requiere experiencia|no se requiere experiencia)\\b/i.test(body)) {",
              'vacancy info audit labels'
          )
          text = replace_once(
              text,
              "    if (sentenceCount(body) > 3 || body.length > 700) {\n      addIssue(issues, buildIssue('EXCESSIVE_LENGTH', `La respuesta tiene ${sentenceCount(body)} oraciones y ${body.length} caracteres.`, message, candidate));\n    }",
              "    const isStructuredVacancyPresentation = replyKind === 'ACTIVE_VACANCY_INTEREST_PROMPT'\n      || (replyKind === 'DATA_CONSENT_PROMPT' && /^\\s*\\*Vacante:/i.test(body));\n    const maximumLength = isStructuredVacancyPresentation ? 1400 : 700;\n    if ((!isStructuredVacancyPresentation && sentenceCount(body) > 3) || body.length > maximumLength) {\n      addIssue(issues, buildIssue('EXCESSIVE_LENGTH', `La respuesta tiene ${sentenceCount(body)} oraciones y ${body.length} caracteres.`, message, candidate));\n    }",
              'structured vacancy audit length'
          )
          p.write_text(text, encoding='utf-8')

          p = Path('test/vacancyConfiguredInformationContract.test.js')
          text = p.read_text(encoding='utf-8')
          marker = "  assert.doesNotMatch(decision.reply, /no especificado/i);\n});"
          addition = "  assert.doesNotMatch(decision.reply, /no especificado/i);\n  assert.match(decision.reply, /^\\*Vacante: Líder de Operación\\*/);\n  assert.match(decision.reply, /Ciudad: Neiva/);\n  assert.match(decision.reply, /Zona de trabajo: Sector Las Brisas/);\n  assert.match(decision.reply, /\\*Funciones\\*\\nLiderar y administrar personal operativo\\./);\n  assert.match(decision.reply, /\\*Requisitos\\*/);\n  assert.match(decision.reply, /Edad: 23 a 45 años\\./);\n  assert.match(decision.reply, /Experiencia: Mínimo 6 meses en operaciones logísticas\\./);\n  assert.match(decision.reply, /\\*Condiciones\\*/);\n  assert.match(decision.reply, /\\n\\n¿Te interesa continuar con esta vacante\\?/);\n});"
          text = replace_once(text, marker, addition, 'vacancy formatting assertions')
          p.write_text(text, encoding='utf-8')

          Path('test/vacancyPresentationFormatAudit.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { analyzeConversationSession } from '../src/services/conversationAudit.js';

          test('la ficha estructurada de vacante no se audita como respuesta excesiva', () => {
            const candidate = {
              id: 'candidate-format',
              currentStep: 'GREETING_SENT',
              status: 'NUEVO',
              vacancy: {
                title: 'Líder de Operación', city: 'Neiva',
                roleDescription: 'Liderar y administrar personal operativo',
                requirements: 'Técnico o tecnólogo en logística',
                conditions: 'Turnos rotativos y prestaciones de ley',
                operationAddress: 'Sector Las Brisas', minAge: 23, maxAge: 45,
                experienceRequired: 'YES', experienceTimeText: 'mínimo 6 meses'
              }
            };
            const messages = [{
              id: 'out-1', candidateId: candidate.id, direction: 'OUTBOUND', messageType: 'TEXT',
              createdAt: new Date('2026-08-08T15:00:00Z'),
              body: '*Vacante: Líder de Operación*\n\nCiudad: Neiva\n\nZona de trabajo: Sector Las Brisas\n\n*Funciones*\nLiderar y administrar personal operativo.\n\n*Requisitos*\nTécnico o tecnólogo en logística.\nEdad: 23 a 45 años.\nExperiencia: Mínimo 6 meses.\n\n*Condiciones*\nTurnos rotativos y prestaciones de ley.\n\n¿Te interesa continuar con esta vacante? Si es así, confírmame y seguimos con la postulación.',
              rawPayload: { source: 'vacancy_first_gate', replyKind: 'ACTIVE_VACANCY_INTEREST_PROMPT' },
              candidate
            }];
            const result = analyzeConversationSession(messages, { now: new Date('2026-08-08T15:01:00Z'), checkCurrentState: false });
            const codes = new Set(result.issues.map((issue) => issue.code));
            assert.equal(codes.has('EXCESSIVE_LENGTH'), false);
            assert.equal(codes.has('VACANCY_INFO_SKIPPED'), false);
          });
          ''', encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          npm ci
          npm run prisma:generate
      - name: Syntax and focused tests
        run: |
          node --check src/services/vacancyFirstGate.js
          node --check src/services/conversationAudit.js
          node --check test/vacancyConfiguredInformationContract.test.js
          node --check test/vacancyPresentationFormatAudit.test.js
          node --test test/vacancyConfiguredInformationContract.test.js test/vacancyPresentationFormatAudit.test.js test/conversationAuditPaidAdRegressions.test.js test/productionPaidAdFlowRegressions.test.js
      - name: Commit validated change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-vacancy-professional-format.yml
          git add src/services/vacancyFirstGate.js src/services/conversationAudit.js test/vacancyConfiguredInformationContract.test.js test/vacancyPresentationFormatAudit.test.js .github/workflows/tmp-vacancy-professional-format.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: profesionalizar presentación de vacantes"
          git push origin HEAD:fix/production-ad-flow-20260808
