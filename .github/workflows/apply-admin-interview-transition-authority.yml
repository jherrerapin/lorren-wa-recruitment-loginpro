name: Clean admin interview transition workflow

on:
  push:
    branches:
      - refactor/463-admin-interview-transition-authority

permissions:
  contents: read

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/463-admin-interview-transition-authority
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Make CI permanent and read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  apply-admin-interview-transition-authority:')
          end = text.index('  state-authority:', start)
          text = text[:start] + text[end:]
          old = '        run: node --test test/interviewBookingStateService.test.js test/interviewSchedulerAuthority.test.js test/interviewLifecycle.test.js'
          new = old + ' test/interviewBookingAdminStateService.test.js test/adminInterviewBookingAuthority.test.js'
          if old not in text:
              raise SystemExit('interview_authority_gate_marker_missing')
          text = text.replace(old, new, 1)
          if 'apply-admin-interview-transition-authority:' in text or 'contents: write' in text:
              raise SystemExit('temporary_ci_permissions_remain')
          if 'test/interviewBookingAdminStateService.test.js' not in text or 'test/adminInterviewBookingAuthority.test.js' not in text:
              raise SystemExit('permanent_admin_tests_missing')
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: bloquear regresiones administrativas de entrevistas"
          git push origin HEAD:refactor/463-admin-interview-transition-authority
