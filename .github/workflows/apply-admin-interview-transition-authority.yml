name: Apply admin interview transition authority

on:
  push:
    branches:
      - refactor/463-admin-interview-transition-authority

permissions:
  contents: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: refactor/463-admin-interview-transition-authority
          fetch-depth: 0
          persist-credentials: true

      - name: Apply scoped migration
        run: node scripts/apply-admin-interview-transition-authority.mjs

      - name: Validate scoped migration
        run: |
          node --check src/services/interviewBookingStateService.js
          node --check src/routes/admin.js
          node --test test/interviewBookingAdminStateService.test.js test/adminInterviewBookingAuthority.test.js test/stateAuthorityManifest.test.js

      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/services/interviewBookingStateService.js \
            src/routes/admin.js \
            test/interviewBookingAdminStateService.test.js \
            test/adminInterviewBookingAuthority.test.js \
            .github/workflows/ci.yml \
            docs/architecture/state-authority-manifest.json \
            docs/architecture/state-authority-map.md
          git commit -m "refactor: controlar transiciones manuales de entrevista"
          git push origin HEAD:refactor/463-admin-interview-transition-authority
