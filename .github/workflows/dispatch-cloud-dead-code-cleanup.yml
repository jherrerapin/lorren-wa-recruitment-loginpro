name: Dispatch Cloud API dead code cleanup

on:
  push:
    branches:
      - feat/1027-dispatch-whatsapp-cloud-api
    paths:
      - .github/workflows/dispatch-cloud-dead-code-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: feat/1027-dispatch-whatsapp-cloud-api

      - name: Remove obsolete manual-confirmation helpers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/dispatchOpsExtras.js')
          source = path.read_text(encoding='utf-8')
          original = source
          source = source.replace("import { sendDispatchCompletionEmail } from '../services/dispatchCompletionEmail.js';\n", '')
          source, count = re.subn(
              r"async function resolveActorEmail\(prisma, username\) \{[\s\S]*?\n\}\nasync function notifyIfServiceRequestCompleted\(prisma, serviceRequestId, actorUsername\) \{[\s\S]*?\n\}\n",
              '',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit('No se encontró exactamente el bloque heredado de correo ligado a confirmación manual.')
          for token in ['sendDispatchCompletionEmail', 'resolveActorEmail(', 'notifyIfServiceRequestCompleted(']:
              if token in source:
                  raise SystemExit(f'Quedó código muerto de confirmación manual: {token}')
          if source == original:
              raise SystemExit('No se aplicó limpieza.')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate route
        run: node --check src/routes/dispatchOpsExtras.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dispatchOpsExtras.js
          git commit -m "refactor(dispatch): remove manual-confirmation dead code"
          git push origin HEAD:feat/1027-dispatch-whatsapp-cloud-api
