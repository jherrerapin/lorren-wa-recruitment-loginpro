name: Temporary 1540 template wording

on:
  push:
    branches:
      - fix/1538-interview-template-disclaimer
    paths:
      - .github/workflows/tmp-1540-template-wording.yml

permissions:
  contents: write

jobs:
  align-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1538-interview-template-disclaimer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Align approved wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin_path = Path('src/routes/admin.js')
          admin = admin_path.read_text()
          old = "Recuerda: este proceso es gratuito. No somos una bolsa de empleo y nunca te pediremos dinero para postularte, asistir o continuar."
          new = "Recuerda: este proceso es gratuito. Nunca te pediremos dinero para asistir o continuar y no somos una bolsa de empleo."
          if old not in admin:
              raise SystemExit('expected previous disclaimer not found')
          admin_path.write_text(admin.replace(old, new, 1))

          test_path = Path('test/approvedOutreachContactedTransition.test.js')
          tests = test_path.read_text()
          old_assert = "assert.match(delivery.body, /nunca te pediremos dinero para postularte, asistir o continuar/i);"
          new_assert = "assert.match(delivery.body, /Nunca te pediremos dinero para asistir o continuar y no somos una bolsa de empleo\./i);"
          if old_assert not in tests:
              raise SystemExit('expected previous disclaimer assertion not found')
          test_path.write_text(tests.replace(old_assert, new_assert, 1))
          PY
      - run: node --test test/approvedOutreachContactedTransition.test.js
      - run: node --check src/routes/admin.js
      - name: Commit focused wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.js test/approvedOutreachContactedTransition.test.js
          git diff --cached --check
          git commit -m "fix(recruitment): use approved interview disclaimer wording"
          git push origin HEAD:fix/1538-interview-template-disclaimer
