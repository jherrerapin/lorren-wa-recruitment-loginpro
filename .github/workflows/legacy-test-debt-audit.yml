name: Audit legacy test identities

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Audit inherited test identities
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Capture exact inherited failure identities
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm test > full-test-output.log 2>&1
          test_exit=$?
          set -e

          tests_count=$(awk '/^# tests [0-9]+$/ { value = $3 } END { print value }' full-test-output.log)
          fail_count=$(awk '/^# fail [0-9]+$/ { value = $3 } END { print value }' full-test-output.log)

          if ! [[ "$tests_count" =~ ^[0-9]+$ ]] || ! [[ "$fail_count" =~ ^[0-9]+$ ]]; then
            echo "::error::npm test did not produce a valid TAP summary."
            tail -n 160 full-test-output.log
            exit 1
          fi

          awk '
            function emit_pending() {
              if (pending != "" && !is_subtest_container) {
                print pending
              }
              pending = ""
              is_subtest_container = 0
            }

            /^[[:space:]]*not ok [0-9]+ - / {
              emit_pending()
              identity = $0
              sub(/^[[:space:]]*not ok [0-9]+ - /, "", identity)
              sub(/[[:space:]]+#.*$/, "", identity)
              sub(/[[:space:]]+$/, "", identity)
              pending = identity
              next
            }

            pending != "" && /^[[:space:]]*failureType:[[:space:]].*subtestsFailed/ {
              is_subtest_container = 1
              next
            }

            END {
              emit_pending()
            }
          ' full-test-output.log | LC_ALL=C sort -u > inherited-identities.txt

          identity_count=$(wc -l < inherited-identities.txt | tr -d ' ')
          echo "AUDIT_SUMMARY tests=$tests_count failures=$fail_count identities=$identity_count exit=$test_exit"
          while IFS= read -r identity; do
            [ -n "$identity" ] && echo "AUDIT_IDENTITY|$identity"
          done < inherited-identities.txt

          {
            echo "## Inherited automated-test identities"
            echo
            echo "Diagnostic only. This workflow does not alter release-gate semantics."
            echo
            echo "- Tests: $tests_count"
            echo "- Failures reported by Node: $fail_count"
            echo "- Leaf failure identities: $identity_count"
            echo "- npm test exit: $test_exit"
            echo
            echo '```text'
            cat inherited-identities.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run candidate-facing conversation debt in isolation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e

          echo "=== conversation-harness.test.js ==="
          node --test test/conversation-harness.test.js
          harness_exit=$?
          echo "ISOLATED_CONVERSATION_HARNESS_EXIT=$harness_exit"

          echo "=== conversationEngineParity.test.js ==="
          node --test test/conversationEngineParity.test.js
          parity_exit=$?
          echo "ISOLATED_CONVERSATION_PARITY_EXIT=$parity_exit"

          echo "=== dataConsentOrderReplay.test.js ==="
          node --test test/dataConsentOrderReplay.test.js
          consent_exit=$?
          echo "ISOLATED_CONSENT_ORDER_REPLAY_EXIT=$consent_exit"

          exit 0

      - name: Print high-impact conversation snapshots
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          process.env.NODE_ENV = 'test';
          process.env.OPENAI_API_KEY = 'test-openai-key';
          process.env.USE_CONVERSATION_ENGINE = 'true';
          process.env.META_PHONE_NUMBER_ID = 'meta-phone-id';
          process.env.META_ACCESS_TOKEN = 'meta-access-token';
          process.env.LORREN_SEND_DELAY_MS = '0';

          const { conversationCases } = await import('./test/fixtures/conversationCases.js');
          const { runConversationCase } = await import('./test/helpers/conversationHarness.js');
          const { processText } = await import('./src/routes/webhook.js');
          const { createDebugTrace } = await import('./src/services/debugTrace.js');

          const selected = new Set([
            'ibague-flow-name-correction-and-transport-list',
            'funza-bodega-city-does-not-become-name-and-resolves-vacancy',
            'bodega-data-block-keeps-name-doc-and-transport',
            'future-birthday-keeps-current-age-and-does-not-repeat-transport',
            'ibague-greeting-interest-does-not-become-name-and-name-correction-advances',
            'human-intervention-pauses-bot',
            'female-pipeline-after-cv',
            'scheduling-offer-reschedule-confirm',
            'document-exception-pauses-for-manual-review',
            'done-step-followup-about-previous-application-gets-status-ack',
            'ask-cv-out-of-scope-question-pauses-for-dev-review',
            'scheduled-arrival-problem-pauses-for-manual-review-without-reply',
            'scheduled-question-uses-context-instead-of-repeating-flow'
          ]);

          for (const conversationCase of conversationCases.filter((item) => selected.has(item.id))) {
            const result = await runConversationCase(conversationCase, {
              processText,
              createDebugTrace,
              assertExpectations: false
            });
            const candidate = result.candidate || {};
            const compactCandidate = {
              status: candidate.status,
              currentStep: candidate.currentStep,
              vacancyId: candidate.vacancyId,
              fullName: candidate.fullName,
              documentType: candidate.documentType,
              documentNumber: candidate.documentNumber,
              age: candidate.age,
              neighborhood: candidate.neighborhood,
              locality: candidate.locality,
              medicalRestrictions: candidate.medicalRestrictions,
              transportMode: candidate.transportMode,
              hasCv: Boolean(candidate.cvData || candidate.cvStorageKey),
              botPaused: candidate.botPaused,
              botPauseReason: candidate.botPauseReason,
              botResumeMode: candidate.botResumeMode,
              reminderState: candidate.reminderState
            };
            const outbound = (result.outbound || []).map((message) => ({
              body: message.body,
              source: message?.rawPayload?.source || null
            }));
            console.log(`AUDIT_CASE|${conversationCase.id}|${JSON.stringify({ steps: conversationCase.steps, candidate: compactCandidate, outbound })}`);
          }
          NODE
