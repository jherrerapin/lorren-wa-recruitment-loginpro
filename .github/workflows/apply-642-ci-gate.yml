name: Apply vacancy age CI gate

on:
  push:
    branches:
      - fix/642-vacancy-age-authority-v2

permissions:
  contents: write

jobs:
  apply-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Apply guarded CI patch
        run: node scripts/apply-642-ci-gate.mjs

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-642-ci-gate.mjs
          rm .github/workflows/apply-642-ci-gate.yml

      - name: Commit CI gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml scripts/apply-642-ci-gate.mjs .github/workflows/apply-642-ci-gate.yml
          git commit -m "test: bloquear regresiones de edad por vacante"
          git push origin HEAD:${GITHUB_REF_NAME}
