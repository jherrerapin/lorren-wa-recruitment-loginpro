name: Issue 775 city parity

on:
  pull_request:
    branches:
      - automation/775-city-parity-validation

permissions:
  contents: read

jobs:
  validate-city-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_test
      LORREN_SEND_DELAY_MS: 0
      BASELINE_SHA: 231cd566abc3e9bb275df0a164d21c2252a910c9
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Capture exact baseline suite
        shell: bash
        run: |
          git worktree add /tmp/issue-775-base "$BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/issue-775-base/node_modules
          set +e
          (cd /tmp/issue-775-base && npm test) > /tmp/baseline.log 2>&1
          baseline_exit=$?
          set -e
          grep '^not ok' /tmp/baseline.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/baseline.failures || true
          echo "BASELINE_EXIT=$baseline_exit" >> "$GITHUB_ENV"

      - name: Validate focused city matrix
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            node --check test/fixtures/conversationParityCases.js
            node --check test/conversationEngineParity.test.js
            node --test test/conversationEngineParity.test.js test/vacancyFirstGate.test.js test/cityVacancyCrossAssignment.test.js
          } > /tmp/issue-775-focused.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-775-focused.log
          exit "$status"

      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-775-city-parity-log
          path: /tmp/issue-775-focused.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after focused failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Compare full suite with exact baseline
        shell: bash
        run: |
          set +e
          npm test > /tmp/head.log 2>&1
          head_exit=$?
          set -e
          grep '^not ok' /tmp/head.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/head.failures || true
          if ! diff -u /tmp/baseline.failures /tmp/head.failures; then
            echo 'La cobertura de ciudad cambió la lista de fallos de la base.'
            exit 1
          fi
          if [ "$BASELINE_EXIT" = "0" ] && [ "$head_exit" != "0" ]; then
            exit 1
          fi

      - name: Validate clean diff
        run: git diff --check "$BASELINE_SHA"...HEAD
