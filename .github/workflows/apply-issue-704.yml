name: Apply issue 704 WhatsApp thanks evidence

on:
  pull_request:
    branches:
      - automation/704-whatsapp-thanks-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/704-whatsapp-thanks-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          ref: fix/704-whatsapp-thanks-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Load exact correction
        run: |
          git fetch origin automation/704-whatsapp-thanks-runner
          git show origin/automation/704-whatsapp-thanks-runner:.github/scripts/apply-issue-704.py > /tmp/apply-issue-704.py

      - name: Apply exact correction
        run: |
          python3 /tmp/apply-issue-704.py
          rm -f .github/issue-704-trigger.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate focused correction
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/dispatchWhatsappWebServiceV6.js
          node --check test/dispatchWhatsappRuntimeContracts.test.js
          node --test test/dispatchWhatsappRuntimeContracts.test.js
          git diff --check

      - name: Commit canonical correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: exigir evidencia entrante para Gracias de despacho (#704)"
          git push origin HEAD:fix/704-whatsapp-thanks-evidence
