name: Apply city vacancy safety fix

on:
  push:
    branches:
      - fix/city-vacancy-cross-assignment
    paths:
      - .github/workflows/apply-city-vacancy-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/city-vacancy-cross-assignment
          fetch-depth: 0

      - name: Patch resolver and add regression tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          resolver_path = Path('src/services/vacancyResolver.js')
          source = resolver_path.read_text(encoding='utf-8')
          old = """const CITY_ALIASES = [
            { value: 'Bogota', aliases: ['bogota'] },
            { value: 'Ibague', aliases: ['ibague'] }
          ];"""
          new = """// Catálogo de ciudades reconocibles aunque todavía no exista una vacante para ellas.
          // Evita que una ciudad sin operación se pierda y que el cargo se compare contra
          // vacantes activas de otras ciudades.
          const CITY_ALIASES = [
            { value: 'Bogota', aliases: ['bogota'] },
            { value: 'Ibague', aliases: ['ibague'] },
            { value: 'Medellin', aliases: ['medellin'] },
            { value: 'Cali', aliases: ['cali', 'santiago de cali'] },
            { value: 'Barranquilla', aliases: ['barranquilla'] },
            { value: 'Cartagena', aliases: ['cartagena', 'cartagena de indias'] },
            { value: 'Bucaramanga', aliases: ['bucaramanga'] },
            { value: 'Cucuta', aliases: ['cucuta', 'san jose de cucuta'] },
            { value: 'Santa Marta', aliases: ['santa marta'] },
            { value: 'Pereira', aliases: ['pereira'] },
            { value: 'Manizales', aliases: ['manizales'] },
            { value: 'Armenia', aliases: ['armenia'] },
            { value: 'Neiva', aliases: ['neiva'] },
            { value: 'Villavicencio', aliases: ['villavicencio'] },
            { value: 'Pasto', aliases: ['pasto', 'san juan de pasto'] },
            { value: 'Monteria', aliases: ['monteria'] },
            { value: 'Sincelejo', aliases: ['sincelejo'] },
            { value: 'Valledupar', aliases: ['valledupar'] },
            { value: 'Tunja', aliases: ['tunja'] },
            { value: 'Popayan', aliases: ['popayan'] },
            { value: 'Florencia', aliases: ['florencia'] },
            { value: 'Riohacha', aliases: ['riohacha'] },
            { value: 'Quibdo', aliases: ['quibdo'] },
            { value: 'Yopal', aliases: ['yopal'] },
            { value: 'Arauca', aliases: ['arauca'] },
            { value: 'Leticia', aliases: ['leticia'] },
            { value: 'Mocoa', aliases: ['mocoa'] },
            { value: 'San Andres', aliases: ['san andres'] },
            { value: 'Puerto Carreno', aliases: ['puerto carreno'] },
            { value: 'Inirida', aliases: ['inirida'] },
            { value: 'San Jose del Guaviare', aliases: ['san jose del guaviare'] },
            { value: 'Buenaventura', aliases: ['buenaventura'] },
            { value: 'Palmira', aliases: ['palmira'] },
            { value: 'Soacha', aliases: ['soacha'] },
            { value: 'Bello', aliases: ['bello'] },
            { value: 'Envigado', aliases: ['envigado'] },
            { value: 'Itagui', aliases: ['itagui'] },
            { value: 'Rionegro', aliases: ['rionegro', 'rio negro'] },
            { value: 'Apartado', aliases: ['apartado'] },
            { value: 'Duitama', aliases: ['duitama'] },
            { value: 'Sogamoso', aliases: ['sogamoso'] },
            { value: 'Girardot', aliases: ['girardot'] },
            { value: 'Fusagasuga', aliases: ['fusagasuga'] },
            { value: 'Facatativa', aliases: ['facatativa'] },
            { value: 'Zipaquira', aliases: ['zipaquira'] }
          ];"""
          if old not in source:
              raise SystemExit('No se encontró el bloque CITY_ALIASES esperado; no se aplicó un cambio inseguro.')
          resolver_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('test/cityVacancyCrossAssignment.test.js')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { detectCityFromText, resolveVacancyFromText } from '../src/services/vacancyResolver.js';
          import {
            FUTURE_PROFILE_OFFER_MODE,
            resolveVacancyFirstGate,
            VacancyFirstGateAction
          } from '../src/services/vacancyFirstGate.js';

          const neivaOperation = {
            id: 'op-neiva',
            name: 'Operacion Neiva',
            city: { id: 'city-neiva', name: 'Neiva' }
          };

          const activeNeivaVacancy = {
            id: 'vac-neiva-cargue',
            title: 'Auxiliar de Cargue y Descargue Neiva',
            role: 'Auxiliar de cargue y descargue',
            city: 'Neiva',
            operation: neivaOperation,
            operationAddress: 'Sector Las Brisas',
            roleDescription: 'Apoyo en cargue y descargue de mercancia.',
            isActive: true,
            acceptingApplications: true
          };

          test('detecta Medellin aunque no exista una vacante configurada en esa ciudad', () => {
            const city = detectCityFromText('Hola, busco vacantes de empleo en Medellín', ['Neiva']);
            assert.equal(city, 'Medellin');
          });

          test('Medellin + cargue y descargue no se cruza con la vacante activa de Neiva', async () => {
            const resolution = await resolveVacancyFromText(
              null,
              ['Hola para saber si tienen vacantes de empleo en medellín?', 'Medellín', 'Cargue y descargue'].join('\\n'),
              {
                activeVacancies: [activeNeivaVacancy],
                allVacancies: [activeNeivaVacancy]
              }
            );

            assert.equal(resolution.resolved, false);
            assert.equal(resolution.vacancy, null);
            assert.equal(resolution.city, 'Medellin');
            assert.equal(resolution.roleHint, 'cargue descargue');
            assert.equal(resolution.reason, 'city_without_active_vacancies');
          });

          test('la compuerta inicial responde sin vacantes en Medellin y no asigna Neiva', async () => {
            const decision = await resolveVacancyFirstGate({
              prisma: null,
              candidate: {
                id: 'cand-medellin',
                status: 'NUEVO',
                currentStep: 'GREETING_SENT',
                vacancyId: null,
                botResumeMode: null
              },
              currentVacancy: null,
              inboundText: 'Cargue y descargue',
              currentStep: 'GREETING_SENT',
              recentMessages: [
                { direction: 'INBOUND', body: 'Hola para saber si tienen vacantes de empleo en medellín?' },
                {
                  direction: 'OUTBOUND',
                  body: 'Hola, gracias por comunicarte con LoginPro. ¿Desde qué ciudad nos escribes y para qué vacante?',
                  rawPayload: {
                    source: 'vacancy_first_gate',
                    replyKind: 'ASK_CITY_AND_ROLE',
                    reason: 'VACANCY_NOT_RESOLVED'
                  }
                },
                { direction: 'INBOUND', body: 'Medellín' }
              ],
              vacancyHints: {
                activeVacancies: [activeNeivaVacancy],
                allVacancies: [activeNeivaVacancy]
              }
            });

            assert.equal(decision.action, VacancyFirstGateAction.REPLY);
            assert.equal(decision.reason, 'CITY_WITHOUT_ACTIVE_VACANCIES');
            assert.equal(decision.resolution.city, 'Medellin');
            assert.equal(decision.resolution.reason, 'city_without_active_vacancies');
            assert.equal(decision.candidateUpdates.vacancyId, undefined);
            assert.equal(decision.candidateUpdates.botResumeMode, FUTURE_PROFILE_OFFER_MODE);
            assert.match(decision.reply, /no tengo vacantes activas en Medellin/i);
            assert.doesNotMatch(decision.reply, /Neiva/i);
          });
          """, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run regression test
        run: npm test -- test/cityVacancyCrossAssignment.test.js

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-city-vacancy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/vacancyResolver.js test/cityVacancyCrossAssignment.test.js .github/workflows/apply-city-vacancy-fix.yml
          git commit -m "fix: prevent vacancy assignment across cities"
          git push origin HEAD:fix/city-vacancy-cross-assignment
