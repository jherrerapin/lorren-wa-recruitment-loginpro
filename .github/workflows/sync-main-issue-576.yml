name: Sync main for issue 576

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'fix/576-whatsapp-stuck-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/576-whatsapp-stuck-recovery
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/sync-main-issue-576.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate synchronized correction
        run: |
          node --check src/routes/dispatchWaRouterV2.js
          node --check src/services/dispatchWhatsappWebService.js
          node --check src/services/dispatchWhatsappWebServiceV6.js
          node --check test/dispatchWhatsappRuntimeContracts.test.js
          node --test test/dispatchWhatsappRuntimeContracts.test.js

      - name: Commit workflow cleanup and push
        shell: bash
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: retirar sincronizador temporal #576"
          fi
          git push origin HEAD:fix/576-whatsapp-stuck-recovery
