name: Apply Candidate multiline docs

on:
  push:
    branches:
      - refactor/501-candidate-multiline-authority
    paths:
      - scripts/apply-candidate-multiline-docs.mjs
      - .github/workflows/apply-candidate-multiline-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Apply exact docs and CI patch
        run: node scripts/apply-candidate-multiline-docs.mjs

      - name: Validate authority tests
        run: |
          node --test test/candidateMultilineStateService.test.js test/candidateProgressAuthority.test.js
          git diff --check

      - name: Commit docs and CI and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: cerrar migración de autoridad multilinea"
          git push origin HEAD:refactor/501-candidate-multiline-authority
