          replace_once('src/routes/dispatchMultiShiftRequests.js', '  });\n\n  const updatedKey = nextGroupCode || existingRequests[0]?.id;', "  });\n\n  if (createdRequestIds.length) {\n    await autoAssignServiceRequests(prisma, createdRequestIds, {\n      createdByUsername: 'AUTO_HISTORY'\n    });\n  }\n\n  const updatedKey = nextGroupCode || existingRequests[0]?.id;")
          replace_once('src/views/operacionesPersonalNuevo.ejs', '            <div class="field"><label for="transportMode">Medio de transporte <span class="muted">* opcional</span></label><select id="transportMode" name="transportMode"><option value="" <%= !normalizedTransportMode ? \'selected\' : \'\' %>>Sin dato</option><option value="Publico" <%= normalizedTransportMode === \'Publico\' ? \'selected\' : \'\' %>>Publico</option><option value="Moto" <%= normalizedTransportMode === \'Moto\' ? \'selected\' : \'\' %>>Moto</option><option value="Bicicleta" <%= normalizedTransportMode === \'Bicicleta\' ? \'selected\' : \'\' %>>Bicicleta</option><option value="Carro" <%= normalizedTransportMode === \'Carro\' ? \'selected\' : \'\' %>>Carro</option></select><small class="muted">Bus, TransMilenio, SITP y colectivo se agrupan como Publico.</small></div>\n            <div class="field"><label for="operationalStatus">Estado operativo', '            <div class="field"><label for="transportMode">Medio de transporte <span class="muted">* opcional</span></label><select id="transportMode" name="transportMode"><option value="" <%= !normalizedTransportMode ? \'selected\' : \'\' %>>Sin dato</option><option value="Publico" <%= normalizedTransportMode === \'Publico\' ? \'selected\' : \'\' %>>Publico</option><option value="Moto" <%= normalizedTransportMode === \'Moto\' ? \'selected\' : \'\' %>>Moto</option><option value="Bicicleta" <%= normalizedTransportMode === \'Bicicleta\' ? \'selected\' : \'\' %>>Bicicleta</option><option value="Carro" <%= normalizedTransportMode === \'Carro\' ? \'selected\' : \'\' %>>Carro</option></select><small class="muted">Bus, TransMilenio, SITP y colectivo se agrupan como Publico.</small></div>\n            <div class="field"><label for="contractType">Tipo de contrato <span class="muted">* obligatorio</span></label><select id="contractType" name="contractType" required><option value="DIRECTO" <%= !w.contractType || w.contractType === \'DIRECTO\' ? \'selected\' : \'\' %>>Directo</option><option value="CONTRATISTA" <%= w.contractType === \'CONTRATISTA\' ? \'selected\' : \'\' %>>Contratista</option></select></div>\n            <div class="field"><label for="operationalStatus">Estado operativo')
          replace_once('src/views/operacionesAsignacionesConfirmacion.ejs', '.chip.same-day-assignment{background:#f59e0b;color:#fff;font-size:9px;padding:2px 6px}', '.chip.same-day-assignment{background:#f59e0b;color:#fff;font-size:9px;padding:2px 6px}.contract-value{display:inline-flex;align-items:center;border-radius:999px;padding:1px 6px;background:#f3e8ff;color:#6b21a8;font-size:9px;font-weight:900;line-height:1.15}')
          replace_once('src/views/operacionesAsignacionesConfirmacion.ejs', "  <% const assignmentLabel=(v)=>({ASSIGNED:'Asignado',CONFIRMATION_PENDING:'Pendiente de confirmación',CONFIRMED:'Confirmado',NO_CONFIRMO:'No confirmó',CANCELLED:'Cancelado'}[v]||v||'Asignado'); %>", "  <% const assignmentLabel=(v)=>({ASSIGNED:'Asignado',CONFIRMATION_PENDING:'Pendiente de confirmación',CONFIRMED:'Confirmado',NO_CONFIRMO:'No confirmó',CANCELLED:'Cancelado'}[v]||v||'Asignado'); %>\n  <% const contractLabel=(v)=>v==='CONTRATISTA'?'Contratista':'Directo'; %>")
          replace_once('src/views/operacionesAsignacionesConfirmacion.ejs', '<div class="worker-main"><strong><%= worker.fullName %></strong><div class="meta"><% if(worker.transportMode){ %><span>Transporte: <%= worker.transportMode %></span><% } %></div>', '<div class="worker-main"><strong><%= worker.fullName %></strong><div class="meta"><span class="contract-value"><%= contractLabel(worker.contractType) %></span><% if(worker.transportMode){ %><span>Transporte: <%= worker.transportMode %></span><% } %></div>')
          replace_once('src/views/operacionesAsignacionesConfirmacion.ejs', '<div class="assigned-main"><strong><%= assignment.worker.fullName %></strong><div class="meta"><span><%= assignment.worker.phone || \'Sin teléfono\' %></span><span class="assignment-status-line">', '<div class="assigned-main"><strong><%= assignment.worker.fullName %></strong><div class="meta"><span><%= assignment.worker.phone || \'Sin teléfono\' %></span><span class="contract-value"><%= contractLabel(assignment.worker.contractType) %></span><span class="assignment-status-line">')
          
          Path('src/services/dispatchAutoAssignment.js').write_text("import {\n  buildDispatchServiceDateWhere,\n  dispatchServiceDateKey\n} from './dispatchDate.js';\n\nconst ACTIVE_ASSIGNMENT_STATUSES = ['ASSIGNED', 'CONFIRMATION_PENDING', 'CONFIRMED'];\nconst CONFIRMED_ASSIGNMENT_STATUS = 'CONFIRMED';\nconst AUTO_ASSIGNMENT_NOTE = 'Autoasignado por historial confirmado en esta operación.';\nconst BOGOTA_METRO_CITY_KEYS = new Set(['bogota', 'siberia', 'madrid', 'funza', 'mosquera']);\n\nfunction normalizeText(value) {\n  return String(value || '')\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/\\./g, '')\n    .replace(/\\s+/g, ' ')\n    .trim()\n    .toLowerCase();\n}\n\nfunction cityKey(value) {\n  const normalized = normalizeText(value);\n  if (!normalized) return '';\n  if (normalized.includes('bogota')) return 'bogota';\n  if (normalized.includes('siberia')) return 'siberia';\n  if (normalized.includes('madrid')) return 'madrid';\n  if (normalized.includes('funza')) return 'funza';\n  if (normalized.includes('mosquera')) return 'mosquera';\n  return normalized;\n}\n\nfunction parseTimeMinutes(value) {\n  const match = /^([01]\\d|2[0-3]):([0-5]\\d)$/.exec(String(value || ''));\n  if (!match) return null;\n  return Number(match[1]) * 60 + Number(match[2]);\n}\n\nexport function timeRangesOverlap(first = {}, second = {}) {\n  const firstStart = parseTimeMinutes(first.startTime);\n  const secondStart = parseTimeMinutes(second.startTime);\n  if (firstStart === null || secondStart === null) return false;\n\n  const firstEnd = parseTimeMinutes(first.endTime);\n  const secondEnd = parseTimeMinutes(second.endTime);\n  if (firstEnd === null || secondEnd === null) return firstStart === secondStart;\n  if (firstEnd <= firstStart || secondEnd <= secondStart) return firstStart === secondStart;\n\n  return firstStart < secondEnd && secondStart < firstEnd;\n}\n\nfunction workerMatchesRequestCity(worker, requestCityName) {\n  const requestKey = cityKey(requestCityName);\n  if (!requestKey) return true;\n\n  const workerCityKeys = new Set([\n    cityKey(worker?.residenceCity),\n    ...(worker?.cities || []).map((entry) => cityKey(entry?.city?.name))\n  ].filter(Boolean));\n\n  // Registros históricos antiguos pueden no tener todavía ciudades relacionadas.\n  if (!workerCityKeys.size) return true;\n  if (BOGOTA_METRO_CITY_KEYS.has(requestKey)) {\n    return [...workerCityKeys].some((key) => BOGOTA_METRO_CITY_KEYS.has(key));\n  }\n  return workerCityKeys.has(requestKey);\n}\n\nexport function rankHistoricalWorkers(historyAssignments = []) {\n  const byWorker = new Map();\n\n  for (const assignment of historyAssignments) {\n    const worker = assignment?.worker;\n    const workerId = assignment?.workerId || worker?.id;\n    if (!workerId || !worker || worker.operationalStatus !== 'CONTRATADO') continue;\n\n    const confirmedAt = new Date(assignment.updatedAt || assignment.createdAt || 0);\n    const timestamp = Number.isNaN(confirmedAt.getTime()) ? 0 : confirmedAt.getTime();\n    const current = byWorker.get(workerId) || {\n      workerId,\n      worker,\n      confirmedCount: 0,\n      lastConfirmedAt: 0\n    };\n    current.confirmedCount += 1;\n    current.lastConfirmedAt = Math.max(current.lastConfirmedAt, timestamp);\n    byWorker.set(workerId, current);\n  }\n\n  return [...byWorker.values()].sort((left, right) => (\n    right.confirmedCount - left.confirmedCount\n    || right.lastConfirmedAt - left.lastConfirmedAt\n    || String(left.worker?.fullName || '').localeCompare(String(right.worker?.fullName || ''), 'es')\n    || String(left.workerId).localeCompare(String(right.workerId))\n  ));\n}\n\nexport function selectAutoAssignmentCandidates({\n  rankedWorkers = [],\n  activeAssignments = [],\n  request = {},\n  limit = 0\n} = {}) {\n  const safeLimit = Math.max(0, Math.trunc(Number(limit) || 0));\n  if (!safeLimit) return [];\n\n  const assignmentsByWorker = new Map();\n  for (const assignment of activeAssignments) {\n    if (!assignmentsByWorker.has(assignment.workerId)) assignmentsByWorker.set(assignment.workerId, []);\n    assignmentsByWorker.get(assignment.workerId).push(assignment);\n  }\n\n  return rankedWorkers.filter((candidate) => {\n    if (!workerMatchesRequestCity(candidate.worker, request.cityName)) return false;\n    const workerAssignments = assignmentsByWorker.get(candidate.workerId) || [];\n    return !workerAssignments.some((assignment) => timeRangesOverlap(request, assignment.serviceRequest || assignment));\n  }).slice(0, safeLimit);\n}\n\nasync function recalculateRequestStatus(prisma, serviceRequestId) {\n  const request = await prisma.dispatchServiceRequest.findUnique({\n    where: { id: serviceRequestId },\n    select: { requiredWorkers: true }\n  });\n  if (!request) return null;\n\n  const [activeCount, confirmedCount] = await Promise.all([\n    prisma.dispatchAssignment.count({\n      where: { serviceRequestId, status: { in: ACTIVE_ASSIGNMENT_STATUSES } }\n    }),\n    prisma.dispatchAssignment.count({\n      where: { serviceRequestId, status: CONFIRMED_ASSIGNMENT_STATUS }\n    })\n  ]);\n\n  let status = 'PENDING_ASSIGNMENT';\n  if (confirmedCount >= request.requiredWorkers) status = 'ASSIGNMENT_COMPLETE';\n  else if (activeCount >= request.requiredWorkers) status = 'PENDING_CONFIRMATION';\n  else if (activeCount > 0) status = 'ASSIGNMENT_PARTIAL';\n\n  await prisma.dispatchServiceRequest.update({\n    where: { id: serviceRequestId },\n    data: { status }\n  });\n\n  return { status, activeCount, confirmedCount, requiredWorkers: request.requiredWorkers };\n}\n\nexport async function autoAssignServiceRequest(prisma, serviceRequestId, options = {}) {\n  const request = await prisma.dispatchServiceRequest.findUnique({\n    where: { id: serviceRequestId },\n    include: {\n      assignments: {\n        where: { status: { in: ACTIVE_ASSIGNMENT_STATUSES } },\n        select: { workerId: true, status: true }\n      }\n    }\n  });\n\n  if (!request?.operationPointId) return { assignedCount: 0, reason: 'missing_operation_point' };\n\n  const remainingSlots = Math.max(\n    Number(request.requiredWorkers || 0) - (request.assignments || []).length,\n    0\n  );\n  if (!remainingSlots) {\n    await recalculateRequestStatus(prisma, request.id);\n    return { assignedCount: 0, reason: 'coverage_already_assigned' };\n  }\n\n  const historyAssignments = await prisma.dispatchAssignment.findMany({\n    where: {\n      status: CONFIRMED_ASSIGNMENT_STATUS,\n      serviceRequestId: { not: request.id },\n      serviceRequest: { operationPointId: request.operationPointId },\n      worker: { operationalStatus: 'CONTRATADO' }\n    },\n    select: {\n      workerId: true,\n      createdAt: true,\n      updatedAt: true,\n      worker: {\n        select: {\n          id: true,\n          fullName: true,\n          residenceCity: true,\n          operationalStatus: true,\n          cities: {\n            select: {\n              city: { select: { name: true } }\n            }\n          }\n        }\n      }\n    }\n  });\n\n  const rankedWorkers = rankHistoricalWorkers(historyAssignments);\n  if (!rankedWorkers.length) return { assignedCount: 0, reason: 'no_confirmed_history' };\n\n  const rankedWorkerIds = rankedWorkers.map((candidate) => candidate.workerId);\n  const sameDateWhere = buildDispatchServiceDateWhere(dispatchServiceDateKey(request.serviceDate));\n  const activeAssignments = await prisma.dispatchAssignment.findMany({\n    where: {\n      workerId: { in: rankedWorkerIds },\n      serviceRequestId: { not: request.id },\n      status: { in: ACTIVE_ASSIGNMENT_STATUSES },\n      serviceRequest: { serviceDate: sameDateWhere.serviceDate }\n    },\n    select: {\n      workerId: true,\n      serviceRequest: {\n        select: {\n          id: true,\n          serviceDate: true,\n          startTime: true,\n          endTime: true\n        }\n      }\n    }\n  });\n\n  const alreadyAssignedWorkerIds = new Set((request.assignments || []).map((assignment) => assignment.workerId));\n  const candidates = selectAutoAssignmentCandidates({\n    rankedWorkers: rankedWorkers.filter((candidate) => !alreadyAssignedWorkerIds.has(candidate.workerId)),\n    activeAssignments,\n    request,\n    limit: remainingSlots\n  });\n\n  if (!candidates.length) return { assignedCount: 0, reason: 'no_eligible_history' };\n\n  const createdByUsername = options.createdByUsername || request.createdByUsername || 'AUTO_HISTORY';\n  const result = await prisma.dispatchAssignment.createMany({\n    data: candidates.map((candidate) => ({\n      serviceRequestId: request.id,\n      workerId: candidate.workerId,\n      status: 'CONFIRMATION_PENDING',\n      notes: AUTO_ASSIGNMENT_NOTE,\n      createdByUsername\n    })),\n    skipDuplicates: true\n  });\n\n  const status = await recalculateRequestStatus(prisma, request.id);\n  return {\n    assignedCount: result.count,\n    workerIds: candidates.map((candidate) => candidate.workerId),\n    status\n  };\n}\n\nexport async function autoAssignServiceRequests(prisma, serviceRequests = [], options = {}) {\n  const results = [];\n\n  // Secuencial: cada bloque ve las autoasignaciones previas y puede evitar cruces horarios.\n  for (const request of serviceRequests) {\n    const serviceRequestId = typeof request === 'string' ? request : request?.id;\n    if (!serviceRequestId) continue;\n    try {\n      results.push({\n        serviceRequestId,\n        ...(await autoAssignServiceRequest(prisma, serviceRequestId, options))\n      });\n    } catch (error) {\n      console.error('[DISPATCH_AUTO_ASSIGNMENT_ERROR]', {\n        serviceRequestId,\n        message: error?.message || 'unknown_error'\n      });\n      results.push({ serviceRequestId, assignedCount: 0, reason: 'error' });\n    }\n  }\n\n  return results;\n}\n", encoding='utf-8')
          Path('prisma/migrations/20260722010000_add_dispatch_worker_contract_type').mkdir(parents=True, exist_ok=True)
          Path('prisma/migrations/20260722010000_add_dispatch_worker_contract_type/migration.sql').write_text('CREATE TYPE "DispatchContractType" AS ENUM (\'DIRECTO\', \'CONTRATISTA\');\n\nALTER TABLE "DispatchWorker"\nADD COLUMN "contractType" "DispatchContractType" NOT NULL DEFAULT \'DIRECTO\';\n', encoding='utf-8')
          Path('test/dispatchWorkerContractAutoAssignment.test.js').write_text("import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport {\n  rankHistoricalWorkers,\n  selectAutoAssignmentCandidates,\n  timeRangesOverlap\n} from '../src/services/dispatchAutoAssignment.js';\n\ntest('prioriza frecuencia confirmada, recencia y nombre de forma determinista', () => {\n  const worker = (id, fullName) => ({ id, fullName, operationalStatus: 'CONTRATADO', cities: [] });\n  const history = [\n    { workerId: 'w2', worker: worker('w2', 'Beatriz'), updatedAt: '2026-07-10T10:00:00Z' },\n    { workerId: 'w1', worker: worker('w1', 'Andrés'), updatedAt: '2026-07-01T10:00:00Z' },\n    { workerId: 'w1', worker: worker('w1', 'Andrés'), updatedAt: '2026-07-02T10:00:00Z' },\n    { workerId: 'w3', worker: worker('w3', 'Camilo'), updatedAt: '2026-07-11T10:00:00Z' }\n  ];\n\n  assert.deepEqual(\n    rankHistoricalWorkers(history).map((item) => item.workerId),\n    ['w1', 'w3', 'w2']\n  );\n});\n\ntest('detecta cruces reales y permite turnos consecutivos', () => {\n  assert.equal(\n    timeRangesOverlap(\n      { startTime: '08:00', endTime: '12:00' },\n      { startTime: '11:00', endTime: '14:00' }\n    ),\n    true\n  );\n  assert.equal(\n    timeRangesOverlap(\n      { startTime: '08:00', endTime: '12:00' },\n      { startTime: '12:00', endTime: '16:00' }\n    ),\n    false\n  );\n  assert.equal(\n    timeRangesOverlap(\n      { startTime: '08:00', endTime: null },\n      { startTime: '08:00', endTime: '12:00' }\n    ),\n    true\n  );\n});\n\ntest('selecciona por ciudad y excluye auxiliares con horario cruzado', () => {\n  const rankedWorkers = [\n    {\n      workerId: 'cruce',\n      confirmedCount: 8,\n      worker: {\n        fullName: 'Cruce',\n        operationalStatus: 'CONTRATADO',\n        residenceCity: 'Bogotá',\n        cities: []\n      }\n    },\n    {\n      workerId: 'elegible',\n      confirmedCount: 5,\n      worker: {\n        fullName: 'Elegible',\n        operationalStatus: 'CONTRATADO',\n        residenceCity: 'Siberia',\n        cities: []\n      }\n    },\n    {\n      workerId: 'otra-ciudad',\n      confirmedCount: 12,\n      worker: {\n        fullName: 'Otra ciudad',\n        operationalStatus: 'CONTRATADO',\n        residenceCity: 'Neiva',\n        cities: []\n      }\n    }\n  ];\n\n  const selected = selectAutoAssignmentCandidates({\n    rankedWorkers,\n    activeAssignments: [{\n      workerId: 'cruce',\n      serviceRequest: { startTime: '09:00', endTime: '13:00' }\n    }],\n    request: { cityName: 'Bogotá D.C.', startTime: '10:00', endTime: '12:00' },\n    limit: 2\n  });\n\n  assert.deepEqual(selected.map((item) => item.workerId), ['elegible']);\n});\n\ntest('contrato y autoasignación quedan conectados al flujo real', async () => {\n  const [\n    schema,\n    migration,\n    form,\n    board,\n    opsRoute,\n    publicRoute,\n    multiShiftRoute,\n    service\n  ] = await Promise.all([\n    readFile(new URL('../prisma/schema.prisma', import.meta.url), 'utf8'),\n    readFile(new URL('../prisma/migrations/20260722010000_add_dispatch_worker_contract_type/migration.sql', import.meta.url), 'utf8'),\n    readFile(new URL('../src/views/operacionesPersonalNuevo.ejs', import.meta.url), 'utf8'),\n    readFile(new URL('../src/views/operacionesAsignacionesConfirmacion.ejs', import.meta.url), 'utf8'),\n    readFile(new URL('../src/routes/dispatchOpsExtras.js', import.meta.url), 'utf8'),\n    readFile(new URL('../src/routes/publicDispatchClient.js', import.meta.url), 'utf8'),\n    readFile(new URL('../src/routes/dispatchMultiShiftRequests.js', import.meta.url), 'utf8'),\n    readFile(new URL('../src/services/dispatchAutoAssignment.js', import.meta.url), 'utf8')\n  ]);\n\n  assert.match(schema, /enum DispatchContractType\\s*\\{[\\s\\S]*DIRECTO[\\s\\S]*CONTRATISTA[\\s\\S]*\\}/);\n  assert.match(schema, /contractType\\s+DispatchContractType\\s+@default\\(DIRECTO\\)/);\n  assert.match(migration, /ADD COLUMN \"contractType\"/);\n  assert.match(form, /name=\"contractType\"/);\n  assert.match(form, />Directo</);\n  assert.match(form, />Contratista</);\n  assert.match(board, /contractLabel\\(worker\\.contractType\\)/);\n  assert.match(board, /contractLabel\\(assignment\\.worker\\.contractType\\)/);\n  assert.match(opsRoute, /contractType:\\s*normalizeDispatchContractType\\(body\\.contractType\\)/);\n  assert.match(publicRoute, /contractType:\\s*normalizeDispatchContractType\\(body\\.contractType\\)/);\n  assert.match(multiShiftRoute, /autoAssignServiceRequests\\(prisma, createdRequests/);\n  assert.match(service, /status:\\s*'CONFIRMATION_PENDING'/);\n  assert.doesNotMatch(service, /status:\\s*'CONFIRMED'\\s*,\\s*notes:\\s*AUTO_ASSIGNMENT_NOTE/);\n});\n", encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-issue-549.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Check JavaScript syntax
        run: |
          node --check src/services/dispatchAutoAssignment.js
          node --check src/routes/dispatchMultiShiftRequests.js
          node --check src/routes/dispatchOpsExtras.js
          node --check src/routes/publicDispatchClient.js
      - name: Run focused regressions
        run: node --test test/dispatchWorkerContractAutoAssignment.test.js
      - name: Commit implementation
        shell: bash
        run: |
