          replace_once('src/routes/dispatchOpsExtras.js', "    transportMode: normalizeTransportMode(body.transportMode),\n    operationalStatus: normalizeString(body.operationalStatus) || 'CONTRATADO',", "    transportMode: normalizeTransportMode(body.transportMode),\n    contractType: normalizeDispatchContractType(body.contractType),\n    operationalStatus: normalizeString(body.operationalStatus) || 'CONTRATADO',")
          replace_once('src/routes/publicDispatchClient.js', "function normalizeString(value) {\n  if (typeof value !== 'string') return null;\n  const trimmed = value.trim();\n  return trimmed.length ? trimmed : null;\n}\n\nfunction normalizeStringList(value) {", "function normalizeString(value) {\n  if (typeof value !== 'string') return null;\n  const trimmed = value.trim();\n  return trimmed.length ? trimmed : null;\n}\n\nfunction normalizeDispatchContractType(value) {\n  const normalized = normalizeString(value);\n  return ['DIRECTO', 'CONTRATISTA'].includes(normalized) ? normalized : 'DIRECTO';\n}\n\nfunction normalizeStringList(value) {")
