name: Apply issue 549 implementation

on:
  push:
    branches:
      - feat/549-worker-contract-autoassignment
    paths:
      - .github/workflows/apply-issue-549.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/549-worker-contract-autoassignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
