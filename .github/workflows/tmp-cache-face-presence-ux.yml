name: Temporary face presence UX cache wiring

on:
  push:
    branches:
      - fix/restore-face-registration-ux

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-face-registration-ux
      - name: Add presence UX to portal shell cache
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/public/worker-portal-sw.js')
          text = path.read_text()
          text = text.replace("const CACHE_NAME = 'lorren-worker-portal-shell-v17';", "const CACHE_NAME = 'lorren-worker-portal-shell-v18';", 1)
          needle = "  '/public/worker-biometric-mobile.js',\n"
          replacement = needle + "  '/public/worker-biometric-presence-ux.js',\n"
          if text.count(needle) != 2:
              raise SystemExit('unexpected biometric mobile asset count')
          text = text.replace(needle, replacement)
          path.write_text(text)
          PY
          git rm .github/workflows/tmp-cache-face-presence-ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/public/worker-portal-sw.js
          git commit -m "fix(attendance): cache face presence UX asset"
          git push origin HEAD:fix/restore-face-registration-ux