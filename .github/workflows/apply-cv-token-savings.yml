name: Apply CV token savings

on:
  push:
    branches:
      - fix/cv-token-savings-persistent-cache
    paths:
      - .automation/apply-cv-token-savings

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-token-savings-persistent-cache
          fetch-depth: 0

      - name: Assemble validated files
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/cv-* > src/services/cvIntelligence.js
          cat .automation/test-* > test/cvTokenSavings.test.js
          mkdir -p prisma/migrations/20260801093000_add_cv_token_savings
          cp .automation/migration.sql prisma/migrations/20260801093000_add_cv_token_savings/migration.sql
          rm -rf .automation
          rm -f .codex-cv-token-savings-request.md

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          node --check src/services/cvIntelligence.js
          node --check test/cvTokenSavings.test.js
          npm ci
          DATABASE_URL='postgresql://user:pass@localhost:5432/lorren_test' npx prisma validate
          npm run build
          node --test test/cvTokenSavings.test.js test/cvIntelligenceReviewContracts.test.js test/attachmentAnalysisContract.test.js
          git diff --check

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/cvIntelligence.js test/cvTokenSavings.test.js prisma/migrations/20260801093000_add_cv_token_savings/migration.sql .automation .codex-cv-token-savings-request.md
          git commit -m 'fix: reducir consumo de tokens en análisis HV'
          git push origin HEAD:fix/cv-token-savings-persistent-cache