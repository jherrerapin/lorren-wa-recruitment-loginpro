name: tmp-align-vacancy-format-contract
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Align legacy wording assertion with structured vacancy format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/conversationIntent.test.js')
          text = path.read_text(encoding='utf-8')
          old = "  assert.match(decision.reply, /requisitos registrados/i);"
          new = "  assert.match(decision.reply, /\\*Requisitos\\*/i);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy assertion, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          npm ci
          npm run prisma:generate
      - name: Validate conversation arbitration and vacancy presentation contracts
        run: |
          node --check test/conversationIntent.test.js
          node --test test/conversationIntent.test.js test/vacancyConfiguredInformationContract.test.js test/vacancyPresentationFormatAudit.test.js test/productionPaidAdFlowRegressions.test.js
      - name: Commit validated alignment and remove temporary workflow
        run: |
          rm .github/workflows/tmp-align-vacancy-format-contract.yml
          git add test/conversationIntent.test.js .github/workflows/tmp-align-vacancy-format-contract.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: alinear contrato con formato estructurado de vacante"
          git push origin HEAD:fix/production-ad-flow-20260808
