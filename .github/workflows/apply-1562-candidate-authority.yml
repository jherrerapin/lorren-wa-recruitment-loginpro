name: Apply 1562 candidate authority

on:
  push:
    branches:
      - fix/1562-adjuntos-dedupe-outbound

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/1562-adjuntos-dedupe-outbound
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node scripts/apply-1562-candidate-authority.mjs
      - run: node --check src/services/candidateStateService.js && node --check src/services/automaticOutboundDeliveryService.js
      - run: |
          git rm .github/workflows/apply-1562-candidate-authority.yml scripts/apply-1562-candidate-authority.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/candidateStateService.js src/services/automaticOutboundDeliveryService.js
          git commit -m 'fix(bot): consolidar timestamp outbound en CandidateStateService #1562'
          git push origin HEAD:fix/1562-adjuntos-dedupe-outbound
