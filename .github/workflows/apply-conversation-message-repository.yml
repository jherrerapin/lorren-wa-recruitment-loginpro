name: Apply conversation message repository migration

on:
  push:
    branches:
      - refactor/440-conversation-message-repository

permissions:
  contents: write

concurrency:
  group: apply-conversation-message-repository
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/440-conversation-message-repository
          fetch-depth: 0

      - name: Apply exact gate migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/dataConsentGate.js')
          source = path.read_text()
          import_anchor = "import { recordCandidateDataConsent } from './consentStateService.js';\n"
          import_block = """import {
            persistInboundConversationMessage,
            persistOutboundConversationMessage
          } from './conversationMessageRepository.js';
          """

          if import_block not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor missing')
              source = source.replace(import_anchor, import_anchor + import_block, 1)

          old_inbound = """async function saveInboundConsentEvidence(prisma, candidateId, message, body, decision) {
            const waMessageId = message?.id || null;
            const result = await prisma.message.createMany({
              data: [{
                candidateId,
                waMessageId,
                direction: MessageDirection.INBOUND,
                messageType: inboundMessageType(message),
                body,
                rawPayload: {
                  source: 'data_consent_gate',
                  consentVersion: DATA_CONSENT_VERSION,
                  consentDecision: decision,
                  waMessageId
                }
              }],
              skipDuplicates: true
            });
            return result.count > 0;
          }
          """
          new_inbound = """async function saveInboundConsentEvidence(prisma, candidateId, message, body, decision) {
            const waMessageId = message?.id || null;
            const result = await persistInboundConversationMessage(prisma, {
              candidateId,
              waMessageId,
              messageType: inboundMessageType(message),
              body,
              rawPayload: {
                source: 'data_consent_gate',
                consentVersion: DATA_CONSENT_VERSION,
                consentDecision: decision,
                waMessageId
              }
            });
            return result.created;
          }
          """
          if old_inbound in source:
              source = source.replace(old_inbound, new_inbound, 1)
          elif new_inbound not in source:
              raise SystemExit('inbound anchor missing')

          old_outbound = """async function saveOutboundConsentGateMessage(prisma, candidateId, body, source, extraPayload = {}) {
            await prisma.message.create({
              data: {
                candidateId,
                direction: MessageDirection.OUTBOUND,
                messageType: MessageType.TEXT,
                body,
                rawPayload: { source, body, consentVersion: DATA_CONSENT_VERSION, ...extraPayload }
              }
            });
            await prisma.candidate.update({ where: { id: candidateId }, data: { lastOutboundAt: new Date() } });
          }
          """
          new_outbound = """async function saveOutboundConsentGateMessage(prisma, candidateId, body, source, extraPayload = {}) {
            await persistOutboundConversationMessage(prisma, {
              candidateId,
              messageType: MessageType.TEXT,
              body,
              rawPayload: { source, body, consentVersion: DATA_CONSENT_VERSION, ...extraPayload }
            });
            await prisma.candidate.update({ where: { id: candidateId }, data: { lastOutboundAt: new Date() } });
          }
          """
          if old_outbound in source:
              source = source.replace(old_outbound, new_outbound, 1)
          elif new_outbound not in source:
              raise SystemExit('outbound anchor missing')

          path.write_text(source)
          PY

      - name: Commit migration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dataConsentGate.js
          git commit -m "refactor: delegar mensajes del gate en repositorio compartido"
          git push origin HEAD:refactor/440-conversation-message-repository
