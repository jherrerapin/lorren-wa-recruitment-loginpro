name: contextual-flow-guards
on:
  push:
    branches:
      - fix-contextual-flow-guards
    paths:
      - .github/workflows/contextual-flow-guards.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-contextual-flow-guards
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: patch source
        run: |
          node <<'NODE'
          const fs = require('fs');
          function rw(p, fn) {
            const a = fs.readFileSync(p, 'utf8');
            const b = fn(a);
            if (a !== b) fs.writeFileSync(p, b);
          }
          rw('src/services/chatEngine.js', s => s.replace(
            '    || currentStep === ConversationStep.DONE\n    || (vacancy && !vacancy.schedulingEnabled && readiness.readyForDone)',
            '    || currentStep === ConversationStep.DONE\n    || readiness.readyForDone\n    || Boolean(activeInterviewBooking)\n    || (vacancy && !vacancy.schedulingEnabled && readiness.readyForDone)'
          ));
          rw('src/services/conversationEngine.js', s => s
            .replace(/- Si la vacante existe pero esta inactiva o pausada,[^\n]+/, '- Si la vacante existe pero esta inactiva o pausada, no avances a captura automaticamente sin consentimiento contextual del candidato para registro de perfil. Si ese consentimiento ya fue marcado por backend, continua solo como registro para futuras aperturas, nunca como entrevista activa.')
            .replace(/- Puedes pedir datos y hoja de vida para dejar el perfil registrado por si se reactiva\./, '- No avances a captura automaticamente. Solo continua si backend ya marco consentimiento contextual para registro de perfil; nunca ofrezcas entrevista ni agenda.')
          );
          rw('src/routes/webhook.js', s => s.replace(
            'if (vacancy && !isVacancyOpen(vacancy)) {\n    if (candidate.currentStep === ConversationStep.ASK_CV) {',
            "if (vacancy && !isVacancyOpen(vacancy)) {\n    if (candidate?.botResumeMode !== 'paused_vacancy_capture') {\n      return '';\n    }\n\n    if (candidate.currentStep === ConversationStep.ASK_CV) {"
          ));
          NODE
      - name: commit
        run: |
          git config user.name openai-bot
          git config user.email openai-bot@example.com
          git add src/services/chatEngine.js src/services/conversationEngine.js src/routes/webhook.js
          git diff --cached --quiet || git commit -m "fix: harden contextual flow guards"
          git push
