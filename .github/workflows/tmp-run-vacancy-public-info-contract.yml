name: tmp-run-vacancy-public-info-contract
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: ${{ github.head_ref == 'fix/production-ad-flow-20260808' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Execute embedded runtime patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/tmp-fix-vacancy-public-info-contract.yml').read_text(encoding='utf-8')
          match = re.search(r"      - name: Patch runtime and regressions\n        run: \|\n(?P<body>.*?)\n      - run: npm ci", source, re.S)
          if not match:
              raise SystemExit('embedded patch block not found')
          body = textwrap.dedent(match.group('body')).rstrip()
          prefix = "python3 - <<'PY'\n"
          if not body.startswith(prefix) or not body.endswith('\nPY'):
              raise SystemExit('unexpected embedded patch wrapper')
          code = body[len(prefix):-3]
          exec(compile(code, '<vacancy-public-info-patch>', 'exec'), {})
          PY
      - run: npm ci
      - run: npm run prisma:generate
      - name: Validate focused contract
        run: |
          node --check src/services/vacancyPublicInfo.js
          node --check src/services/vacancyFirstGate.js
          node --check src/services/dataConsentGate.js
          node --check src/services/conversationIntent.js
          node --check src/services/conversationAudit.js
          node --test \
            test/vacancyConfiguredInformationContract.test.js \
            test/productionPaidAdFlowRegressions.test.js \
            test/vacancyFirstGate.test.js \
            test/vacancyBeforeConsentReplay.test.js \
            test/conversationAuditPaidAdRegressions.test.js
      - name: Commit validated changes and remove temporary automation
        run: |
          rm -f .github/workflows/tmp-fix-vacancy-public-info-contract.yml
          rm -f .github/workflows/tmp-run-vacancy-public-info-contract.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: respetar configuración pública de vacante antes del consentimiento"
          git push origin HEAD:${{ github.head_ref }}
