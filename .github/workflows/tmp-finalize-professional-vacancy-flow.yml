name: tmp-finalize-professional-vacancy-flow
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Apply patch
        run: python3 scripts/tmp_finalize_professional_vacancy_flow.py
      - name: Install dependencies
        run: |
          npm ci
          npm run prisma:generate
      - name: Focused validation
        run: |
          node --check src/services/vacancyPublicInfo.js
          node --check src/services/vacancyFirstGate.js
          node --check src/services/dataConsentGate.js
          node --check src/routes/webhook.js
          node --test test/vacancyConfiguredInformationContract.test.js test/vacancyPresentationFormatAudit.test.js test/productionPaidAdFlowRegressions.test.js test/vacancyFirstGate.test.js test/conversation-replay/vacancyConsentOrderReplay.js test/conversationAuditPaidAdRegressions.test.js
      - name: Commit validated changes and cleanup
        run: |
          rm .github/workflows/tmp-finalize-professional-vacancy-flow.yml
          rm scripts/tmp_finalize_professional_vacancy_flow.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: unificar presentación profesional de vacantes"
          git push origin HEAD:fix/production-ad-flow-20260808
