name: Issue 785 CV document parity

on:
  pull_request:
    branches:
      - automation/785-cv-document-parity

permissions:
  contents: write

jobs:
  validate-cv-document-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_test
      LORREN_SEND_DELAY_MS: 0
      BASELINE_SHA: 700c65c74863bd3f150effd494f86db5691c7938
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Capture exact baseline suite
        shell: bash
        run: |
          git worktree add /tmp/issue-785-base "$BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/issue-785-base/node_modules
          set +e
          (cd /tmp/issue-785-base && npm test) > /tmp/baseline.log 2>&1
          baseline_exit=$?
          set -e
          grep '^not ok' /tmp/baseline.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/baseline.failures || true
          echo "BASELINE_EXIT=$baseline_exit" >> "$GITHUB_ENV"

      - name: Apply manifest patch
        run: node .github/scripts/apply-issue-785-manifest.mjs

      - name: Validate document router parity
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            node --check test/helpers/runCvDocumentParityCase.js
            node --check test/cvDocumentParity.test.js
            node --check test/conversationEngineParity.test.js
            node --test \
              test/cvDocumentParity.test.js \
              test/conversationEngineParity.test.js \
              test/cvFlow.test.js \
              test/cvStorage.test.js \
              test/webhookIdempotency.test.js
          } > /tmp/issue-785-focused.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-785-focused.log
          exit "$status"

      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-785-cv-document-parity-log
          path: /tmp/issue-785-focused.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after focused failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Compare full suite with exact baseline
        shell: bash
        run: |
          set +e
          npm test > /tmp/head.log 2>&1
          head_exit=$?
          set -e
          grep '^not ok' /tmp/head.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/head.failures || true
          if ! diff -u /tmp/baseline.failures /tmp/head.failures; then
            echo 'La cobertura documental cambió la lista de fallos de la base.'
            exit 1
          fi
          if [ "$BASELINE_EXIT" = "0" ] && [ "$head_exit" != "0" ]; then
            exit 1
          fi

      - name: Validate clean diff
        run: git diff --check

      - name: Commit final test files
        shell: bash
        run: |
          git add test/helpers/runCvDocumentParityCase.js test/cvDocumentParity.test.js test/conversationEngineParity.test.js
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: cubrir CV recibido mediante router documental #785'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
