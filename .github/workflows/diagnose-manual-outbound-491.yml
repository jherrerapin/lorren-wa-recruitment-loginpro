name: Diagnose manual outbound integration 491

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 492 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: refactor/491-manual-outbound-delivery

      - name: Apply migration in runner
        run: python scripts/apply-manual-outbound-491.py

      - name: Install dependencies quietly
        run: npm ci --silent

      - name: Generate Prisma client quietly
        run: npm run prisma:generate --silent

      - name: Run historical admin integration
        run: node --test test/adminManualOutbound.test.js
