name: Experience 1561 regression proof

on:
  push:
    branches:
      - fix/1561-experiencia-multiproposito-una-linea

permissions:
  contents: read

jobs:
  focal-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test test/contextualExperienceMultipurposeRegression.test.js
