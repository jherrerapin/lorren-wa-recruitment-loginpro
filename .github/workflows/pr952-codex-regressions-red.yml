          npm test > /tmp/pr952/final.log 2>&1
          test_exit=$?
          set -e

          tests_count=$(awk '/^# tests [0-9]+$/ { value = $3 } END { print value }' /tmp/pr952/final.log)
          fail_count=$(awk '/^# fail [0-9]+$/ { value = $3 } END { print value }' /tmp/pr952/final.log)
