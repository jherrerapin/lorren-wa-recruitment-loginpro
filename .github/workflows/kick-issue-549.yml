name: Kick issue 549 implementation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/kick-issue-549.yml

permissions:
  contents: write

concurrency:
  group: issue-549-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/549-worker-contract-autoassignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Extract and apply prepared patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-issue-549.yml').read_text(encoding='utf-8').splitlines()
          marker = next(index for index, line in enumerate(source) if line.strip() == "python3 <<'PY'")
          prefix = source[marker][:len(source[marker]) - len(source[marker].lstrip())]
          end = next(index for index in range(marker + 1, len(source)) if source[index].strip() == 'PY')
          script = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in source[marker + 1:end]) + '\n'
          Path('/tmp/apply-issue-549.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-issue-549.py
      - name: Remove temporary workflows from proposed tree
        run: rm .github/workflows/apply-issue-549.yml .github/workflows/kick-issue-549.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema and capture diagnostic
        shell: bash
        run: |
          set +e
          npx prisma validate > issue-549-prisma-validation.txt 2>&1
          status=$?
          cat issue-549-prisma-validation.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue-549-prisma-validation.txt
            git commit -m "chore: registrar diagnóstico Prisma del issue #549"
            git push origin HEAD:feat/549-worker-contract-autoassignment
            exit "$status"
          fi
          rm issue-549-prisma-validation.txt
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Check JavaScript syntax
        run: |
          node --check src/services/dispatchAutoAssignment.js
          node --check src/routes/dispatchMultiShiftRequests.js
          node --check src/routes/dispatchOpsExtras.js
          node --check src/routes/publicDispatchClient.js
      - name: Run focused regressions
        run: node --test test/dispatchWorkerContractAutoAssignment.test.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: agregar contrato y autoasignación histórica (#549)"
          git push origin HEAD:feat/549-worker-contract-autoassignment
