name: Validate structural age evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-characterize:
    if: github.head_ref == 'fix/607-age-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact age evidence patch
        run: node scripts/apply-607-age-evidence.mjs

      - name: Validate syntax
        run: |
          node --check src/services/ageEvidence.js
          node --check src/services/candidateData.js
          node --check src/services/fieldSanitizer.js
          node --check test/candidateAgeEvidence.test.js

      - name: Run focused age evidence regressions
        run: node --test test/candidateAgeEvidence.test.js

      - name: Run existing parser and sanitizer regressions
        run: |
          node --test test/candidateData.test.js
          node --test test/fieldSanitizer.test.js
          node --test test/conversationUnderstanding.test.js test/conversationNormalizationCharacterization.test.js

      - name: Commit generated runtime patch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/services/candidateData.js src/services/fieldSanitizer.js
            git commit -m "fix: exigir evidencia estructural para la edad"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Characterize harness after age repair
        run: |
          mkdir -p diagnostics
          set +e
          node --test test/conversation-harness.test.js > diagnostics/607-harness.tap 2>&1
          status=$?
          set -e
          grep -E '^    not ok [0-9]+ - ' diagnostics/607-harness.tap | sed 's/^    //' > diagnostics/607-remaining-failures.txt || true
          count=$(wc -l < diagnostics/607-remaining-failures.txt | tr -d ' ')
          printf 'status=%s\nremaining_failures=%s\nprevious_failures=24\n' "$status" "$count" > diagnostics/607-harness-summary.txt
          if grep -q 'experience-headcount-number-does-not-trigger-age-rejection' diagnostics/607-remaining-failures.txt; then
            echo "The target age corruption scenario still fails."
            exit 1
          fi
          if [ "$count" -ge 24 ]; then
            echo "Age repair did not reduce the failing corpus."
            exit 1
          fi

      - name: Commit harness characterization
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/607-harness.tap diagnostics/607-remaining-failures.txt diagnostics/607-harness-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: caracterizar harness después de #607"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Run conversation replays
        run: |
          node --test test/conversationReplayFixtures.test.js test/conversationReplayInterpretation.test.js test/conversationReplayPlanning.test.js test/conversationReplayIntegral.test.js test/conversationReplayRecovery.test.js
