name: Apply biometric marking reliability fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply focused reliability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(pathname, old, new):
              path = Path(pathname)
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{pathname}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

