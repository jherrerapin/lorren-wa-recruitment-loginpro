name: Candidate progress authority

on:
  pull_request:
    branches:
      - main
    paths:
      - prisma/schema.prisma
      - src/services/candidateStateService.js
      - src/services/consentStateService.js
      - src/services/dataConsentGate.js
      - src/services/conversationEngine.js
      - src/services/chatEngine.js
      - src/routes/webhook.js
      - config/candidate-progress-authority.json
      - docs/architecture/candidate-state-transition-inventory.md
      - test/candidateMultilineStateService.test.js
      - test/candidateConversationStepStateService.test.js
      - test/candidateNoInterestStateService.test.js
      - test/candidateRequirementRejectionStateService.test.js
      - test/candidateExplicitPauseStateService.test.js
      - test/candidateConsentStepStateService.test.js
      - test/candidateVacancyFirstGateStateService.test.js
      - test/candidateSilentProfileCaptureStateService.test.js
      - test/consentStateService.test.js
      - test/dataConsentGateConsentStepAuthority.test.js
      - test/webhookVacancyFirstGateAuthority.test.js
      - test/webhookSilentProfileCaptureAuthority.test.js
      - test/turnOrchestratorContracts.test.js
      - test/conversationEngineNoInterestAuthority.test.js
      - test/conversationEngineRequirementRejectionAuthority.test.js
      - test/conversationEngineExplicitPauseAuthority.test.js
      - test/conversationEngineStepAuthority.test.js
      - test/conversationEngineGuardRails.test.js
      - test/candidateProgressAuthority.test.js
      - .github/workflows/candidate-progress-authority.yml
  push:
    branches:
      - main
    paths:
      - prisma/schema.prisma
      - src/services/candidateStateService.js
      - src/services/consentStateService.js
      - src/services/dataConsentGate.js
      - src/services/conversationEngine.js
      - src/services/chatEngine.js
      - src/routes/webhook.js
      - config/candidate-progress-authority.json
      - docs/architecture/candidate-state-transition-inventory.md
      - test/candidateMultilineStateService.test.js
      - test/candidateConversationStepStateService.test.js
      - test/candidateNoInterestStateService.test.js
      - test/candidateRequirementRejectionStateService.test.js
      - test/candidateExplicitPauseStateService.test.js
      - test/candidateConsentStepStateService.test.js
      - test/candidateVacancyFirstGateStateService.test.js
      - test/candidateSilentProfileCaptureStateService.test.js
      - test/consentStateService.test.js
      - test/dataConsentGateConsentStepAuthority.test.js
      - test/webhookVacancyFirstGateAuthority.test.js
      - test/webhookSilentProfileCaptureAuthority.test.js
      - test/turnOrchestratorContracts.test.js
      - test/conversationEngineNoInterestAuthority.test.js
      - test/conversationEngineRequirementRejectionAuthority.test.js
      - test/conversationEngineExplicitPauseAuthority.test.js
      - test/conversationEngineStepAuthority.test.js
      - test/conversationEngineGuardRails.test.js
      - test/candidateProgressAuthority.test.js
      - .github/workflows/candidate-progress-authority.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-progress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Candidate progress authority
        run: node --test test/candidateMultilineStateService.test.js test/candidateConversationStepStateService.test.js test/candidateNoInterestStateService.test.js test/candidateRequirementRejectionStateService.test.js test/candidateExplicitPauseStateService.test.js test/candidateConsentStepStateService.test.js test/candidateVacancyFirstGateStateService.test.js test/candidateSilentProfileCaptureStateService.test.js test/consentStateService.test.js test/dataConsentGateConsentStepAuthority.test.js test/webhookVacancyFirstGateAuthority.test.js test/webhookSilentProfileCaptureAuthority.test.js test/turnOrchestratorContracts.test.js test/conversationEngineNoInterestAuthority.test.js test/conversationEngineRequirementRejectionAuthority.test.js test/conversationEngineExplicitPauseAuthority.test.js test/conversationEngineStepAuthority.test.js test/conversationEngineGuardRails.test.js test/candidateProgressAuthority.test.js
