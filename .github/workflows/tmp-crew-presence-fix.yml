name: Temporary crew presence fix

on:
  push:
    branches:
      - fix/android-crew-bluetooth-optimistic-sync

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/android-crew-bluetooth-optimistic-sync
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python3 .github/tmp/apply-crew-presence-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: node --test test/workerPortalAndroidNativePresence.test.js test/workerPortalCrewOfflineRetry.test.js test/workerPortalCrewPresenceCredential.test.js test/workerPortalAndroidCrewMemberProgressionRegression.test.js test/workerPortalAndroidCrewOfflineBleRegression.test.js

      - name: Commit final tree
        run: |
          rm .github/workflows/tmp-crew-presence-fix.yml
          rm .github/tmp/apply-crew-presence-fix.py
          git config user.name "lorren-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): preserve verified crew marks through sync"
          git push origin HEAD:fix/android-crew-bluetooth-optimistic-sync
