name: Apply candidate conversation release repair

on:
  push:
    branches:
      - fix/candidate-conversation-release-gaps

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/candidate-conversation-release-gaps
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply focused repair
        run: python3 scripts/repair_candidate_conversation_release.py

      - name: Validate focused repair
        run: |
          node --check src/services/contextualResponseGate.js
          node --check src/routes/webhook.js
          node --check test/helpers/conversationHarness.js
          node --check test/conversation-replay/consentOrderReplay.js
          node --check test/candidateConversationReleaseGaps.test.js
          node --test test/candidateConversationReleaseGaps.test.js
          node --test test/dataConsentOrderReplay.test.js

      - name: Commit validated repair
        run: |
          rm .github/workflows/candidate-conversation-repair.yml
          rm scripts/repair_candidate_conversation_release.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(conversation): close candidate release gaps"
          git push origin HEAD:fix/candidate-conversation-release-gaps
