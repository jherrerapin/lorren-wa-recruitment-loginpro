name: Apply reminder message repository migration

on:
  push:
    branches:
      - refactor/442-reminder-message-repository

permissions:
  contents: write

concurrency:
  group: apply-reminder-message-repository
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/442-reminder-message-repository
          fetch-depth: 0

      - name: Apply exact reminder migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/reminder.js')
          source = path.read_text()
          import_anchor = "import { enqueueJob, JOB_TYPES } from './jobQueue.js';\n"
          import_line = "import { persistOutboundConversationMessage } from './conversationMessageRepository.js';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor missing')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old = """async function storeOutbound(prisma, candidateId, body, metadata = {}) {
            await prisma.message.create({
              data: {
                candidateId,
                direction: 'OUTBOUND',
                messageType: 'TEXT',
                body,
                rawPayload: metadata
              }
            });
          }
          """
          new = """async function storeOutbound(prisma, candidateId, body, metadata = {}) {
            await persistOutboundConversationMessage(prisma, {
              candidateId,
              messageType: 'TEXT',
              body,
              rawPayload: metadata
            });
          }
          """
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('storeOutbound anchor missing')

          path.write_text(source)
          PY

      - name: Commit migration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/reminder.js
          git commit -m "refactor: delegar mensajes de recordatorio en repositorio compartido"
          git push origin HEAD:refactor/442-reminder-message-repository
