name: Validate BLE advertiser capability
on:
  push:
    branches:
      - fix/android-ble-discovery-rfcomm
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-ble-discovery-rfcomm
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply capability correction
        run: python .github/tmp/fix-ble-capability.py
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Run focused Bluetooth regression
        run: node --test test/workerPortalAndroidRfcommResilience.test.js
      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Commit validated implementation
        run: |
          rm -f .github/tmp/fix-ble-capability.py .github/workflows/fix-ble-capability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(android): alinear soporte BLE con advertiser real'
          git push origin HEAD:fix/android-ble-discovery-rfcomm
