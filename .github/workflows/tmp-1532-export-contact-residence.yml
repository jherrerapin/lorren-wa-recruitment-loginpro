name: Temporary 1532 export contact residence

on:
  push:
    branches:
      - fix/1532-export-contact-residence
    paths:
      - .github/workflows/tmp-1532-export-contact-residence.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1532-export-contact-residence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Normalize focused export formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/admin.js')
          source = path.read_text()

          columns_start = source.index('    sheet.columns = [', source.index("router.get('/export'"))
          loop_start = source.index('    for (const c of candidates) {', columns_start)
          columns = '\n'.join([
              '    sheet.columns = [',
              "      { header: 'Fecha registro', key: 'createdAt', width: 20 },",
              "      { header: 'Nombre', key: 'fullName', width: 28 },",
              "      { header: 'Teléfono', key: 'phone', width: 20 },",
              "      { header: 'Doc. Tipo', key: 'documentType', width: 12 },",
              "      { header: 'Doc. Número', key: 'documentNumber', width: 18 },",
              "      { header: 'Edad', key: 'age', width: 8 },",
              '      { header: residenceConfig.labelTitle, key: residenceConfig.field, width: 20 },',
              "      { header: 'Restricciones', key: 'medicalRestrictions', width: 20 },",
              "      { header: 'Transporte', key: 'transportMode', width: 16 },",
              "      { header: 'Tiene HV', key: 'hasCV', width: 10 },",
              '    ];',
          ]) + '\n'
          source = source[:columns_start] + columns + source[loop_start:]

          loop_start = source.index('    for (const c of candidates) {', columns_start)
          auto_filter_start = source.index('    sheet.autoFilter = {', loop_start)
          loop = '\n'.join([
              '    for (const c of candidates) {',
              '      const normalizedCandidate = normalizeCandidateSnapshot(c);',
              "      const residenceValue = getCandidateResidenceValue(normalizedCandidate, vacancy) || normalizedCandidate.zone || '';",
              '      const whatsappLink = buildWhatsAppLink(normalizedCandidate.phone);',
              '      const row = sheet.addRow({',
              '        ...normalizedCandidate,',
              '        [residenceConfig.field]: residenceValue,',
              "        hasCV: candidateHasCv(normalizedCandidate) ? 'Sí' : 'No',",
              '        createdAt: formatDateTimeCO(normalizedCandidate.createdAt)',
              '      });',
              '      if (whatsappLink) {',
              "        row.getCell('phone').value = { text: normalizedCandidate.phone, hyperlink: whatsappLink };",
              '      }',
              '    }',
          ]) + '\n'
          source = source[:loop_start] + loop + source[auto_filter_start:]

          phone_start = source.index("      const phoneCell = row.getCell('phone');", loop_start)
          eachrow_end = source.index('    });', phone_start)
          phone = '\n'.join([
              "      const phoneCell = row.getCell('phone');",
              '      if (phoneCell.value?.hyperlink) {',
              "        phoneCell.font = { color: { argb: 'FF1D4ED8' }, underline: true };",
              '      }',
          ]) + '\n'
          source = source[:phone_start] + phone + source[eachrow_end:]
          path.write_text(source)
          PY
      - run: node --test test/candidateExport.test.js
      - run: node --check src/routes/admin.js
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(recruitment): normalize vacancy export block"
          git push origin HEAD:fix/1532-export-contact-residence
