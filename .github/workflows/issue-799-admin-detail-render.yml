name: Issue 799 admin detail render

on:
  pull_request:
    branches:
      - automation/799-admin-detail-render

permissions:
  contents: write

jobs:
  validate-admin-detail:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_test
      BASELINE_SHA: 9d8840a0e326ea7ebf2753f9571f4e835480f78b

    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Capture baseline failure names
        shell: bash
        run: |
          git worktree add /tmp/issue-799-base "$BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/issue-799-base/node_modules
          set +e
          (cd /tmp/issue-799-base && npm test) > /tmp/baseline.log 2>&1
          set -e
          grep '^not ok [0-9][0-9]* - ' /tmp/baseline.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/baseline.failures || true

      - name: Apply exact patch
        run: node .github/scripts/apply-issue-799.mjs

      - name: Validate focal detail contracts
        id: focal
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            node --check src/routes/admin.js
            node --test test/adminManualCv.test.js test/adminDevOnlyContracts.test.js
          } > /tmp/issue-799-focused.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-799-focused.log
          exit "$status"

      - name: Upload focal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-799-admin-detail-log
          path: /tmp/issue-799-focused.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after focal failure
        if: steps.focal.outcome == 'failure'
        run: exit 1

      - name: Compare full suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/head.log 2>&1
          set -e
          grep '^not ok [0-9][0-9]* - ' /tmp/head.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/head.failures || true
          comm -13 /tmp/baseline.failures /tmp/head.failures > /tmp/new.failures
          comm -23 /tmp/baseline.failures /tmp/head.failures > /tmp/resolved.failures
          if [ -s /tmp/new.failures ]; then
            echo 'Nuevos fallos:'
            cat /tmp/new.failures
            exit 1
          fi
          for expected in \
            'admin no ve diagnosticos tecnicos de CV en detalle' \
            'movimientos del reclutador solo aparecen en perfil dev'
          do
            grep -Fxq "$expected" /tmp/resolved.failures || {
              echo "No se resolvió el fallo esperado: $expected"
              echo 'Fallos resueltos observados:'
              cat /tmp/resolved.failures
              exit 1
            }
          done
          cat /tmp/resolved.failures

      - name: Validate diff
        run: git diff --check

      - name: Commit functional file
        shell: bash
        run: |
          git add src/routes/admin.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: completar local del detalle administrativo #799'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
