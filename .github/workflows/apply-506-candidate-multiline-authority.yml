name: Apply issue 506 patch

on:
  push:
    branches:
      - refactor/506-candidate-multiline-authority
    paths:
      - scripts/apply-506-candidate-multiline-authority.mjs

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: refactor/506-candidate-multiline-authority
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply deterministic patch
        run: node scripts/apply-506-candidate-multiline-authority.mjs

      - name: Commit generated change
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-506-candidate-multiline-authority.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: centralizar ventana multilinea de Candidate'
          git push origin HEAD:refactor/506-candidate-multiline-authority
