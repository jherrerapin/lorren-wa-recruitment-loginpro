name: tmp-fix-erratic-20260808

on:
  push:
    branches:
      - fix/production-ad-flow-20260808
    paths:
      - .github/workflows/tmp-fix-erratic-20260808.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar correcciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'No se encontró patrón: {label}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/routes/webhook.js',
              "  if (Number.isFinite(configuredDelay) && configuredDelay >= 0) return configuredDelay;",
              "  if (Number.isFinite(configuredDelay) && configuredDelay >= 0) return Math.min(configuredDelay, 5000);",
              'send delay'
          )

          p = Path('src/services/vacancyFirstGate.js')
          text = p.read_text()
          old = """function buildActiveVacancyInterestReply(vacancy = {}, inboundText = '') {
            const answer = buildVacancyInformationAnswer(vacancy, inboundText);
            return [
              answer,
              buildProfessionalVacancyPresentation(vacancy, { includeInterestPrompt: true })
            ].filter(Boolean).join('\\n\\n');
          }"""
          new = """function buildActiveVacancyInterestReply(vacancy = {}) {
            return buildProfessionalVacancyPresentation(vacancy, { includeInterestPrompt: true });
          }"""
          if old not in text:
              raise SystemExit('No se encontró patrón: presentación única')
          text = text.replace(old, new, 1)

          old = "if (currentStep === GREETING_SENT && currentVacancy && intent.affirmative) {"
          new = "if (currentStep === GREETING_SENT && currentVacancy && botResumeMode === APPLICATION_INTEREST_PENDING_MODE && intent.affirmative) {"
          if old not in text:
              raise SystemExit('No se encontró patrón: autoridad interés')
          text = text.replace(old, new, 1)

          start = text.find("    if (requiresConsentBeforeCollection(candidate)) {\n      const initialTurn = analyzeConversationTurn(inboundText);")
          marker = "      return {\n        action: VacancyFirstGateAction.REPLY,\n        reason: 'ACTIVE_VACANCY_RESOLVED_AWAIT_INTEREST',"
          if start < 0:
              raise SystemExit('No se encontró inicio del salto directo a consentimiento')
          keep = text.find(marker, start)
          if keep < 0:
              raise SystemExit('No se encontró retorno de espera de interés')
          prefix = "    if (requiresConsentBeforeCollection(candidate)) {\n"
          text = text[:start] + prefix + text[keep:]
          p.write_text(text)
          PY
      - name: Verificar
        run: |
          node --check src/routes/webhook.js
          node --check src/services/vacancyFirstGate.js
          node --check src/services/reminderPolicy.js
          node --test test/vacancyFirstGate.test.js test/productionPaidAdFlowRegressions.test.js test/dataConsentOrderRecovery.test.js test/conversationIntent.test.js
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-erratic-20260808.yml
          git add src/routes/webhook.js src/services/vacancyFirstGate.js
          git commit -m "fix(conversation): estabilizar estado y latencia del flujo"
          git push origin HEAD:fix/production-ad-flow-20260808
