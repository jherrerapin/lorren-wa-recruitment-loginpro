name: tmp-fix-erratic-20260808

on:
  push:
    branches:
      - fix/production-ad-flow-20260808
    paths:
      - .github/workflows/tmp-fix-erratic-20260808.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/tmp_fix_erratic_aug8.py
      - name: Ajustar parser sin romper casos existentes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/services/candidateData.js')
          text = p.read_text()
          old = r"  const hasShortAffirmativeContext = /\bsi(?:\s+tengo)?\b/.test(compact) && /\bmas\s+de\b/.test(compact);"
          new = r"  const hasShortAffirmativeContext = /\bsi\s+tengo\b/.test(compact) || (/\bsi\b/.test(compact) && /\bmas\s+de\b/.test(compact));"
          if old not in text:
              raise SystemExit('No se encontró contexto afirmativo parcheado')
          text = text.replace(old, new, 1)

          marker = r"  const durationRegex = /\b((?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|\d+)\s*(?:mes(?:e|es)?|a(?:\s*\w*)?os?|semana(?:s)?))\b/gi;"
          direct = r"""  const wordDurationWithExperience = compact.match(/\b((?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s*(?:mes(?:e|es)?|a(?:\s*\w*)?os?|semana(?:s)?))\s+de\s+experiencia\b/i);
          if (wordDurationWithExperience?.[1]) return normalizeExperienceDuration(wordDurationWithExperience[1]);

""" + marker
          if marker not in text:
              raise SystemExit('No se encontró durationRegex')
          text = text.replace(marker, direct, 1)
          p.write_text(text)

          p = Path('src/services/vacancyFirstGate.js')
          text = p.read_text()
          old = """    && (currentTurn.vacancyInformationRequest || currentTurn.question)
            && currentTurn.primaryIntent !== 'change_intent') {"""
          new = """    && (currentTurn.vacancyInformationRequest || currentTurn.question)
            && !currentTurn.interest
            && currentTurn.primaryIntent !== 'change_intent') {"""
          if old not in text:
              raise SystemExit('No se encontró guard de preguntas')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: node --check src/services/candidateData.js
      - run: node --check src/services/vacancyFirstGate.js
      - run: node --check src/services/reminderPolicy.js
      - run: node --test test/erraticBehaviorAug8Regression.test.js test/candidateData.test.js test/reminderPolicy.test.js test/vacancyFirstGate.test.js test/productionPaidAdFlowRegressions.test.js test/dataConsentOrderRecovery.test.js test/conversationIntent.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-erratic-20260808.yml scripts/tmp_fix_erratic_aug8.py
          git add src/services/candidateData.js src/services/vacancyFirstGate.js test/reminderPolicy.test.js test/erraticBehaviorAug8Regression.test.js
          git commit -m "fix(conversation): corregir comportamientos erráticos del 8 de agosto"
          git push origin HEAD:fix/production-ad-flow-20260808
