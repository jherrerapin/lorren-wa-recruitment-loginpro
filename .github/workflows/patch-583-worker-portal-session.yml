name: Patch issue 583 worker portal session

on:
  push:
    branches:
      - feat/583-worker-portal-session-persistence

permissions:
  contents: write

concurrency:
  group: patch-583-worker-portal-session
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feat/583-worker-portal-session-persistence
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Apply exact schema patch
        run: node scripts/patch-583-worker-portal-session.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma and focused tests
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/modules/dispatch-attendance/infrastructure/prismaWorkerPortalSessionRepository.js
          node --test test/prismaWorkerPortalSessionRepository.test.js test/workerPortalSession.test.js test/prismaPrimaryDeviceActivationRepository.test.js

      - name: Commit functional result and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-583-worker-portal-session.mjs
          rm -f .github/workflows/patch-583-worker-portal-session.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma \
            prisma/migrations/20260722173000_add_dispatch_worker_portal_session/migration.sql \
            src/modules/dispatch-attendance/infrastructure/prismaWorkerPortalSessionRepository.js \
            test/prismaWorkerPortalSessionRepository.test.js \
            docs/architecture/13_asistencia_operativa_persistencia_sesion_portal.md
          git add -u scripts/patch-583-worker-portal-session.mjs .github/workflows/patch-583-worker-portal-session.yml
          git commit -m "feat(attendance): persist worker portal sessions"
          git push origin HEAD:feat/583-worker-portal-session-persistence
