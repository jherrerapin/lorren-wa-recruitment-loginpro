name: Run issue 557 implementation

on:
  pull_request:
    branches:
      - automation/557-whatsapp-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/557-persistent-dispatch-whatsapp'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/557-persistent-dispatch-whatsapp
          fetch-depth: 0
      - name: Check prepared recipe
        id: recipe
        shell: bash
        run: |
          if [ -f .github/workflows/apply-issue-557.yml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "La implementación ya fue aplicada; no hay receta temporal pendiente."
          fi
      - uses: actions/setup-node@v4
        if: steps.recipe.outputs.available == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Extract and run prepared implementation
        if: steps.recipe.outputs.available == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-issue-557.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('No se encontró la receta preparada del issue #557.')
          raw_script = workflow[start + len(start_marker):end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_script.splitlines()
          )
          Path('/tmp/apply-issue-557.py').write_text(script + '\n', encoding='utf-8')
          PY
          set +e
          python3 /tmp/apply-issue-557.py > issue-557-application-diagnostic.txt 2>&1
          status=$?
          cat issue-557-application-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue-557-application-diagnostic.txt
            git commit -m "chore: registrar diagnóstico de aplicación #557" || true
            git push origin HEAD:fix/557-persistent-dispatch-whatsapp
            exit "$status"
          fi
          rm -f issue-557-application-diagnostic.txt
      - name: Update canonical runtime contract
        if: steps.recipe.outputs.available == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('test/dispatchWhatsappRuntimeContracts.test.js')
          text = path.read_text(encoding='utf-8')
          old = r"assert.match(source, /await validateOutgoingAssignmentContext\(args\.context\)/);"
          new = r"assert.match(source, /await validateOutgoingAssignmentContext\(args\.context, args\.phone\)/);"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('No se encontró el contrato de validación saliente esperado.')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflows
        if: steps.recipe.outputs.available == 'true'
        run: rm -f .github/workflows/apply-issue-557.yml .github/workflows/kick-issue-557.yml
      - name: Install dependencies
        if: steps.recipe.outputs.available == 'true'
        run: npm ci
      - name: Validate Prisma and generated client
        if: steps.recipe.outputs.available == 'true'
        run: |
          npx prisma validate
          npm run prisma:generate
      - name: Check changed JavaScript syntax
        if: steps.recipe.outputs.available == 'true'
        run: |
          node --check src/routes/dispatchWaRouterV2.js
          node --check src/services/dispatchWhatsappWebService.js
          node --check src/services/dispatchWhatsappWebServiceV6.js
          node --check test/dispatchWhatsappRuntimeContracts.test.js
      - name: Run focused WhatsApp regressions
        if: steps.recipe.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          node --test test/dispatchWhatsappRuntimeContracts.test.js > issue-557-focused-test-diagnostic.txt 2>&1
          status=$?
          cat issue-557-focused-test-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue-557-focused-test-diagnostic.txt
            git commit -m "chore: registrar diagnóstico de pruebas #557" || true
            git push origin HEAD:fix/557-persistent-dispatch-whatsapp
            exit "$status"
          fi
          rm -f issue-557-focused-test-diagnostic.txt
      - name: Commit canonical implementation
        if: steps.recipe.outputs.available == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persistir confirmaciones de WhatsApp despacho (#557)"
          git push origin HEAD:fix/557-persistent-dispatch-whatsapp
