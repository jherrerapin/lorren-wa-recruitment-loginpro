name: Apply Candidate simple step authority

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-candidate-simple-step-authority.mjs
      - test/conversationEngineStepAuthority.test.js
      - .github/workflows/apply-candidate-simple-step-authority.yml
  push:
    branches:
      - refactor/501-candidate-simple-step-authority
    paths:
      - scripts/apply-candidate-simple-step-authority.mjs
      - test/conversationEngineStepAuthority.test.js
      - .github/workflows/apply-candidate-simple-step-authority.yml

permissions:
  contents: write

concurrency:
  group: apply-candidate-simple-step-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: refactor/501-candidate-simple-step-authority
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply exact authority patch
        run: |
          cp scripts/apply-candidate-simple-step-authority.mjs /tmp/apply-candidate-simple-step-authority.mjs
          cp .github/workflows/apply-candidate-simple-step-authority.yml /tmp/apply-candidate-simple-step-authority.yml
          cp .github/workflows/candidate-progress-authority.yml /tmp/candidate-progress-authority.yml
          node scripts/apply-candidate-simple-step-authority.mjs
          cp /tmp/apply-candidate-simple-step-authority.mjs scripts/apply-candidate-simple-step-authority.mjs
          cp /tmp/apply-candidate-simple-step-authority.yml .github/workflows/apply-candidate-simple-step-authority.yml
          cp /tmp/candidate-progress-authority.yml .github/workflows/candidate-progress-authority.yml

      - name: Validate JavaScript syntax
        run: |
          node --check src/services/candidateStateService.js
          node --check src/services/conversationEngine.js
          node --check src/services/chatEngine.js

      - name: Validate Candidate step service
        run: node --test test/candidateConversationStepStateService.test.js

      - name: Validate conversationEngine integration
        run: node --test test/conversationEngineStepAuthority.test.js

      - name: Validate historical engine guardrails
        run: node --test test/conversationEngineGuardRails.test.js

      - name: Validate progress authority scanner
        run: node --test test/candidateProgressAuthority.test.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Create validated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralizar transiciones simples de currentStep"

      - name: Push validated commit
        run: git push origin HEAD:refactor/501-candidate-simple-step-authority
