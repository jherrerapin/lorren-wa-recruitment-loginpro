name: Apply shared error sanitization 492

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.number == 492 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: refactor/491-manual-outbound-delivery
          fetch-depth: 0

      - name: Apply bounded shared helper migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manual = Path('src/services/manualOutboundDeliveryService.js')
          manual_source = manual.read_text()
          old_manual_import = "import { safeErrorMessage } from './cvIntelligence.js';"
          new_manual_import = "import { safeErrorMessage } from './errorSanitization.js';"
          if old_manual_import not in manual_source:
              raise SystemExit('manual sanitization import not found')
          manual.write_text(manual_source.replace(old_manual_import, new_manual_import, 1))

          cv = Path('src/services/cvIntelligence.js')
          cv_source = cv.read_text()
          import_marker = "import { normalizeTransportMode } from './transportMode.js';\n"
          import_block = import_marker + "import { safeErrorMessage } from './errorSanitization.js';\n\nexport { safeErrorMessage };\n"
          if import_marker not in cv_source:
              raise SystemExit('cv import marker not found')
          cv_source = cv_source.replace(import_marker, import_block, 1)

          old_function = """export function safeErrorMessage(error) {
            const message = error?.message || String(error || 'unknown_error');
            const stack = error?.stack ? `\\nStack: ${error.stack}` : '';
            return `${message}${stack}`
              .replace(/Bearer\\s+[A-Za-z0-9._~-]+/gi, 'Bearer [REDACTED]')
              .replace(/(access_token=)[^&\\s]+/gi, '$1[REDACTED]')
              .slice(0, 1000);
          }

          """
          if old_function not in cv_source:
              raise SystemExit('cv safeErrorMessage function not found')
          cv.write_text(cv_source.replace(old_function, '', 1))
          PY

      - name: Validate bounded change
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/services/cvIntelligence.js src/services/manualOutboundDeliveryService.js | sort)
          test "$changed" = "$expected"
          node --check src/services/errorSanitization.js
          node --check src/services/cvIntelligence.js
          node --check src/services/manualOutboundDeliveryService.js
          npm ci --silent
          npm run prisma:generate --silent
          node --test test/adminSupervisor.test.js
          node --test test/manualOutboundDeliveryService.test.js
          node --test test/attachmentAnalysisContract.test.js
          git diff --check

      - name: Publish shared helper migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/cvIntelligence.js src/services/manualOutboundDeliveryService.js
          git commit -m 'refactor: reuse shared error sanitization'
          git push origin HEAD:refactor/491-manual-outbound-delivery
