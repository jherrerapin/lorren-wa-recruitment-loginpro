name: Diagnose shared error sanitization 492

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 492 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: refactor/491-manual-outbound-delivery

      - name: Apply shared helper migration in runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manual = Path('src/services/manualOutboundDeliveryService.js')
          manual_source = manual.read_text()
          manual.write_text(manual_source.replace(
            "import { safeErrorMessage } from './cvIntelligence.js';",
            "import { safeErrorMessage } from './errorSanitization.js';",
            1
          ))

          cv = Path('src/services/cvIntelligence.js')
          cv_source = cv.read_text()
          marker = "import { normalizeTransportMode } from './transportMode.js';\n"
          cv_source = cv_source.replace(
            marker,
            marker + "import { safeErrorMessage } from './errorSanitization.js';\n\nexport { safeErrorMessage };\n",
            1
          )
          old = """export function safeErrorMessage(error) {
            const message = error?.message || String(error || 'unknown_error');
            const stack = error?.stack ? `\\nStack: ${error.stack}` : '';
            return `${message}${stack}`
              .replace(/Bearer\\s+[A-Za-z0-9._~-]+/gi, 'Bearer [REDACTED]')
              .replace(/(access_token=)[^&\\s]+/gi, '$1[REDACTED]')
              .slice(0, 1000);
          }

          """
          if old not in cv_source:
            raise SystemExit('safe error function not found')
          cv.write_text(cv_source.replace(old, '', 1))
          PY

      - name: Install and generate
        shell: bash
        run: |
          npm ci --silent
          npm run prisma:generate --silent

      - name: Capture supervisor TAP
        id: supervisor
        shell: bash
        run: |
          set +e
          node --test test/adminSupervisor.test.js > admin-supervisor.tap 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload supervisor TAP
        uses: actions/upload-artifact@v4
        with:
          name: admin-supervisor-tap-492
          path: admin-supervisor.tap
          if-no-files-found: error
          retention-days: 3

      - name: Enforce supervisor result
        shell: bash
        run: |
          cat admin-supervisor.tap
          test "${{ steps.supervisor.outputs.exit_code }}" = "0"
