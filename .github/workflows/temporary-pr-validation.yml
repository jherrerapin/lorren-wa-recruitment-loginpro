name: Temporary PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check modified JavaScript syntax
        run: node --check src/public/worker-portal-biometric-flow.js
      - name: Run PR 914 regression tests
        run: node --test test/workerPortalOfflineContracts.test.js
