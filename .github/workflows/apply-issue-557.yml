name: Apply issue 557 persistent dispatch WhatsApp

on:
  push:
    branches:
      - fix/557-persistent-dispatch-whatsapp
    paths:
      - .github/workflows/apply-issue-557.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/557-persistent-dispatch-whatsapp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply canonical WhatsApp confirmation fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]}')
              write(path, text.replace(old, new, 1))

          def replace_block(path, start, end, new_block):
              text = read(path)
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{path}: missing block start {start}')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{path}: missing block end {end}')
              write(path, text[:start_index] + new_block.rstrip() + '\n\n' + text[end_index:])

          # 1) The board owns and sends the assignment context directly.
          board = 'src/views/operacionesAsignacionesConfirmacion.ejs'
          replace_once(
              board,
              'id="selectedRequestSummary" data-request-city="<%= selectedServiceRequest.cityName || \'\' %>" data-request-date="<%= selectedRequestDate %>"',
              'id="selectedRequestSummary" data-service-request-id="<%= selectedServiceRequest.id %>" data-request-city="<%= selectedServiceRequest.cityName || \'\' %>" data-request-date="<%= selectedRequestDate %>"'
          )
          replace_once(
              board,
              'class="assigned-card" data-assignment-id="<%= assignment.id %>" data-worker-name="<%= assignment.worker.fullName %>"',
              'class="assigned-card" data-assignment-id="<%= assignment.id %>" data-service-request-id="<%= selectedServiceRequest.id %>" data-worker-id="<%= assignment.worker.id %>" data-worker-name="<%= assignment.worker.fullName %>"'
          )
          replace_once(
              board,
              "      async function sendDispatchWhatsapp(button){const phone=button.dataset.waPhone;const message=button.dataset.waMessage;if(!phone||!message){showToast('No hay número o mensaje para enviar.');return;}button.disabled=true;const originalText=button.innerHTML;button.innerHTML='...';try{const response=await fetch('/admin/operaciones/whatsapp/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,message})});const data=await response.json();if(response.status===503){showToast('WhatsApp no está conectado. Abre el módulo de WhatsApp y escanea el QR.');return;}if(!response.ok||!data.ok)throw new Error(data.message||'No se pudo enviar el mensaje.');showToast('Mensaje enviado correctamente.');}catch(error){showToast(error.message||'Error enviando WhatsApp.');}finally{button.disabled=false;button.innerHTML=originalText;}}",
              "      async function sendDispatchWhatsapp(button){const phone=button.dataset.waPhone;const message=button.dataset.waMessage;const card=button.closest('.assigned-card');const context={assignmentId:card?.dataset.assignmentId||'',serviceRequestId:card?.dataset.serviceRequestId||qs('#selectedRequestSummary')?.dataset.serviceRequestId||'',workerId:card?.dataset.workerId||'',recipientName:card?.dataset.workerName||'',messageType:'DISPATCH_ASSIGNMENT_CONFIRMATION_REQUEST'};if(!phone||!message){showToast('No hay número o mensaje para enviar.');return;}if(!context.assignmentId||!context.serviceRequestId||!context.workerId){showToast('No se pudo identificar la asignación. Recarga el tablero e intenta nuevamente.');return;}button.disabled=true;const originalText=button.innerHTML;button.innerHTML='...';try{const response=await fetch('/admin/operaciones/whatsapp/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,message,context})});const data=await response.json();if(response.status===503){showToast(data.message||'WhatsApp no está conectado. Abre el módulo de WhatsApp y revisa la sesión.');return;}if(!response.ok||!data.ok)throw new Error(data.message||'No se pudo enviar el mensaje.');showToast('Mensaje enviado correctamente.');}catch(error){showToast(error.message||'Error enviando WhatsApp.');}finally{button.disabled=false;button.innerHTML=originalText;}}"
