              "export async function sendDispatchWhatsappMessage(args = {}) {\n  const context = await validateOutgoingAssignmentContext(args.context, args.phone);\n  return sendRuntimeTextMessage({ ...args, context, message: labelHours(args.message) });\n}"
          )

