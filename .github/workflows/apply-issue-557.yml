          )
          replace_once(
              runtime,
              "let lastCatchupProcessed = 0;",
              "let lastCatchupProcessed = 0;\nlet pendingReconciliationTimer = null;\nlet pendingReconciliationRunning = false;\nlet lastPendingReconciliationAt = null;\nlet lastPendingReconciliationProcessed = 0;"
          )
          replace_once(
              runtime,
              "function ensureAuthDataPath() {",
              "function authStorageInfo() {\n  const authDataPath = resolveAuthDataPath();\n  const explicitPersistentPath = process.env.DISPATCH_WWEB_AUTH_PERSISTENT === 'true';\n  const railwayVolume = Boolean(process.env.RAILWAY_VOLUME_MOUNT_PATH);\n  const authStoragePersistent = railwayVolume || explicitPersistentPath;\n  return {\n    authDataPath,\n    authStoragePersistent,\n    authStorageMode: authStoragePersistent ? 'PERSISTENT' : 'EPHEMERAL',\n    authStorageWarning: authStoragePersistent\n      ? null\n      : 'La sesión de WhatsApp está en almacenamiento efímero. Monta un volumen Railway y desactiva Serverless para operación continua.'\n  };\n}\n\nfunction ensureAuthDataPath() {"
          )
          replace_block(
              runtime,
              'async function persistPendingConfirmationLink',
              'async function loadWhatsappWebModule',
              """async function preparePendingConfirmationLink({ phone, context = {}, chatId = '' }) {
  const primaryChatId = normalizeChatId(chatId);
  const remembered = rememberPendingConfirmation(phone, context, primaryChatId ? [primaryChatId] : []);
  if (!remembered?.assignmentId || !remembered?.serviceRequestId || !primaryChatId) {
    throw buildError('No fue posible preparar el contexto persistente de confirmación.', 503);
  }

  try {
    const link = await prisma.dispatchWhatsappConfirmation.create({
      data: {
        assignmentId: remembered.assignmentId,
        serviceRequestId: remembered.serviceRequestId,
        phone: remembered.phone,
        chatId: primaryChatId,
        status: 'PENDING',
        expiresAt: new Date(remembered.expiresAt)
      }
    });
    return { ...remembered, linkId: link.id, primaryChatId };
  } catch (error) {
    pendingConfirmationByPhone.delete(remembered.phone);
    pendingConfirmationByChatId.delete(primaryChatId);
    console.error('[dispatch-wa] No fue posible guardar el contexto antes del envío.', error?.message || error);
    throw buildError('No se envió WhatsApp porque no fue posible guardar el contexto de confirmación. Intenta nuevamente.', 503);
  }
}

async function finalizePendingConfirmationLink({ pending, chatIds = [], providerMessageId = null }) {
  if (!pending?.linkId) return;
  const normalizedChatIds = [...new Set(chatIds.map(normalizeChatId).filter(Boolean))];
  try {
    await prisma.dispatchWhatsappConfirmation.update({
      where: { id: pending.linkId },
      data: { providerMessageId }
    });
    const extraRows = normalizedChatIds
      .filter((chatId) => chatId !== pending.primaryChatId)
      .map((chatId) => ({
        assignmentId: pending.assignmentId,
        serviceRequestId: pending.serviceRequestId,
        phone: pending.phone,
        chatId,
        providerMessageId,
        status: 'PENDING',
        expiresAt: new Date(pending.expiresAt)
      }));
    if (extraRows.length) await prisma.dispatchWhatsappConfirmation.createMany({ data: extraRows });
    rememberPendingConfirmation(pending.phone, pending, normalizedChatIds);
  } catch (error) {
    // The primary row was created before sending and remains enough for restart-safe matching.
    console.warn('[dispatch-wa] El mensaje fue enviado, pero no fue posible enriquecer todos los identificadores del contexto.', error?.message || error);
  }
}

async function markPendingConfirmationSendFailed(pending) {
  if (!pending?.linkId) return;
  pendingConfirmationByPhone.delete(pending.phone);
  pendingConfirmationByChatId.delete(pending.primaryChatId);
  try {
    await prisma.dispatchWhatsappConfirmation.updateMany({
      where: { id: pending.linkId, status: 'PENDING' },
      data: { status: 'SEND_FAILED' }
    });
  } catch (error) {
    console.warn('[dispatch-wa] No fue posible marcar como fallido el contexto de un envío rechazado.', error?.message || error);
  }
}"""
