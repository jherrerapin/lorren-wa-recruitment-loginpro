name: Build Android manual marks 1824
on:
  push:
    branches:
      - build/android-manual-marks-1824
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug -PlorrenPortalBaseUrl=https://lorren-wa-recruitment-loginpro-production.up.railway.app
      - uses: actions/upload-artifact@v4
        with:
          name: lorren-manual-marks-1824-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
