name: Remove unused message direction import

on:
  push:
    branches:
      - refactor/440-conversation-message-repository

permissions:
  contents: write

concurrency:
  group: remove-unused-message-direction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/440-conversation-message-repository
          fetch-depth: 0

      - name: Remove unused import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/dataConsentGate.js')
          source = path.read_text()
          old = "import { CandidateStatus, ConversationStep, MessageDirection, MessageType } from '@prisma/client';"
          new = "import { CandidateStatus, ConversationStep, MessageType } from '@prisma/client';"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('import anchor missing')
          path.write_text(source)
          PY

      - name: Commit cleanup when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dataConsentGate.js
          git commit -m "refactor: retirar import de dirección ya delegado"
          git push origin HEAD:refactor/440-conversation-message-repository
