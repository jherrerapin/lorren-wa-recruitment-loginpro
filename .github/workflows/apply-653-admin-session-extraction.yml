name: Apply admin session extraction

on:
  push:
    branches:
      - refactor/653-admin-session-service

permissions:
  contents: write

jobs:
  apply-extraction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Apply guarded server patch
        run: node scripts/apply-653-admin-session-extraction.mjs

      - name: Validate changed JavaScript
        run: |
          node --check src/server.js
          node --check src/services/adminSession.js
          node --check test/adminSession.test.js

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-653-admin-session-extraction.mjs
          rm .github/workflows/apply-653-admin-session-extraction.yml

      - name: Commit extracted session bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js src/services/adminSession.js test/adminSession.test.js .github/workflows/admin-session-contract.yml scripts/apply-653-admin-session-extraction.mjs .github/workflows/apply-653-admin-session-extraction.yml
          git commit -m "refactor: montar sesiones administrativas desde servicio"
          git push origin HEAD:${GITHUB_REF_NAME}
