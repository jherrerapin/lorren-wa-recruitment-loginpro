name: Temporary 1529 branch edit

on:
  push:
    branches:
      - fix/1529-recruiter-vacancy-exports

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              source = Path(path).read_text()
              if old not in source:
                  raise SystemExit(f'expected block not found in {path}')
              Path(path).write_text(source.replace(old, new, 1))

          replace_once(
              'src/routes/admin.js',
              "  exportFilenameByScopeAndVacancy,\n  filterCandidatesByScope,\n  isOperationallyCompleteWithoutCv,",
              "  exportFilenameByScopeAndVacancy,\n  candidateExportCounts,\n  filterCandidatesByScope,\n  filterCandidatesForExport,\n  isOperationallyCompleteWithoutCv,"
          )

          replace_once(
              'src/routes/admin.js',
              "    const contractedCandidates = filterDashboardCandidates(contractedCandidatesBase);\n    const filteredBookingsToday = normalizeInterviewBookings(v.interviewBookings)",
              "    const contractedCandidates = filterDashboardCandidates(contractedCandidatesBase);\n    const exportCounts = candidateExportCounts(candidatesWithFlags, { isDev, vacancy: v });\n    const filteredBookingsToday = normalizeInterviewBookings(v.interviewBookings)"
          )

          replace_once(
              'src/routes/admin.js',
              "      completeWithoutCv,\n      approvedCandidates,\n      contractedCandidates\n    };",
              "      completeWithoutCv,\n      approvedCandidates,\n      contractedCandidates,\n      exportCounts\n    };"
          )

          replace_once(
              'src/routes/admin.js',
              "    const candidates = filterCandidatesByScope(allCandidates.map(normalizeCandidateSnapshot), scope);",
              "    const candidates = filterCandidatesForExport(\n      allCandidates.map(normalizeCandidateSnapshot),\n      scope,\n      { isDev: accessContext.isDev, vacancy }\n    );"
          )

          replace_once(
              'src/views/list.ejs',
              '''        <div class="export-bar">\n          <a href="/admin/export?scope=registered&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar registrados</a>\n          <a href="/admin/export?scope=missing_cv_complete&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar pendientes HV</a>\n          <a href="/admin/export?scope=approved&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar aprobados</a>\n          <a href="/admin/export?scope=all&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar todos</a>\n          <a href="/admin/export?scope=contracted&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">Contratados</a>\n          <a href="/admin/outreach/approved" class="export-btn">↗ Mensajes a aprobados</a>\n          <a href="/admin/vacancies" class="export-btn" style="margin-left:auto;">⚙️ Gestionar vacantes</a>\n        </div>''',
              '''        <div class="export-bar">\n          <% if ((v.exportCounts?.registered || 0) > 0) { %><a href="/admin/export?scope=registered&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar registrados</a><% } %>\n          <% if ((v.exportCounts?.missingCvComplete || 0) > 0) { %><a href="/admin/export?scope=missing_cv_complete&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar pendientes HV</a><% } %>\n          <% if ((v.exportCounts?.approved || 0) > 0) { %><a href="/admin/export?scope=approved&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar aprobados</a><% } %>\n          <% if ((v.exportCounts?.all || 0) > 0) { %><a href="/admin/export?scope=all&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar todos</a><% } %>\n          <% if ((v.exportCounts?.contracted || 0) > 0) { %><a href="/admin/export?scope=contracted&vacancyId=<%= encodeURIComponent(v.id) %>" class="export-btn">↓ Descargar contratados</a><% } %>\n          <% if ((v.exportCounts?.approved || 0) > 0) { %><a href="/admin/outreach/approved" class="export-btn">↗ Mensajes a aprobados</a><% } %>\n          <a href="/admin/vacancies" class="export-btn" style="margin-left:auto;">⚙️ Gestionar vacantes</a>\n        </div>'''
          )

          replace_once(
              'test/candidateExport.test.js',
              "  candidateHasCv,\n  deriveCandidateStatusForUI,\n  exportFilenameByScope,\n  filterCandidatesByScope,",
              "  candidateHasCv,\n  candidateExportCounts,\n  deriveCandidateStatusForUI,\n  exportFilenameByScope,\n  filterCandidatesByScope,\n  filterCandidatesForExport,"
          )

          marker = "test('ruta /admin/export acepta missing_cv_complete como scope válido', () => {"
          test_source = Path('test/candidateExport.test.js').read_text()
          if marker not in test_source:
              raise SystemExit('candidateExport test insertion marker not found')
          regression = r'''test('exportación no DEV excluye nuevos incompletos pero conserva completos con o sin HV', () => {
            const vacancy = { city: 'TEST Ciudad' };
            const completeWithCv = { ...baseCandidate, id: 'TEST-COMPLETE-CV', status: 'NUEVO', vacancy };
            const completeWithoutCv = { ...baseCandidate, id: 'TEST-COMPLETE-NO-CV', status: 'NUEVO', cvData: null, vacancy };
            const incompleteNew = { id: 'TEST-INCOMPLETE-NEW', status: 'NUEVO', fullName: null, vacancy };

            assert.deepEqual(
              filterCandidatesForExport([incompleteNew, completeWithCv, completeWithoutCv], 'all', { isDev: false, vacancy }).map((candidate) => candidate.id),
              ['TEST-COMPLETE-CV', 'TEST-COMPLETE-NO-CV']
            );
            assert.deepEqual(
              filterCandidatesForExport([incompleteNew, completeWithCv], 'all', { isDev: true, vacancy }).map((candidate) => candidate.id),
              ['TEST-INCOMPLETE-NEW', 'TEST-COMPLETE-CV']
            );
          });

          test('exportación no DEV no filtra solo por estado: aprobado o contratado incompleto tampoco se expone', () => {
            const vacancy = { city: 'TEST Ciudad' };
            const approvedIncomplete = { id: 'TEST-APPROVED-INCOMPLETE', status: 'APROBADO', fullName: 'TEST', vacancy };
            const contractedIncomplete = { id: 'TEST-CONTRACTED-INCOMPLETE', status: 'CONTRATADO', fullName: 'TEST', vacancy };
            const approvedComplete = { ...baseCandidate, id: 'TEST-APPROVED-COMPLETE', status: 'APROBADO', vacancy };
            const contractedComplete = { ...baseCandidate, id: 'TEST-CONTRACTED-COMPLETE', status: 'CONTRATADO', vacancy };

            assert.deepEqual(filterCandidatesForExport([approvedIncomplete, approvedComplete], 'approved', { vacancy }).map((candidate) => candidate.id), ['TEST-APPROVED-COMPLETE']);
            assert.deepEqual(filterCandidatesForExport([contractedIncomplete, contractedComplete], 'contracted', { vacancy }).map((candidate) => candidate.id), ['TEST-CONTRACTED-COMPLETE']);
          });

          test('conteos de exportación usan exactamente la misma elegibilidad que el backend', () => {
            const vacancy = { city: 'TEST Ciudad' };
            const candidates = [
              { ...baseCandidate, id: 'TEST-REGISTERED', status: 'REGISTRADO', vacancy },
              { ...baseCandidate, id: 'TEST-MISSING-CV', status: 'REGISTRADO', cvData: null, vacancy },
              { ...baseCandidate, id: 'TEST-APPROVED', status: 'APROBADO', vacancy },
              { ...baseCandidate, id: 'TEST-CONTRACTED', status: 'CONTRATADO', vacancy },
              { id: 'TEST-NEW-INCOMPLETE', status: 'NUEVO', vacancy }
            ];

            assert.deepEqual(candidateExportCounts(candidates, { isDev: false, vacancy }), {
              registered: 3,
              missingCvComplete: 1,
              approved: 1,
              contracted: 1,
              all: 4
            });
          });

          test('ruta y vista consumen la autoridad canónica de exportación y ocultan descargas vacías', () => {
            const adminRouteSource = fs.readFileSync('src/routes/admin.js', 'utf8');
            const listSource = fs.readFileSync('src/views/list.ejs', 'utf8');
            assert.match(adminRouteSource, /filterCandidatesForExport\([\s\S]*\{ isDev: accessContext\.isDev, vacancy \}/);
            assert.match(adminRouteSource, /candidateExportCounts\(candidatesWithFlags, \{ isDev, vacancy: v \}\)/);
            assert.match(listSource, /v\.exportCounts\?\.approved/);
            assert.match(listSource, /v\.exportCounts\?\.contracted/);
            assert.match(listSource, /Descargar contratados/);
          });

          '''
          Path('test/candidateExport.test.js').write_text(test_source.replace(marker, regression + marker, 1))
          PY
      - name: Commit focused source edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.js src/views/list.ejs test/candidateExport.test.js
          git diff --cached --check
          git commit -m "fix(recruitment): enforce vacancy export visibility"
          git push
