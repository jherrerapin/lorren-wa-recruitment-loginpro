name: Apply manual outbound delivery 491 v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.number == 492 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: refactor/491-manual-outbound-delivery
          fetch-depth: 0

      - name: Apply bounded migration
        run: python scripts/apply-manual-outbound-491.py

      - name: Validate changed file boundary
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(src/routes/admin\.js|src/services/conversationMessageRepository\.js|test/helpers/mockPrisma\.js|docs/architecture/state-authority-manifest\.json|docs/architecture/state-authority-map\.md|\.github/workflows/ci\.yml)$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Check targeted syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/routes/admin.js
          node --check src/services/candidateStateService.js
          node --check src/services/conversationMessageRepository.js
          node --check src/services/manualOutboundDeliveryService.js
          node --check test/helpers/mockPrisma.js
          node --check test/candidateManualOutboundStateService.test.js
          node --check test/manualOutboundDeliveryService.test.js
          node --check test/adminManualOutboundDeliveryAuthority.test.js

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Candidate delivery authority
        run: node --test test/candidateManualOutboundStateService.test.js

      - name: Validate durable delivery orchestration
        run: node --test test/manualOutboundDeliveryService.test.js

      - name: Validate admin structural authority
        run: node --test test/adminManualOutboundDeliveryAuthority.test.js

      - name: Validate admin integration
        run: node --test test/adminManualOutbound.test.js

      - name: Validate message repository regressions
        run: node --test test/conversationMessageRepository.test.js

      - name: Validate state authority scanner
        run: node --test test/stateAuthorityManifest.test.js

      - name: Validate diff formatting
        run: git diff --check

      - name: Publish bounded migration
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.js src/services/conversationMessageRepository.js test/helpers/mockPrisma.js docs/architecture/state-authority-manifest.json docs/architecture/state-authority-map.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: delegate manual outbound delivery lifecycle'
          git push origin HEAD:refactor/491-manual-outbound-delivery
