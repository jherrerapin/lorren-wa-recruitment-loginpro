name: Validate question before data transition

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-characterize:
    if: github.head_ref == 'fix/628-question-before-data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact transition patch
        run: node scripts/apply-628-question-before-data.mjs

      - name: Validate syntax
        run: |
          node --check src/routes/webhook.js
          node --check test/activeVacancyQuestionIntake.test.js

      - name: Run focused transition regressions
        run: node --test test/activeVacancyQuestionIntake.test.js

      - name: Run gate and webhook authority regressions
        run: node --test test/vacancyFirstGate.test.js test/webhookVacancyFirstGateAuthority.test.js test/turnOrchestratorContracts.test.js test/webhookConversationFlow.test.js

      - name: Commit generated runtime patch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/webhook.js
            git commit -m "fix: responder duda y entrar a recolección"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Characterize harness after transition repair
        run: |
          mkdir -p diagnostics
          set +e
          node --test test/conversation-harness.test.js > diagnostics/628-harness.tap 2>&1
          status=$?
          set -e
          grep -E '^    not ok [0-9]+ - ' diagnostics/628-harness.tap | sed 's/^    //' > diagnostics/628-remaining-failures.txt || true
          count=$(wc -l < diagnostics/628-remaining-failures.txt | tr -d ' ')
          printf 'status=%s\nremaining_failures=%s\nprevious_failures=17\n' "$status" "$count" > diagnostics/628-harness-summary.txt
          if grep -q 'answer-question-before-data' diagnostics/628-remaining-failures.txt; then
            echo "Target question-before-data scenario still fails."
            exit 1
          fi
          if [ "$count" -gt 16 ]; then
            echo "Transition repair did not reduce the harness corpus."
            exit 1
          fi

      - name: Commit harness characterization
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/628-harness.tap diagnostics/628-remaining-failures.txt diagnostics/628-harness-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: caracterizar harness después de #628"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Run conversation replays
        run: |
          node --test test/conversationReplayFixtures.test.js test/conversationReplayInterpretation.test.js test/conversationReplayPlanning.test.js test/conversationReplayIntegral.test.js test/conversationReplayRecovery.test.js
