name: Validate issue 670 dispatch worker Excel import

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'fix/670-dispatch-worker-excel-import'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/670-dispatch-worker-excel-import
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-issue-670.yml

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma and syntax
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/dispatchWorkerExcelImport.js
          node --check src/routes/dispatchOpsExtras.js
          node --check test/dispatchWorkerExcelImport.test.js

      - name: Run focused regressions
        run: |
          node --test test/dispatchWorkerExcelImport.test.js
          node --test test/dispatchWorkerContractAutoAssignment.test.js

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: validar importación masiva de auxiliares (#670)"
          git push origin HEAD:fix/670-dispatch-worker-excel-import
