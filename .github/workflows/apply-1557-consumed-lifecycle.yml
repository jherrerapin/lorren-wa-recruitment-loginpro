name: Apply consumed consent lifecycle patch

on:
  push:
    branches:
      - feat/1557-consentimiento-botones-trazabilidad

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/1557-consentimiento-botones-trazabilidad
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node scripts/apply-1557-consumed-lifecycle.mjs
      - run: node --check src/services/dataConsentGate.js
      - run: |
          git rm .github/workflows/apply-1557-consumed-lifecycle.yml scripts/apply-1557-consumed-lifecycle.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/dataConsentGate.js
          git commit -m 'fix(bot): cerrar inbound consumido por consentimiento #1557'
          git push origin HEAD:feat/1557-consentimiento-botones-trazabilidad
