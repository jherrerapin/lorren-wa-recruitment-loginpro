name: Apply 1566 trigger

on:
  push:
    branches:
      - fix/1566-entidades-persistidas-contextuales

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply product patch declared in reviewed workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-1566-entity-authority.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'apply-1566-entity-authority', 'exec'))
          PY
      - run: npm ci
      - name: Focal medical contextual negative
        run: node --test --test-name-pattern="negativa corta contextual" test/contextualEntityPersistenceAuthority.test.js
      - name: Focal medical negative outside context
        run: node --test --test-name-pattern="negativa corta fuera" test/contextualEntityPersistenceAuthority.test.js
      - name: Focal engine med transport persistence
        run: node --test --test-name-pattern="engine persiste restricciones" test/contextualEntityPersistenceAuthority.test.js
      - name: Focal curated locality precedence
        run: node --test --test-name-pattern="campos ya curados" test/contextualEntityPersistenceAuthority.test.js
      - name: Focal natural locality transport
        run: node --test --test-name-pattern="localidad y transporte" test/contextualEntityPersistenceAuthority.test.js
      - name: Focal post CV readiness
        run: node --test --test-name-pattern="después de persistir" test/contextualEntityPersistenceAuthority.test.js
      - name: Field sanitizer regressions
        run: node --test test/fieldSanitizer.test.js
      - name: Conversation regression suite
        run: node --test test/conversationRegression.test.js
      - name: Conversation understanding suite
        run: node --test test/conversationUnderstanding.test.js
      - name: Conversation engine guard rails
        run: node --test test/conversationEngineGuardRails.test.js
      - name: Conversation engine step authority
        run: node --test test/conversationEngineStepAuthority.test.js
      - name: Readiness guard suite
        run: node --test test/readinessGuard.test.js
      - name: Validate syntax
        run: node --check src/services/fieldSanitizer.js && node --check src/services/chatEngine.js && node --check src/services/conversationEngine.js
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "jherrerapin"
          git config user.email "37624185+jherrerapin@users.noreply.github.com"
          git add src/services/fieldSanitizer.js src/services/chatEngine.js src/services/conversationEngine.js
          git commit -m "fix(bot): consolidar entidades contextuales #1566"
          git push
