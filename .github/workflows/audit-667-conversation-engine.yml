name: Audit conversation engine authority

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selector-parity:
    if: github.head_ref == 'audit/667-conversation-engine-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: audit-only-placeholder
      OPENAI_ENABLED: 'false'
      FF_RESPONSES_EXTRACTOR: 'false'
      DISPATCH_WWEB_AUTO_START: 'false'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      META_PHONE_NUMBER_ID: meta-phone-id
      META_ACCESS_TOKEN: meta-access-token
      OPENAI_API_KEY: test-openai-key

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Prepare selector-neutral test copies
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re

          sources = [
              'test/conversation-harness.test.js',
              'test/lorrenRegressionFixes.test.js',
              'test/activeVacancyQuestionIntake.test.js',
              'test/inactiveVacancySpecificity.test.js',
              'test/candidateAgeHarnessIntegration.test.js',
              'test/candidateExperienceHarnessIntegration.test.js',
              'test/structuredAgeHarnessIntegration.test.js',
              'test/vacancyAgeAuthorityIntegration.test.js',
          ]

          generated = []
          for source_name in sources:
              source_path = pathlib.Path(source_name)
              source = source_path.read_text()
              source = re.sub(r'^process\.env\.USE_CONVERSATION_ENGINE\s*=\s*[\'\"](?:true|false)[\'\"];\s*$', '', source, flags=re.MULTILINE)
              source = re.sub(r'^delete\s+process\.env\.OPENAI_API_KEY;\s*$', '', source, flags=re.MULTILINE)
              target = pathlib.Path('test') / f'.audit667-{source_path.name}'
              target.write_text(source)
              generated.append({'source': source_name, 'target': str(target)})

          pathlib.Path('audit-667-generated-tests.json').write_text(json.dumps(generated, indent=2) + '\n')
          PY

      - name: Run isolated selector matrix
        shell: bash
        run: |
          set -euo pipefail
          generated_tests=(
            test/.audit667-conversation-harness.test.js
            test/.audit667-lorrenRegressionFixes.test.js
            test/.audit667-activeVacancyQuestionIntake.test.js
            test/.audit667-inactiveVacancySpecificity.test.js
            test/.audit667-candidateAgeHarnessIntegration.test.js
            test/.audit667-candidateExperienceHarnessIntegration.test.js
            test/.audit667-structuredAgeHarnessIntegration.test.js
            test/.audit667-vacancyAgeAuthorityIntegration.test.js
          )
          stable_tests=(
            test/conversationReplayInterpretation.test.js
            test/conversationReplayPlanning.test.js
            test/conversationReplayConsentAttachmentEdges.test.js
            test/conversationReplayRecovery.test.js
            test/conversationEngineGuardRails.test.js
            test/conversationUnderstanding.test.js
          )
          cases=("${generated_tests[@]}" "${stable_tests[@]}")

          printf '[]' > audit-667-matrix-rows.json
          : > audit-667-false.log
          : > audit-667-true.log

          for value in false true; do
            for test_file in "${cases[@]}"; do
              safe_name=$(basename "$test_file" | tr -c '[:alnum:].-' '_')
              case_log="audit-667-${value}-${safe_name}.log"
              set +e
              USE_CONVERSATION_ENGINE="$value" node --test "$test_file" > "$case_log" 2>&1
              exit_code=$?
              set -e
              cat "$case_log" >> "audit-667-${value}.log"

              VALUE="$value" TEST_FILE="$test_file" EXIT_CODE="$exit_code" CASE_LOG="$case_log" python3 <<'PY'
          import json
          import os
          import pathlib
          import re

          output = pathlib.Path(os.environ['CASE_LOG']).read_text()
          rows_path = pathlib.Path('audit-667-matrix-rows.json')
          rows = json.loads(rows_path.read_text())

          def metric(name):
              matches = re.findall(rf'^# {name} (\d+)$', output, flags=re.MULTILINE)
              return int(matches[-1]) if matches else None

          rows.append({
              'value': os.environ['VALUE'],
              'file': os.environ['TEST_FILE'],
              'exitCode': int(os.environ['EXIT_CODE']),
              'tests': metric('tests'),
              'pass': metric('pass'),
              'fail': metric('fail'),
              'skipped': metric('skipped'),
              'failures': [line for line in output.splitlines() if re.match(r'^not ok \d+ - ', line)],
          })
          rows_path.write_text(json.dumps(rows, indent=2) + '\n')
          PY
            done
          done

          python3 <<'PY'
          import json
          import pathlib

          rows = json.loads(pathlib.Path('audit-667-matrix-rows.json').read_text())
          by_file = {}
          for row in rows:
              by_file.setdefault(row['file'], {})[row['value']] = row

          comparisons = []
          for file_name, pair in by_file.items():
              off = pair.get('false')
              on = pair.get('true')
              comparisons.append({
                  'file': file_name,
                  'false': off,
                  'true': on,
                  'sameExitCode': bool(off and on and off['exitCode'] == on['exitCode']),
                  'sameTotals': bool(off and on and all(off.get(key) == on.get(key) for key in ('tests', 'pass', 'fail', 'skipped'))),
                  'bothPass': bool(off and on and off['exitCode'] == 0 and on['exitCode'] == 0),
              })

          result = {
              'comparisons': comparisons,
              'divergentFiles': [entry['file'] for entry in comparisons if not entry['sameExitCode'] or not entry['sameTotals']],
              'failingWithFalse': [entry['file'] for entry in comparisons if not entry['false'] or entry['false']['exitCode'] != 0],
              'failingWithTrue': [entry['file'] for entry in comparisons if not entry['true'] or entry['true']['exitCode'] != 0],
              'bothPassCount': sum(1 for entry in comparisons if entry['bothPass']),
              'totalFiles': len(comparisons),
          }
          pathlib.Path('audit-667-matrix.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({key: result[key] for key in ('totalFiles', 'bothPassCount', 'divergentFiles', 'failingWithFalse', 'failingWithTrue')}))
          PY

          rm -f test/.audit667-*.test.js

      - name: Upload selector matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-667-selector-matrix
          path: |
            audit-667-matrix.json
            audit-667-matrix-rows.json
            audit-667-false.log
            audit-667-true.log
            audit-667-generated-tests.json
          if-no-files-found: error
          retention-days: 3
