name: Apply vacancy age authority patch

on:
  push:
    branches:
      - fix/642-vacancy-age-authority-v2

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Apply guarded patch
        run: node scripts/apply-vacancy-age-authority.mjs

      - name: Validate changed JavaScript
        run: |
          node --check src/routes/webhook.js
          node --check test/vacancyAgeAuthorityIntegration.test.js

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-vacancy-age-authority.mjs
          rm .github/workflows/apply-vacancy-age-authority.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/webhook.js test/vacancyAgeAuthorityIntegration.test.js scripts/apply-vacancy-age-authority.mjs .github/workflows/apply-vacancy-age-authority.yml
          git commit -m "fix: usar edad configurada por vacante"
          git push origin HEAD:${GITHUB_REF_NAME}
