name: Legacy cleanup

on:
  push:
    branches:
      - "refactor/remove-legacy-general-recruiter"

permissions:
  contents: write

jobs:
  cleanup:
    name: Deterministic source cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: refactor/remove-legacy-general-recruiter
          fetch-depth: 0
          persist-credentials: true

      - name: Replace obsolete authorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {found}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          replace('src/routes/admin.js', 'La administración de usuarios solo está disponible para reclutador-general y DEV.', 'La administración de usuarios solo está disponible para DEV.')
          replace('src/routes/admin.js', "return user.username === 'reclutador-general' || isEnvironmentAdminProfile(user);", 'return isEnvironmentAdminProfile(user);')
          replace('src/routes/admin.js', "  const hiddenUsernames = ['reclutador-general'];\n  const visibilityWhere = accessContext.isDev\n    ? {}\n    : { username: { notIn: [...new Set(hiddenUsernames)] } };", "  const visibilityWhere = {};")

          replace('src/routes/locations.js', "function isProtectedRecruiterProfile(user = {}) {\n  return user.username === 'reclutador-general';\n}\n\n", '')
          replace('src/routes/locations.js', '  return !isProtectedRecruiterProfile(user);', '  return true;')

          p = Path('src/routes/dispatchProgrammingNotifications.js')
          text = p.read_text()
          import_line = "import { canManageOperationalPermissions } from '../services/operationalAccess.js';\n"
          if import_line not in text:
              text = import_line + text
          old = "function isGeneralRecruiter(req) {\n  return requestUsername(req) === 'reclutador-general';\n}"
          new = "function canSeeProgrammingRecipientPhones(req) {\n  return userRole(req) === 'dev' || canManageOperationalPermissions(req);\n}"
          if text.count(old) != 1:
              raise SystemExit('legacy programming authority mismatch')
          text = text.replace(old, new)
          old_call = "userRole(req) === 'dev' || isGeneralRecruiter(req)"
          if text.count(old_call) != 1:
              raise SystemExit('legacy programming visibility mismatch')
          p.write_text(text.replace(old_call, 'canSeeProgrammingRecipientPhones(req)'))

          replace('src/views/users.ejs', 'Los permisos adicionales solo pueden ser concedidos por DEV o reclutador-general.', 'Los permisos generales de cuenta solo pueden ser administrados por DEV.')
          replace('src/views/users.ejs', 'Puedes crear usuarios dentro de tu alcance. Los permisos adicionales del panel los asigna DEV o reclutador-general.', 'Los permisos operativos se administran mediante el rol Supervisor y sus capacidades asignadas.')
          replace('src/views/users.ejs', 'Solo DEV y reclutador-general pueden modificar estos permisos.', 'Solo DEV puede modificar estos permisos generales de cuenta.')

          replace('src/services/dispatchAuditMiddleware.js', 'Los permisos adicionales solo pueden ser concedidos por DEV o reclutador-general.', 'Los permisos generales de cuenta solo pueden ser administrados por DEV.')
          replace('src/services/dispatchAuditMiddleware.js', 'Puedes crear usuarios dentro de tu alcance. Los permisos adicionales del panel los asigna DEV o reclutador-general.', 'Los permisos operativos se administran mediante el rol Supervisor y sus capacidades asignadas.')
          replace('src/services/dispatchAuditMiddleware.js', 'Solo DEV y reclutador-general pueden modificar estos permisos.', 'Solo DEV puede modificar estos permisos generales de cuenta.')

          replace('src/server.js', "    username: user.username,\n    userAccessScope:", "    username: user.username,\n    userDisplayName: normalizeString(user.displayName) || user.username,\n    userAccessScope:")
          replace('src/server.js', "  req.session.username = payload.username;\n  req.session.userAccessScope =", "  req.session.username = payload.username;\n  req.session.displayName = payload.userDisplayName || payload.username || null;\n  req.session.userAccessScope =")
          replace('src/server.js', "  req.username = req.session?.username || null;\n  req.userAccessScope =", "  req.username = req.session?.username || null;\n  req.displayName = req.session?.displayName || null;\n  req.userAccessScope =")
          replace('src/server.js', "      username: true,\n      passwordHash: true,", "      username: true,\n      displayName: true,\n      passwordHash: true,")
          replace('src/server.js', "        username,\n        userAccessScope: 'ALL',", "        username,\n        userDisplayName: username,\n        userAccessScope: 'ALL',")

          replace('src/routes/dispatchAttendanceAdmin.js', "  return {\n    actorUsername: normalizeString(req.session?.username || req.username) || 'operaciones',\n    actorRole: normalizeString(req.session?.userRole || req.userRole)\n  };", "  return {\n    actorUserId: normalizeString(req.session?.userId || req.userId),\n    actorUsername: normalizeString(req.session?.displayName || req.displayName || req.session?.username || req.username) || 'operaciones',\n    actorRole: normalizeString(req.session?.userRole || req.userRole)\n  };")

          remaining = []
          for path in Path('src').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  content = path.read_text()
              except UnicodeDecodeError:
                  continue
              if 'reclutador-general' in content:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('legacy name remains in runtime source: ' + ', '.join(remaining))
          PY

      - name: Commit deterministic cleanup
        shell: bash
        run: |
          rm .github/workflows/legacy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/legacy-cleanup.yml
          git diff --cached --check
          git commit -m "refactor(auth): remove legacy general recruiter authority"
          git push origin HEAD:refactor/remove-legacy-general-recruiter
