name: Temporary 1546 actor audit validation

on:
  push:
    branches:
      - fix/1546-candidate-admin-actor-name
    paths:
      - .github/workflows/tmp-1546-diagnose.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://validation:validation@localhost:5432/lorren_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1546-candidate-admin-actor-name
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply focused patch
        run: |
          python3 .github/scripts/tmp_1546_apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/adminManualCv.test.js')
          text = path.read_text()
          old = '    assert.match(devHtml, /Apertura histórica/);'
          new = '    assert.match(devHtml, /Abrio WhatsApp del candidato/);'
          assert old in text, 'historical event assertion not found'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate Prisma
        run: |
          npx prisma validate
          npm run prisma:generate
      - name: Run focused regressions
        run: node --test --test-name-pattern="movimientos del reclutador|cambio de estado registra trazabilidad administrativa" test/adminManualCv.test.js
      - name: Check syntax and diff
        run: |
          node --check src/routes/admin.js
          node --check test/adminManualCv.test.js
          git diff --check
      - name: Commit focused change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma prisma/migrations/20260902140500_add_candidate_admin_event_actor_user/migration.sql src/routes/admin.js src/views/detail.ejs test/adminManualCv.test.js
          git commit -m 'fix(dev): identify candidate movement actors'
          git push origin HEAD:fix/1546-candidate-admin-actor-name
