name: Apply admin manual message repository migration

on:
  push:
    branches:
      - refactor/443-admin-manual-message-repository

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/443-admin-manual-message-repository
          fetch-depth: 0
      - name: Apply exact migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/admin.js')
          text = path.read_text(encoding='utf-8')

          import_old = "import { sendTextMessage } from '../services/whatsapp.js';\n"
          import_new = import_old + "import { persistOutboundConversationMessage } from '../services/conversationMessageRepository.js';\n"
          if "persistOutboundConversationMessage" not in text:
              if text.count(import_old) != 1:
                  raise SystemExit('No se encontró exactamente un import de WhatsApp')
              text = text.replace(import_old, import_new, 1)

          old = """  await prisma.message.create({
            data: {
              candidateId: candidate.id,
              direction: MessageDirection.OUTBOUND,
              messageType: MessageType.TEXT,
              body: finalBody,
              rawPayload: safety.blocked ? { ...authorizedPayload, replySafety: { blocked: true, blockedClaims: safety.blockedClaims, reason: safety.reason } } : authorizedPayload
            }
          });"""
          new = """  await persistOutboundConversationMessage(prisma, {
            candidateId: candidate.id,
            messageType: MessageType.TEXT,
            body: finalBody,
            rawPayload: safety.blocked ? { ...authorizedPayload, replySafety: { blocked: true, blockedClaims: safety.blockedClaims, reason: safety.reason } } : authorizedPayload
          });"""
          if old not in text and new not in text:
              raise SystemExit('No se encontró el bloque exacto de persistencia manual')
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('El bloque de persistencia manual no es único')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: delegar mensajes manuales del panel al repositorio"
          git push origin HEAD:refactor/443-admin-manual-message-repository
