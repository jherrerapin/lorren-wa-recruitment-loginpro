name: Apply Candidate admin interview progress authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.head_ref == 'refactor/552-candidate-admin-interview-progress-authority'
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/552-candidate-admin-interview-progress-authority
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact patch
        run: python3 scripts/apply-552-candidate-admin-interview-progress.py

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate JavaScript syntax
        run: |
          node --check src/services/candidateStateService.js
          node --check src/routes/admin.js
          node --check test/candidateAdminInterviewProgressStateService.test.js
          node --check test/adminInterviewBookingAuthority.test.js
          node --check test/candidateProgressAuthority.test.js

      - name: Test Candidate admin interview progress authority
        run: node --test test/candidateAdminInterviewProgressStateService.test.js

      - name: Test admin interview booking contracts
        run: node --test test/adminInterviewBookingAuthority.test.js

      - name: Test Candidate progress gate
        run: node --test test/candidateProgressAuthority.test.js

      - name: Test InterviewBooking authority regressions
        run: node --test test/interviewBookingStateService.test.js

      - name: Commit functional change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: centralizar progreso administrativo de entrevistas (#552)"
          git push origin HEAD:refactor/552-candidate-admin-interview-progress-authority
