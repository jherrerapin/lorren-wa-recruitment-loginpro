name: Apply issue 688 WhatsApp cleanup

on:
  pull_request:
    branches:
      - automation/688-cleanup-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/688-clean-dispatch-whatsapp-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          ref: refactor/688-clean-dispatch-whatsapp-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Stop on a captured validation diagnostic
        run: |
          if [ -f .github/issue-688-validation-error.txt ]; then
            cat .github/issue-688-validation-error.txt
            exit 1
          fi

      - name: Load exact cleanup recipe
        run: |
          git fetch origin automation/688-cleanup-runner
          git show origin/automation/688-cleanup-runner:.github/scripts/apply-issue-688.py > /tmp/apply-issue-688.py
          git show origin/automation/688-cleanup-runner:.github/scripts/normalize-issue-688.py > /tmp/normalize-issue-688.py

      - name: Apply exact cleanup
        run: |
          python3 /tmp/apply-issue-688.py
          python3 /tmp/normalize-issue-688.py
          rm -f .github/issue-688-trigger.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate cleanup
        run: |
          set +e
          {
            npx prisma validate &&
            npm run prisma:generate &&
            node --check src/services/dispatchWhatsappWebServiceV6.js &&
            node --check src/services/dispatchWhatsappWebService.js &&
            node --check src/routes/dispatchWaRouterV2.js &&
            node --check test/dispatchWhatsappRuntimeContracts.test.js &&
            node --test test/dispatchWhatsappRuntimeContracts.test.js &&
            git diff --check
          } > /tmp/issue-688-validation.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-688-validation.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/issue-688-validation.log .github/issue-688-validation-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/issue-688-validation-error.txt
            git commit -m "chore: capturar diagnóstico de limpieza #688"
            git push origin HEAD:refactor/688-clean-dispatch-whatsapp-runtime
            exit "$status"
          fi

      - name: Commit canonical cleanup
        run: |
          if git diff --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: limpiar runtime de WhatsApp despacho (#688)"
          git push origin HEAD:refactor/688-clean-dispatch-whatsapp-runtime
