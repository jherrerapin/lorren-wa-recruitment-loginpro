name: Preconsent Patch Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: preconsent-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-preconsent-patch:
    name: Validate preconsent textual patch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply reviewed textual patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in \
            test/patches/preconsent-release.patch \
            test/patches/preconsent-corrections.patch \
            test/patches/preconsent-fixtures.patch
          do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          git diff -- \
            src/services/dataConsentGate.js \
            src/services/conversationMessageRepository.js \
            test/conversationalReleaseCandidatePreConsent.test.js \
            test/consentBoundaryHardening.test.js \
            test/flexibleApplicationFlow.test.js

      - name: Check modified JavaScript syntax
        run: >-
          node --check src/services/dataConsentGate.js &&
          node --check src/services/conversationMessageRepository.js &&
          node --check test/conversationalReleaseCandidatePreConsent.test.js &&
          node --check test/consentBoundaryHardening.test.js &&
          node --check test/flexibleApplicationFlow.test.js

      - name: Run integral conversational release candidate
        run: >-
          node --test
          test/conversationalReleaseCandidatePreConsent.test.js
          test/preConsentDataEvidence.test.js
          test/dataConsentRevocationStabilization.test.js
          test/dataConsentHumanPauseReplay.test.js
          test/conversationReplayConsentAttachmentEdges.test.js
          test/conversationReplayRecovery.test.js
          test/conversationReplayProductionEdges.test.js
          test/conversationHarness.test.js

      - name: Run focal consent regressions against known debt
        shell: bash
        run: |
          set +e
          node --test \
            test/flexibleApplicationFlow.test.js \
            test/consentBoundaryHardening.test.js \
            test/dataConsentPromptIdempotencyReplay.test.js \
            test/dataConsentAcceptedRevocationAuthority.test.js \
            test/conversationMessageRepository.test.js \
            > focal-output.log 2>&1
          focal_exit=$?
          set -e
          fail_count=$(awk '/^# fail [0-9]+$/ { value = $3 } END { print value }' focal-output.log)
          fail_count="${fail_count:-0}"
          echo "Focal consent regressions: fail=$fail_count exit=$focal_exit"
          if [ "$fail_count" -gt 1 ]; then
            cat focal-output.log
            exit 1
          fi
          if [ "$fail_count" -eq 1 ] && ! grep -q 'replay CONV-034: una pregunta pendiente se responde una vez ante reintento' focal-output.log; then
            cat focal-output.log
            exit 1
          fi

      - name: Run full suite against exact baseline
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          test_exit=$?
          set -e
          tests_count=$(awk '/^# tests [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          pass_count=$(awk '/^# pass [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          fail_count=$(awk '/^# fail [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          echo "Patched suite: total=$tests_count pass=$pass_count fail=$fail_count exit=$test_exit"
          if ! [[ "$tests_count" =~ ^[0-9]+$ ]] || ! [[ "$fail_count" =~ ^[0-9]+$ ]]; then
            tail -n 120 test-output.log
            exit 1
          fi
          if [ "$fail_count" -gt 71 ]; then
            grep -E '^not ok [0-9]+ - ' test-output.log || true
            exit 1
          fi
          grep -E '^not ok [0-9]+ - ' test-output.log || true

      - name: Commit validated source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          rm -f .github/workflows/preconsent-patch-validation.yml
          rm -f test/patches/preconsent-release.patch
          rm -f test/patches/preconsent-corrections.patch
          rm -f test/patches/preconsent-fixtures.patch
          git add -A \
            .github/workflows/preconsent-patch-validation.yml \
            test/patches \
            src/services/dataConsentGate.js \
            src/services/conversationMessageRepository.js \
            test/conversationalReleaseCandidatePreConsent.test.js \
            test/consentBoundaryHardening.test.js \
            test/flexibleApplicationFlow.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(conversation): enforce preconsent release invariants"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload validated logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: preconsent-validation-logs
          path: |
            focal-output.log
            test-output.log
          if-no-files-found: warn
          retention-days: 3
