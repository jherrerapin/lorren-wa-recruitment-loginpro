name: Apply RFCOMM resilience
on:
  push:
    branches:
      - fix/android-rfcomm-discovery-resilience
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-rfcomm-discovery-resilience
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgical patch
        run: python .github/tmp/apply-rfcomm-final.py
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Run RFCOMM resilience regression
        run: node --test test/workerPortalAndroidRfcommResilience.test.js
      - name: Build Android debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit validated implementation
        run: |
          rm -f .github/tmp/apply-rfcomm-final.py .github/workflows/apply-rfcomm-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(android): endurecer descubrimiento RFCOMM de cuadrilla'
          git push origin HEAD:fix/android-rfcomm-discovery-resilience
