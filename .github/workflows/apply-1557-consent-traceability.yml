name: Apply consent traceability patch

on:
  push:
    branches:
      - feat/1557-consentimiento-botones-trazabilidad

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply consent traceability patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/1557-consentimiento-botones-trazabilidad
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node scripts/apply-1557-consent-traceability.mjs
      - name: Remove temporary patch harness and superseded proof files
        run: |
          rm -f scripts/apply-1557-consent-traceability.mjs
          rm -f .github/workflows/apply-1557-consent-traceability.yml
          rm -f .github/workflows/consent-buttons-traceability-proof.yml
          rm -f test/consentButtonsTraceability.test.js
      - name: Commit patched branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(bot): humanizar trazabilidad de consentimiento (#1557) [apply consent traceability patch]"
          git push origin HEAD:feat/1557-consentimiento-botones-trazabilidad
