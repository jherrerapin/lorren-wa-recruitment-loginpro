name: Add CV token schema

on:
  push:
    branches:
      - fix/cv-token-savings-persistent-cache
    paths:
      - .schema/apply-cv-token-savings

permissions:
  contents: write

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-token-savings-persistent-cache
          fetch-depth: 0

      - name: Add additive Prisma models
        shell: python
        run: |
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()

          vacancy_anchor = '  dispatchWorkers        DispatchWorkerVacancy[]\n}'
          vacancy_replacement = '''  dispatchWorkers        DispatchWorkerVacancy[]
  cvReviewProfiles       CvReviewProfile[]
  cvCandidateComparisons CvCandidateComparison[]
  cvAnalysisUsages       CvAnalysisUsage[]
}'''
          if vacancy_anchor not in text:
              raise SystemExit('Vacancy relation anchor not found')
          text = text.replace(vacancy_anchor, vacancy_replacement, 1)

          candidate_anchor = '  dispatchWorker         DispatchWorker?\n\n  @@index([campaignId])'
          candidate_replacement = '''  dispatchWorker         DispatchWorker?
  cvCandidateComparisons CvCandidateComparison[]

  @@index([campaignId])'''
          if candidate_anchor not in text:
              raise SystemExit('Candidate relation anchor not found')
          text = text.replace(candidate_anchor, candidate_replacement, 1)

          model_anchor = '''model AppUser {'''
          models = '''model CvReviewProfile {
  id                 String   @id @default(cuid())
  fingerprint        String   @unique
  vacancyId          String
  vacancy            Vacancy  @relation(fields: [vacancyId], references: [id], onDelete: Cascade)
  modelUsed          String
  interpretedProfile Json
  createdAt          DateTime @default(now())
  updatedAt          DateTime @updatedAt

  @@index([vacancyId])
}

model CvCandidateComparison {
  id          String    @id @default(cuid())
  fingerprint String    @unique
  candidateId String
  candidate   Candidate @relation(fields: [candidateId], references: [id], onDelete: Cascade)
  vacancyId   String?
  vacancy     Vacancy?  @relation(fields: [vacancyId], references: [id], onDelete: SetNull)
  modelUsed   String
  level       String
  score       Float
  reasons     Json
  evidence    Json
  gaps        Json
  createdAt   DateTime  @default(now())
  updatedAt   DateTime  @updatedAt

  @@index([candidateId])
  @@index([vacancyId])
}

model CvAnalysisUsage {
  id                String   @id @default(cuid())
  stage             String
  vacancyId         String?
  vacancy           Vacancy? @relation(fields: [vacancyId], references: [id], onDelete: SetNull)
  candidateCount    Int      @default(0)
  modelUsed         String
  inputTokens       Int      @default(0)
  cachedInputTokens Int      @default(0)
  cacheWriteTokens  Int      @default(0)
  outputTokens      Int      @default(0)
  reasoningTokens   Int      @default(0)
  totalTokens       Int      @default(0)
  createdAt         DateTime @default(now())

  @@index([createdAt])
  @@index([stage, createdAt])
  @@index([vacancyId, createdAt])
}

model AppUser {'''
          if model_anchor not in text:
              raise SystemExit('Model insertion anchor not found')
          text = text.replace(model_anchor, models, 1)
          path.write_text(text)

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          DATABASE_URL='postgresql://user:pass@localhost:5432/lorren_test' npx prisma validate
          npm run build
          node --check src/services/cvIntelligence.js
          node --test test/cvTokenSavings.test.js test/cvIntelligenceReviewContracts.test.js test/attachmentAnalysisContract.test.js
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .schema
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- prisma/schema.prisma .schema
          git commit -m 'fix: alinear Prisma con caché persistente de HV'
          git push origin HEAD:fix/cv-token-savings-persistent-cache