name: tmp-fix-vacancy-public-info-contract-v4
on:
  push:
    branches: [fix/production-ad-flow-20260808]
permissions:
  contents: write
jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Apply validated patch and final semantic replay alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/tmp-fix-vacancy-public-info-contract-v3.yml').read_text(encoding='utf-8')
          match = re.search(r"      - name: Apply runtime patch and align obsolete contracts\n        run: \|\n(?P<body>.*?)\n      - run: npm ci", source, re.S)
          if not match:
              raise SystemExit('v3 patch block not found')
          body = textwrap.dedent(match.group('body')).rstrip()
          prefix = "python3 - <<'PY'\n"
          if not body.startswith(prefix) or not body.endswith('\nPY'):
              raise SystemExit('unexpected v3 patch wrapper')
          exec(compile(body[len(prefix):-3], '<runtime-patch-v3>', 'exec'), {})

          replay = Path('test/conversation-replay/vacancyConsentOrderReplay.js')
          text = replay.read_text(encoding='utf-8')
          old = "'Encontré la vacante'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy presentation literal, got {text.count(old)}')
          text = text.replace(old, "'(te comparto la información|encontré la vacante)'", 1)
          replay.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run prisma:generate
      - name: Syntax checks
        run: |
          node --check src/services/vacancyPublicInfo.js
          node --check src/services/vacancyFirstGate.js
          node --check src/services/dataConsentGate.js
          node --check src/services/conversationIntent.js
          node --check test/vacancyConfiguredInformationContract.test.js
          node --check test/vacancyFirstGate.test.js
          node --check test/conversation-replay/vacancyConsentOrderReplay.js
      - name: Focused regressions
        run: |
          node --test \
            test/vacancyConfiguredInformationContract.test.js \
            test/productionPaidAdFlowRegressions.test.js \
            test/vacancyFirstGate.test.js \
            test/vacancyBeforeConsentReplay.test.js \
            test/dataConsentOrderReplay.test.js
      - name: Validate no duplicate punctuation
        run: |
          node --input-type=module - <<'NODE'
          import { buildVacancyQuestionReply } from './src/services/dataConsentGate.js';
          const cases = [
            [{ title: 'Auxiliar', conditions: 'Salario y horario.' }, '¿Cuál es el salario?'],
            [{ title: 'Auxiliar', requirements: 'Experiencia logística.' }, '¿Qué requisitos tiene?']
          ];
          for (const [vacancy, question] of cases) {
            const reply = buildVacancyQuestionReply(vacancy, question);
            if (reply.includes('..')) throw new Error(`duplicate punctuation: ${reply}`);
          }
          NODE
      - name: Commit validated runtime and remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-run-vacancy-public-info-contract.yml
          rm -f .github/workflows/tmp-fix-vacancy-public-info-contract-v2.yml
          rm -f .github/workflows/tmp-fix-vacancy-public-info-contract-v3.yml
          rm -f .github/workflows/tmp-fix-vacancy-public-info-contract-v4.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: respetar configuración de vacante antes del consentimiento"
          git push origin HEAD:fix/production-ad-flow-20260808
