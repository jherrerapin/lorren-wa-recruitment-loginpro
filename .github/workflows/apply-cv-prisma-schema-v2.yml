name: Apply CV Prisma schema v2

on:
  push:
    branches: [fix/cv-token-savings-persistent-cache]
    paths: [.schema2/apply]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-token-savings-persistent-cache
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('prisma/schema.prisma')
          s = p.read_text()
          a = '  dispatchWorkers        DispatchWorkerVacancy[]\n}'
          b = '  dispatchWorker         DispatchWorker?\n\n  @@index([campaignId])'
          c = 'model AppUser {'
          assert a in s and b in s and c in s
          s = s.replace(a, '''  dispatchWorkers        DispatchWorkerVacancy[]
  cvReviewProfiles       CvReviewProfile[]
  cvCandidateComparisons CvCandidateComparison[]
  cvAnalysisUsages       CvAnalysisUsage[]
}''', 1)
          s = s.replace(b, '''  dispatchWorker         DispatchWorker?
  cvCandidateComparisons CvCandidateComparison[]

  @@index([campaignId])''', 1)
          s = s.replace(c, '''model CvReviewProfile {
  id                 String   @id @default(cuid())
  fingerprint        String   @unique
  vacancyId          String
  vacancy            Vacancy  @relation(fields: [vacancyId], references: [id], onDelete: Cascade)
  modelUsed          String
  interpretedProfile Json
  createdAt          DateTime @default(now())
  updatedAt          DateTime @updatedAt

  @@index([vacancyId])
}

model CvCandidateComparison {
  id          String    @id @default(cuid())
  fingerprint String    @unique
  candidateId String
  candidate   Candidate @relation(fields: [candidateId], references: [id], onDelete: Cascade)
  vacancyId   String?
  vacancy     Vacancy?  @relation(fields: [vacancyId], references: [id], onDelete: SetNull)
  modelUsed   String
  level       String
  score       Float
  reasons     Json
  evidence    Json
  gaps        Json
  createdAt   DateTime  @default(now())
  updatedAt   DateTime  @updatedAt

  @@index([candidateId])
  @@index([vacancyId])
}

model CvAnalysisUsage {
  id                String   @id @default(cuid())
  stage             String
  vacancyId         String?
  vacancy           Vacancy? @relation(fields: [vacancyId], references: [id], onDelete: SetNull)
  candidateCount    Int      @default(0)
  modelUsed         String
  inputTokens       Int      @default(0)
  cachedInputTokens Int      @default(0)
  cacheWriteTokens  Int      @default(0)
  outputTokens      Int      @default(0)
  reasoningTokens   Int      @default(0)
  totalTokens       Int      @default(0)
  createdAt         DateTime @default(now())

  @@index([createdAt])
  @@index([stage, createdAt])
  @@index([vacancyId, createdAt])
}

model AppUser {''', 1)
          p.write_text(s)
          PY
          rm -rf .schema .schema2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- prisma/schema.prisma .schema .schema2
          git commit -m 'fix: alinear Prisma con caché persistente de HV'
          git push origin HEAD:fix/cv-token-savings-persistent-cache