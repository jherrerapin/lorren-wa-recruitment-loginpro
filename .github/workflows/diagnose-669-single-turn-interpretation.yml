name: Diagnose single turn patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'refactor/669-single-turn-interpretation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Inspect exact markers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/routes/webhook.js', 'utf8');
          const markers = [
            `  alignCandidateLocationFields,\n`,
            `  isHighConfidenceLocalField,\n`,
            `  shouldPreserveStructuredLocalField\n`,
            `import { sanitizeCandidateFieldsForConversation } from '../services/fieldSanitizer.js';\n`,
            'function mergeFieldSource(sourceByField, field, source) {',
            'function shouldUseEngineFieldPreview(candidate, cleanText, localParsedData = {}, aiFields = {}) {',
            '  const aiResult = await tryOpenAIParse(cleanText);\n',
            '  debugTrace.vacancy_hint_role = vacancyHints.roleHint;\n'
          ];
          const symbols = [
            'alignCandidateLocationFields',
            'isHighConfidenceLocalField',
            'shouldPreserveStructuredLocalField',
            'sanitizeCandidateFieldsForConversation',
            'mergeFieldSource',
            'sumTokenUsage',
            'turnInterpretation'
          ];
          const result = {
            markers: markers.map((marker) => ({ marker, count: source.split(marker).length - 1, firstIndex: source.indexOf(marker) })),
            symbols: Object.fromEntries(symbols.map((symbol) => [symbol, (source.match(new RegExp(`\\b${symbol}\\b`, 'g')) || []).length])),
            candidateImport: source.slice(source.indexOf("import {\n  alignCandidateLocationFields"), source.indexOf("} from '../services/candidateData.js';") + "} from '../services/candidateData.js';".length)
          };
          fs.writeFileSync('diagnose-669.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: diagnose-669
          path: diagnose-669.json
          if-no-files-found: error
          retention-days: 2
