name: Issue 766 data confirmation diagnostic

on:
  pull_request:
    branches:
      - automation/766-data-confirmation-diagnostic

permissions:
  contents: read

jobs:
  diagnose-confirmation-output:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_test
      LORREN_SEND_DELAY_MS: 0
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run both modes for data confirmation
        shell: bash
        run: |
          node test/helpers/runConversationParityCases.js false '["no-infinite-confirmation"]' > /tmp/mode-false.log 2>&1
          node test/helpers/runConversationParityCases.js true '["no-infinite-confirmation"]' > /tmp/mode-true.log 2>&1
          grep '^__LORREN_PARITY__' /tmp/mode-false.log | tail -1 | sed 's/^__LORREN_PARITY__//' > /tmp/mode-false.json
          grep '^__LORREN_PARITY__' /tmp/mode-true.log | tail -1 | sed 's/^__LORREN_PARITY__//' > /tmp/mode-true.json
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('/tmp/mode-false.json')); const b=JSON.parse(fs.readFileSync('/tmp/mode-true.json')); fs.writeFileSync('/tmp/data-confirmation-diagnostic.json', JSON.stringify({withoutEngine:a[0],withEngine:b[0]}, null, 2));"
          cat /tmp/data-confirmation-diagnostic.json

      - name: Upload normalized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: issue-766-data-confirmation-diagnostic
          path: /tmp/data-confirmation-diagnostic.json
          if-no-files-found: error
          retention-days: 1
