name: Apply missing fields alias retirement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/656-remove-missing-fields-aliases'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply verified retirement patch
        run: node scripts/apply-656-remove-missing-fields-aliases.mjs

      - name: Validate focused contracts
        run: |
          node --check src/routes/webhook.js
          node --check test/webhookReadinessAliasRemoval.test.js
          node --test test/webhookReadinessAliasRemoval.test.js test/transitionalCodeInventory.test.js

      - name: Commit final slice and remove temporary machinery
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/webhook.js config/transitional-code-inventory.json docs/architecture/transitional-code-inventory.md test/webhookReadinessAliasRemoval.test.js
          git rm scripts/apply-656-remove-missing-fields-aliases.mjs .github/workflows/apply-656-missing-fields-aliases.yml
          git commit -m "refactor: retirar aliases redundantes de campos faltantes"
          git push origin "HEAD:${HEAD_REF}"
