name: Apply biometric resume fix

on:
  push:
    branches:
      - fix/worker-biometric-resume-timeout

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/worker-biometric-resume-timeout
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply focused biometric resume fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/public/worker-biometric-mobile.js')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  const RUNTIME_MAX_IDLE_MS = 10 * 60 * 1000;",
                  "  const RUNTIME_PREPARE_TIMEOUT_MS = 30_000;\n  const RUNTIME_MAX_IDLE_MS = 12 * 60 * 60 * 1000;"
              ),
              (
                  """  function sleep(milliseconds) {
    return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
  }
""",
                  """  function sleep(milliseconds) {
    return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
  }

  function withTimeout(promise, timeoutMs, errorCode) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const timer = window.setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error(errorCode));
      }, timeoutMs);
      Promise.resolve(promise).then((value) => {
        if (settled) return;
        settled = true;
        window.clearTimeout(timer);
        resolve(value);
      }, (error) => {
        if (settled) return;
        settled = true;
        window.clearTimeout(timer);
        reject(error);
      });
    });
  }
"""
              ),
              (
                  """  async function prepare() {
    const human = await humanInstance();
    return {
      ready: true,
      backend: human.tf?.getBackend?.() || human.config?.backend || BACKENDS[backendIndex]
    };
  }
""",
                  """  function dialogIsOpen(target) {
    return Boolean(target && (target.open === true || target.hasAttribute?.('open')));
  }

  function activePreparationVideo() {
    const markDialog = document.getElementById('mark-dialog');
    if (dialogIsOpen(markDialog)) return document.getElementById('camera-video');
    const enrollmentDialog = document.getElementById('enrollment-dialog');
    if (dialogIsOpen(enrollmentDialog)) return document.getElementById('enrollment-video');
    return null;
  }

  function liveStreamFor(video) {
    const stream = video?.srcObject;
    const track = stream?.getVideoTracks?.()[0];
    return track
      && track.readyState === 'live'
      && track.enabled === true
      && track.muted !== true
      ? stream
      : null;
  }

  async function prepare() {
    const video = activePreparationVideo();
    if (video && !liveStreamFor(video)) await startCamera(video);

    let human;
    try {
      human = await withTimeout(
        humanInstance(),
        RUNTIME_PREPARE_TIMEOUT_MS,
        'biometric_runtime_unavailable'
      );
    } catch (cause) {
      if (cause?.message === 'biometric_page_not_visible') throw cause;
      await invalidateRuntime('prepare-failed');
      const error = new Error('biometric_runtime_unavailable');
      error.cause = cause;
      throw error;
    }

    return {
      ready: true,
      backend: human.tf?.getBackend?.() || human.config?.backend || BACKENDS[backendIndex]
    };
  }
"""
              ),
              (
                  """  async function startCamera(video) {
    if (!video || !navigator.mediaDevices?.getUserMedia) throw new Error('camera_unavailable');
    if (document.visibilityState === 'hidden') throw new Error('biometric_page_not_visible');
    stopAllStreams();
    resetVideo(video);
""",
                  """  async function startCamera(video) {
    if (!video || !navigator.mediaDevices?.getUserMedia) throw new Error('camera_unavailable');
    if (document.visibilityState === 'hidden') throw new Error('biometric_page_not_visible');
    const currentStream = liveStreamFor(video);
    if (currentStream) {
      video.hidden = false;
      return currentStream;
    }
    stopAllStreams();
    resetVideo(video);
"""
              ),
              (
                  """  function suspendForLifecycle(reason) {
    stopAllStreams();
    invalidateRuntime(reason);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') suspendForLifecycle('document-hidden');
  }, { capture: true });
  document.addEventListener('freeze', () => suspendForLifecycle('document-frozen'), { capture: true });
  document.addEventListener('resume', () => invalidateRuntime('document-resumed'), { capture: true });
  window.addEventListener('pagehide', () => suspendForLifecycle('page-hidden'), { capture: true });
  window.addEventListener('pageshow', (event) => {
    if (event.persisted || document.wasDiscarded) invalidateRuntime('page-restored');
  }, { capture: true });
  if (document.wasDiscarded) invalidateRuntime('page-discarded');
""",
                  """  function suspendStreamsForLifecycle(reason) {
    stopAllStreams();
    runtimeReason = String(reason || 'lifecycle-suspended');
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') suspendStreamsForLifecycle('document-hidden');
  }, { capture: true });
  document.addEventListener('freeze', () => {
    stopAllStreams();
    invalidateRuntime('document-frozen');
  }, { capture: true });
  document.addEventListener('resume', () => {
    runtimeReason = 'document-resumed';
  }, { capture: true });
  window.addEventListener('pagehide', () => suspendStreamsForLifecycle('page-hidden'), { capture: true });
  window.addEventListener('pageshow', (event) => {
    if (document.wasDiscarded) invalidateRuntime('page-discarded');
    else if (event.persisted) runtimeReason = 'page-restored';
  }, { capture: true });
  if (document.wasDiscarded) invalidateRuntime('page-discarded');
"""
              )
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one exact match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

          Path('test/workerBiometricResumeContracts.test.js').write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';

const mobile = fs.readFileSync('src/public/worker-biometric-mobile.js', 'utf8');


test('la biometría permanece disponible durante una jornada completa', () => {
  assert.match(mobile, /RUNTIME_MAX_IDLE_MS = 12 \* 60 \* 60 \* 1000/);
  assert.doesNotMatch(mobile, /RUNTIME_MAX_IDLE_MS = 10 \* 60 \* 1000/);
  assert.match(mobile, /suspendStreamsForLifecycle\('document-hidden'\)/);
  assert.doesNotMatch(mobile, /suspendForLifecycle\('document-hidden'\)/);
  assert.match(mobile, /if \(document\.wasDiscarded\) invalidateRuntime\('page-discarded'\)/);
});


test('la preparación biométrica nunca queda esperando indefinidamente', () => {
  assert.match(mobile, /RUNTIME_PREPARE_TIMEOUT_MS = 30_000/);
  assert.match(mobile, /function withTimeout\(promise, timeoutMs, errorCode\)/);
  assert.match(mobile, /withTimeout\(\s*humanInstance\(\),\s*RUNTIME_PREPARE_TIMEOUT_MS,\s*'biometric_runtime_unavailable'/s);
  assert.match(mobile, /await invalidateRuntime\('prepare-failed'\)/);
});


test('la cámara se muestra antes de esperar los modelos y no se reinicia si ya está viva', () => {
  assert.match(mobile, /const video = activePreparationVideo\(\)/);
  assert.match(mobile, /if \(video && !liveStreamFor\(video\)\) await startCamera\(video\)/);
  assert.match(mobile, /const currentStream = liveStreamFor\(video\)/);
  assert.match(mobile, /if \(currentStream\) \{\s*video\.hidden = false;\s*return currentStream;/s);
});
""", encoding='utf-8')
          PY

      - name: Validate focused change
        run: |
          node --check src/public/worker-biometric-mobile.js
          node --test \
            test/workerBiometricResumeContracts.test.js \
            test/workerBiometricMobileStabilityContracts.test.js \
            test/workerBiometricIntegrationContracts.test.js \
            test/workerPortalUiCacheContracts.test.js

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-biometric-resume-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/worker-biometric-mobile.js test/workerBiometricResumeContracts.test.js .github/workflows/apply-biometric-resume-fix.yml
          git commit -m "fix: reanudar biometría después de varias horas"
          git push origin HEAD:fix/worker-biometric-resume-timeout
