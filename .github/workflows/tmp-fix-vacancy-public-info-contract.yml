name: tmp-fix-vacancy-public-info-contract
on:
  push:
    branches: [fix/production-ad-flow-20260808]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Patch runtime and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          # Shared authority: only structured vacancy settings become extra public facts.
          Path('src/services/vacancyPublicInfo.js').write_text(r'''function configuredInteger(value) {
            return Number.isInteger(value) ? value : null;
          }

          function sentence(fragment = '') {
            const value = String(fragment || '').trim();
            if (!value) return '';
            return `${value.charAt(0).toUpperCase()}${value.slice(1)}.`;
          }

          export function getConfiguredAgeRequirementText(vacancy = {}) {
            const minAge = configuredInteger(vacancy?.minAge);
            const maxAge = configuredInteger(vacancy?.maxAge);
            if (minAge !== null && maxAge !== null) {
              if (minAge === maxAge) return `la edad configurada es ${minAge} años`;
              return `el rango de edad configurado es de ${minAge} a ${maxAge} años`;
            }
            if (minAge !== null) return `la edad mínima configurada es ${minAge} años`;
            if (maxAge !== null) return `la edad máxima configurada es ${maxAge} años`;
            return '';
          }

          export function getConfiguredExperienceRequirementText(vacancy = {}) {
            const mode = String(vacancy?.experienceRequired || '').trim().toUpperCase();
            const time = String(vacancy?.experienceTimeText || '').trim();
            if (mode === 'YES') {
              return time ? `la experiencia requerida es ${time}` : 'se requiere experiencia previa';
            }
            if (mode === 'NO') return 'no se requiere experiencia previa';
            return '';
          }

          export function getConfiguredPublicRequirementSentences(vacancy = {}, requirementsText = '') {
            const requirements = String(requirementsText || '').trim();
            const facts = [];
            const age = getConfiguredAgeRequirementText(vacancy);
            const experience = getConfiguredExperienceRequirementText(vacancy);
            const requirementsAlreadyMentionAge = /\bedad\b|\b\d{1,2}\s*(?:a|-)\s*\d{1,2}\s*a[nñ]os?\b/i.test(requirements);
            const requirementsAlreadyMentionExperience = /\bexperiencia\b/i.test(requirements);
            if (age && !requirementsAlreadyMentionAge) facts.push(sentence(age));
            if (experience && !requirementsAlreadyMentionExperience) facts.push(sentence(experience));
            return facts;
          }
          ''', encoding='utf-8')

          # vacancyFirstGate: structured age/experience, no residence request before consent.
          p = 'src/services/vacancyFirstGate.js'
          t = read(p)
          import_anchor = "import { evaluateVacancyConceptAlternative, VacancyConceptAlternativeAction } from './vacancyConceptMatcher.js';"
          t = one(t, import_anchor, import_anchor + "\nimport { getConfiguredAgeRequirementText, getConfiguredExperienceRequirementText, getConfiguredPublicRequirementSentences } from './vacancyPublicInfo.js';", 'vacancy public info import')

          fact_pair = """  if (requirements) facts.push(`Los requisitos registrados son: ${requirements}.`);
            if (conditions) facts.push(`Las condiciones registradas son: ${conditions}.`);"""
          fact_pair_new = """  if (requirements) facts.push(`Los requisitos registrados son: ${requirements}.`);
            facts.push(...getConfiguredPublicRequirementSentences(vacancy, requirements));
            if (conditions) facts.push(`Las condiciones registradas son: ${conditions}.`);"""
          if t.count(fact_pair) != 2:
              raise SystemExit(f'vacancy fact pairs: expected 2, got {t.count(fact_pair)}')
          t = t.replace(fact_pair, fact_pair_new)

          old_need_role = """function buildNeedRoleForCityReply(city = null, roleHint = null, inboundText = '') {
            const normalized = normalizeResolverText(inboundText);
            const asksCompany = /\\b(empresa|compania|cliente|quien contrata|para que empresa|operacion)\\b/.test(normalized);
            const companyAnswer = asksCompany
              ? 'El proceso de selección lo gestiona LoginPro Service. Para decirte la empresa u operación exacta registrada necesito identificar primero la vacante.'
              : '';
            const hasRoleHint = Boolean(String(roleHint || '').trim());
            if (hasRoleHint) {
              const next = isBogotaCity(city)
                ? 'Ya tengo la ciudad y el cargo de interés. ¿En qué localidad vives?'
                : 'Ya tengo la ciudad y el cargo de interés. ¿Para qué operación o vacante viste la convocatoria?';
              return [companyAnswer, next].filter(Boolean).join(' ');
            }
            const localityPart = isBogotaCity(city) ? ' y en qué localidad estás' : '';
            const next = `¿Para qué vacante o cargo estás interesado${localityPart}?`;
            return [companyAnswer || 'Gracias por contarme desde dónde escribes.', next].join(' ');
          }"""
          new_need_role = """function buildNeedRoleForCityReply(city = null, roleHint = null, inboundText = '') {
            const normalized = normalizeResolverText(inboundText);
            const asksCompany = /\\b(empresa|compania|cliente|quien contrata|para que empresa|operacion)\\b/.test(normalized);
            const companyAnswer = asksCompany
              ? 'El proceso de selección lo gestiona LoginPro Service. Para decirte la empresa u operación exacta registrada necesito identificar primero la vacante.'
              : '';
            const hasRoleHint = Boolean(String(roleHint || '').trim());
            if (hasRoleHint) {
              return [companyAnswer, 'Ya tengo la ciudad y el cargo de interés. ¿Para qué operación o vacante viste la convocatoria?']
                .filter(Boolean)
                .join(' ');
            }
            return [companyAnswer || 'Gracias por contarme desde dónde escribes.', '¿Para qué vacante o cargo estás interesado?']
              .filter(Boolean)
              .join(' ');
          }"""
          t = one(t, old_need_role, new_need_role, 'remove pre-consent locality request')

          req_branch = """  if (/\\b(requisito|requisitos|perfil|experiencia|estudio|formacion|moto|carro|transporte|vehiculo)\\b/.test(normalized)) {
            return requirements
              ? `Los requisitos registrados para ${title}${location} son: ${requirements}.`
              : `No tengo requisitos adicionales registrados para ${title}${location}.`;
          }"""
          req_branch_new = """  if (/\\b(edad|rango de edad)\\b/.test(normalized)) {
            const ageRequirement = getConfiguredAgeRequirementText(vacancy);
            return ageRequirement
              ? `Para ${title}${location}, ${ageRequirement}.`
              : `No hay un rango de edad configurado para ${title}${location}.`;
          }

          if (/\\b(experiencia|tiempo de experiencia)\\b/.test(normalized)) {
            const experienceRequirement = getConfiguredExperienceRequirementText(vacancy);
            if (experienceRequirement) return `Para ${title}${location}, ${experienceRequirement}.`;
            return requirements && /\\bexperiencia\\b/i.test(requirements)
              ? `Los requisitos registrados para ${title}${location} son: ${requirements}.`
              : `No hay un requisito específico de experiencia configurado para ${title}${location}.`;
          }

          if (/\\b(requisito|requisitos|perfil|estudio|formacion|moto|carro|transporte|vehiculo)\\b/.test(normalized)) {
            return requirements
              ? `Los requisitos registrados para ${title}${location} son: ${requirements}.`
              : `No tengo requisitos adicionales registrados para ${title}${location}.`;
          }"""
          t = one(t, req_branch, req_branch_new, 'structured age and experience question branch')
          write(p, t)

          # dataConsentGate campaign path: same public facts and exact age answer.
          p = 'src/services/dataConsentGate.js'
          t = read(p)
          consent_import_anchor = "import { cancelReminderOnInbound } from './reminder.js';"
          t = one(t, consent_import_anchor, consent_import_anchor + "\nimport { getConfiguredAgeRequirementText, getConfiguredExperienceRequirementText, getConfiguredPublicRequirementSentences } from './vacancyPublicInfo.js';", 'consent public info import')

          old_info = """function buildVacancyInfoReply(vacancy = {}) {
            const city = vacancyCity(vacancy);
            const parts = [`Perfecto, te comparto la información registrada de ${vacancyTitle(vacancy)}${city ? ` en ${city}` : ''}.`];
            if (vacancy.roleDescription) parts.push(`El cargo consiste en ${vacancy.roleDescription}.`);
            if (vacancy.operationAddress) parts.push(`Zona de operación: ${vacancy.operationAddress}.`);
            if (vacancy.requirements) parts.push(`Requisitos: ${vacancy.requirements}.`);
            if (vacancy.conditions) parts.push(`Condiciones: ${vacancy.conditions}.`);
            if (vacancy.requiredDocuments) parts.push(`Documentos para el proceso: ${vacancy.requiredDocuments}.`);
            parts.push('¿Te interesa continuar con esta postulación?');
            return parts.join('\\n\\n');
          }"""
          new_info = """function buildVacancyInfoReply(vacancy = {}) {
            const city = vacancyCity(vacancy);
            const parts = [`Perfecto, te comparto la información registrada de ${vacancyTitle(vacancy)}${city ? ` en ${city}` : ''}.`];
            const requirements = String(vacancy.requirements || '').trim();
            if (vacancy.roleDescription) parts.push(`El cargo consiste en ${vacancy.roleDescription}.`);
            if (vacancy.operationAddress) parts.push(`Zona de operación: ${vacancy.operationAddress}.`);
            if (requirements) parts.push(`Requisitos: ${requirements}.`);
            parts.push(...getConfiguredPublicRequirementSentences(vacancy, requirements));
            if (vacancy.conditions) parts.push(`Condiciones: ${vacancy.conditions}.`);
            if (vacancy.requiredDocuments) parts.push(`Documentos para el proceso: ${vacancy.requiredDocuments}.`);
            parts.push('¿Te interesa continuar con esta postulación?');
            return parts.join('\\n\\n');
          }"""
          t = one(t, old_info, new_info, 'campaign vacancy info structured facts')

          salary_anchor = """  if (/\\b(salario|sueldo|pago|cuanto pagan|cuanto es)\\b/.test(normalized)) {"""
          company_branch = """  if (/\\b(empresa|compania|cliente|quien contrata|para que empresa|operacion)\\b/.test(normalized)) {
            const operationName = String(vacancy?.operation?.name || '').trim();
            return operationName
              ? `El proceso de selección lo gestiona LoginPro Service. La operación registrada para esta vacante es ${operationName}.`
              : 'El proceso de selección lo gestiona LoginPro Service.';
          }

          """ + salary_anchor
          t = one(t, salary_anchor, company_branch, 'campaign company question')

          old_req = """  if (/\\b(requisito|perfil|edad|experiencia|estudio|formacion|documento|moto|carro|transporte|vehiculo)\\b/.test(normalized)) {
            const parts = [];
            if (vacancy.requirements) parts.push(vacancy.requirements);
            if (vacancy.requiredDocuments && /\\bdocumento\\b/.test(normalized)) parts.push(`Documentos: ${vacancy.requiredDocuments}`);
            return parts.length
              ? `${lead}, los requisitos registrados son: ${parts.join('. ')}.`
              : 'No tengo ese requisito registrado para esta vacante.';
          }"""
          new_req = """  if (/\\b(edad|rango de edad)\\b/.test(normalized)) {
            const ageRequirement = getConfiguredAgeRequirementText(vacancy);
            return ageRequirement
              ? `${lead}, ${ageRequirement}.`
              : 'No hay un rango de edad configurado para esta vacante.';
          }
          if (/\\b(experiencia|tiempo de experiencia)\\b/.test(normalized)) {
            const experienceRequirement = getConfiguredExperienceRequirementText(vacancy);
            if (experienceRequirement) return `${lead}, ${experienceRequirement}.`;
            return vacancy.requirements && /\\bexperiencia\\b/i.test(vacancy.requirements)
              ? `${lead}, los requisitos registrados son: ${vacancy.requirements}.`
              : 'No hay un requisito específico de experiencia configurado para esta vacante.';
          }
          if (/\\b(requisito|perfil|estudio|formacion|documento|moto|carro|transporte|vehiculo)\\b/.test(normalized)) {
            const parts = [];
            if (vacancy.requirements) parts.push(vacancy.requirements);
            if (vacancy.requiredDocuments && /\\bdocumento\\b/.test(normalized)) parts.push(`Documentos: ${vacancy.requiredDocuments}`);
            return parts.length
              ? `${lead}, los requisitos registrados son: ${parts.join('. ')}.`
              : 'No tengo ese requisito registrado para esta vacante.';
          }"""
          t = one(t, old_req, new_req, 'campaign exact age and experience answers')
          write(p, t)

          # Intent classifier must understand an age question as a vacancy-information question.
          p = 'src/services/conversationIntent.js'
          t = read(p)
          old_topics = "documentos|experiencia|empresa|compania|cliente|operacion)\\b/;"
          new_topics = "documentos|experiencia|edad|empresa|compania|cliente|operacion)\\b/;"
          t = one(t, old_topics, new_topics, 'age vacancy information topic')
          write(p, t)

          # Audit considers structured age/experience as configured vacancy information.
          p = 'src/services/conversationAudit.js'
          t = read(p)
          old_configured = """      || candidate?.vacancy?.operationAddress
            || candidate?.vacancy?.requiredDocuments
          );"""
          new_configured = """      || candidate?.vacancy?.operationAddress
            || candidate?.vacancy?.requiredDocuments
            || Number.isInteger(candidate?.vacancy?.minAge)
            || Number.isInteger(candidate?.vacancy?.maxAge)
            || ['YES', 'NO'].includes(String(candidate?.vacancy?.experienceRequired || '').toUpperCase())
          );"""
          t = one(t, old_configured, new_configured, 'audit structured vacancy configuration')
          old_regex = "/\\b(requisitos?|condiciones?|zona de operaci[oó]n|el cargo consiste|documentos? registrados?)\\b/i.test(body)"
          new_regex = "/\\b(requisitos?|condiciones?|zona de operaci[oó]n|el cargo consiste|documentos? registrados?|rango de edad|edad m[ií]nima|edad m[aá]xima|experiencia requerida|no se requiere experiencia)\\b/i.test(body)"
          t = one(t, old_regex, new_regex, 'audit vacancy information evidence')
          write(p, t)

          # Focused regressions for the contract requested for Lórren.
          Path('test/vacancyConfiguredInformationContract.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { resolveVacancyFirstGate, VacancyFirstGateAction } from '../src/services/vacancyFirstGate.js';
          import { buildVacancyQuestionReply } from '../src/services/dataConsentGate.js';
          import { analyzeConversationTurn } from '../src/services/conversationIntent.js';

          const configuredVacancy = {
            id: 'vac-configured-info',
            title: 'Líder de Operación',
            role: 'Líder de Operación',
            city: 'Neiva',
            roleDescription: 'Liderar y administrar personal operativo',
            operationAddress: 'Sector Las Brisas',
            requirements: 'Técnico o tecnólogo en logística',
            conditions: 'Turnos rotativos y prestaciones de ley',
            requiredDocuments: null,
            minAge: 23,
            maxAge: 45,
            experienceRequired: 'YES',
            experienceTimeText: 'mínimo 6 meses en operaciones logísticas',
            isActive: true,
            acceptingApplications: true,
            operation: { name: 'Operación Neiva', city: { name: 'Neiva' } }
          };

          function candidate(overrides = {}) {
            return {
              id: 'cand-configured-info',
              currentStep: 'GREETING_SENT',
              status: 'NUEVO',
              vacancyId: null,
              dataConsentStatus: 'PENDING',
              botResumeMode: null,
              ...overrides
            };
          }

          test('vacante identificada muestra solo hechos configurados, incluido rango de edad y experiencia', async () => {
            const decision = await resolveVacancyFirstGate({
              prisma: null,
              candidate: candidate(),
              currentVacancy: null,
              inboundText: 'Líder de operación Neiva',
              currentStep: 'GREETING_SENT',
              recentMessages: [],
              vacancyHints: { allVacancies: [configuredVacancy], activeVacancies: [configuredVacancy] }
            });
            assert.equal(decision.action, VacancyFirstGateAction.REPLY);
            assert.equal(decision.reason, 'ACTIVE_VACANCY_RESOLVED_AWAIT_INTEREST');
            assert.match(decision.reply, /23 a 45 años/i);
            assert.match(decision.reply, /mínimo 6 meses en operaciones logísticas/i);
            assert.match(decision.reply, /te interesa continuar/i);
            assert.doesNotMatch(decision.reply, /no especificado|no registrado/i);
          });

          test('vacante sin rango de edad no inventa ni menciona edad en la presentación automática', async () => {
            const vacancy = { ...configuredVacancy, id: 'vac-no-age', minAge: null, maxAge: null };
            const decision = await resolveVacancyFirstGate({
              prisma: null,
              candidate: candidate(),
              currentVacancy: null,
              inboundText: 'Líder de operación Neiva',
              currentStep: 'GREETING_SENT',
              recentMessages: [],
              vacancyHints: { allVacancies: [vacancy], activeVacancies: [vacancy] }
            });
            assert.doesNotMatch(decision.reply, /rango de edad|edad mínima|edad máxima/i);
          });

          test('pregunta por edad usa minAge/maxAge y no responde con requisitos genéricos', () => {
            const reply = buildVacancyQuestionReply(configuredVacancy, '¿Qué edad piden para la vacante?');
            assert.match(reply, /23 a 45 años/i);
            assert.doesNotMatch(reply, /Técnico o tecnólogo/i);
          });

          test('pregunta por edad sin minAge/maxAge declara ausencia sin inventar rango', () => {
            const reply = buildVacancyQuestionReply({ ...configuredVacancy, minAge: null, maxAge: null }, '¿Qué edad piden?');
            assert.match(reply, /no hay un rango de edad configurado/i);
            assert.doesNotMatch(reply, /23|45/);
          });

          test('pregunta por empresa usa la operación realmente asociada a la vacante', () => {
            const reply = buildVacancyQuestionReply(configuredVacancy, '¿Para qué empresa u operación es?');
            assert.match(reply, /LoginPro Service/i);
            assert.match(reply, /Operación Neiva/i);
          });

          test('edad se clasifica como consulta de información de vacante', () => {
            const turn = analyzeConversationTurn('¿Qué edad piden para esta vacante?');
            assert.equal(turn.vacancyInformationRequest, true);
          });

          test('antes del consentimiento Bogotá no solicita localidad ni residencia para identificar vacante', async () => {
            const other = {
              ...configuredVacancy,
              id: 'vac-bogota-other',
              title: 'Auxiliar de Bodega',
              role: 'Auxiliar de Bodega',
              city: 'Bogotá',
              operation: { name: 'Operación Bogotá 1', city: { name: 'Bogotá' } }
            };
            const another = {
              ...configuredVacancy,
              id: 'vac-bogota-another',
              title: 'Auxiliar Logístico',
              role: 'Auxiliar Logístico',
              city: 'Bogotá',
              operation: { name: 'Operación Bogotá 2', city: { name: 'Bogotá' } }
            };
            const decision = await resolveVacancyFirstGate({
              prisma: null,
              candidate: candidate(),
              currentVacancy: null,
              inboundText: 'Bogotá',
              currentStep: 'GREETING_SENT',
              recentMessages: [],
              vacancyHints: { allVacancies: [other, another], activeVacancies: [other, another] }
            });
            assert.equal(decision.action, VacancyFirstGateAction.REPLY);
            assert.doesNotMatch(decision.reply, /localidad|barrio|d[oó]nde vives|residencia/i);
            assert.match(decision.reply, /vacante|cargo/i);
          });
          ''', encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run prisma:generate
      - name: Syntax checks
        run: |
          node --check src/services/vacancyPublicInfo.js
          node --check src/services/vacancyFirstGate.js
          node --check src/services/dataConsentGate.js
          node --check src/services/conversationIntent.js
          node --check src/services/conversationAudit.js
          node --check test/vacancyConfiguredInformationContract.test.js
      - name: Focused regression suite
        run: |
          node --test \
            test/vacancyConfiguredInformationContract.test.js \
            test/productionPaidAdFlowRegressions.test.js \
            test/vacancyFirstGate.test.js \
            test/vacancyBeforeConsentReplay.test.js \
            test/conversationAuditPaidAdRegressions.test.js \
            test/dataConsentOrderReplay.test.js
      - name: Commit validated runtime and remove this workflow
        run: |
          rm -f .github/workflows/tmp-fix-vacancy-public-info-contract.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: respetar configuración pública de vacante antes del consentimiento"
          git push origin HEAD:fix/production-ad-flow-20260808
