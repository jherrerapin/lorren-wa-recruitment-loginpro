name: Apply 1561 experience segmentation patch

on:
  push:
    branches:
      - fix/1561-experiencia-respuesta-multiproposito

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/1561-experiencia-respuesta-multiproposito
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node scripts/apply-1561-experience-segmentation.mjs
      - run: node --check src/services/conversationUnderstanding.js
      - run: |
          git rm .github/workflows/apply-1561-experience-segmentation.yml scripts/apply-1561-experience-segmentation.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/conversationUnderstanding.js
          git commit -m 'fix(bot): segmentar evidencia contextual de experiencia #1561'
          git push origin HEAD:fix/1561-experiencia-respuesta-multiproposito
