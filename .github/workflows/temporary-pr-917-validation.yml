name: Temporary PR 917 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check modified JavaScript syntax
        run: |
          node --check src/public/worker-portal-sw.js
          node --check src/public/worker-portal-offline.js
      - name: Run offline retry contracts
        run: |
          node --test test/workerPortalUiCacheContracts.test.js
          node --test test/workerPortalOfflineContracts.test.js

