name: tmp-failure-identity-diagnostic
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Capture current full suite
        shell: bash
        run: |
          set +e
          npm test > current.log 2>&1
          echo $? > current.exit
          set -e
      - uses: actions/checkout@v5
        with:
          ref: ed754a71254393ad9de57c4551a65b4fc731fbfd
          path: .baseline
          persist-credentials: false
      - name: Capture base full suite
        shell: bash
        run: |
          cd .baseline
          npm ci
          npm run prisma:generate
          set +e
          npm test > "$GITHUB_WORKSPACE/base.log" 2>&1
          echo $? > "$GITHUB_WORKSPACE/base.exit"
          set -e
      - name: Print exact failure identity delta
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            awk '
              function emit_pending() {
                if (pending != "" && !is_subtest_container) print pending
                pending = ""; is_subtest_container = 0
              }
              /^[[:space:]]*not ok [0-9]+ - / {
                emit_pending(); identity=$0
                sub(/^[[:space:]]*not ok [0-9]+ - /, "", identity)
                sub(/[[:space:]]+#.*$/, "", identity)
                sub(/[[:space:]]+$/, "", identity)
                pending=identity; next
              }
              pending != "" && /^[[:space:]]*failureType:[[:space:]].*subtestsFailed/ { is_subtest_container=1; next }
              END { emit_pending() }
            ' "$1" | LC_ALL=C sort -u > "$2"
          }
          extract base.log base.failures
          extract current.log current.failures
          LC_ALL=C comm -23 current.failures base.failures > unexpected.failures
          LC_ALL=C comm -13 current.failures base.failures > resolved.failures
          echo "=== CURRENT SUMMARY ==="
          grep -E '^# (tests|pass|fail|cancelled|skipped) ' current.log | tail -n 5 || true
          echo "=== BASE SUMMARY ==="
          grep -E '^# (tests|pass|fail|cancelled|skipped) ' base.log | tail -n 5 || true
          echo "=== UNEXPECTED IDENTITIES ==="
          cat unexpected.failures || true
          echo "=== RESOLVED/RENAMED BASE IDENTITIES ==="
          cat resolved.failures || true
          echo "=== CONTEXT FOR UNEXPECTED IDENTITIES ==="
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            echo "--- $id ---"
            grep -F -B 8 -A 28 -- "$id" current.log | head -n 80 || true
          done < unexpected.failures
          if [ -s unexpected.failures ]; then exit 1; fi
