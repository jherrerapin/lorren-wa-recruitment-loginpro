name: Temporary biometric marking reliability runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.head_ref == 'fix/biometric-marking-reliability' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded grace fix
        run: python .github/scripts/temp_finalize_biometric_reliability.py

      - name: Validate final biometric contracts
        shell: bash
        run: |
          node --check src/public/worker-biometric-mobile.js
          node --test test/workerBiometricMarkingReliabilityContracts.test.js
          node --test test/workerBiometricMobileStabilityContracts.test.js
          node --test test/workerBiometricIntegrationContracts.test.js
          node --test test/workerBiometricAccessibilityContracts.test.js

      - name: Commit final validated fix
        shell: bash
        run: |
          rm .github/scripts/temp_finalize_biometric_reliability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/worker-biometric-mobile.js \
            test/workerBiometricMarkingReliabilityContracts.test.js \
            .github/scripts/temp_finalize_biometric_reliability.py
          git commit -m "fix: acotar prórroga de captura facial"
          git push origin HEAD:${{ github.head_ref }}