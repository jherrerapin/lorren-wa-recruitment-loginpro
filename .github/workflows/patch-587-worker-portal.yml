name: Patch 587 worker portal

on:
  push:
    branches:
      - feat/587-worker-portal-activation-router

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feat/587-worker-portal-activation-router
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Apply exact server patch
        run: node scripts/patch-587-worker-portal-server.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate portal route
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
        run: |
          node --check src/routes/workerPortal.js
          node --check src/server.js
          node --test test/workerPortalActivationRouter.test.js
          npx prisma validate

      - name: Remove temporary automation files
        run: |
          rm -f scripts/patch-587-worker-portal-server.mjs
          rm -f .github/workflows/patch-587-worker-portal.yml
          rm -f .github/patch-587-trigger.txt

      - name: Commit functional patch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: montar activación pública del portal del auxiliar'
          git push origin HEAD:feat/587-worker-portal-activation-router
