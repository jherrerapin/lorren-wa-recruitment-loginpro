name: Temporary 1543 DEV pause followup

on:
  push:
    branches:
      - fix/1543-dev-manual-pause-lock
    paths:
      - .github/workflows/tmp-1543-dev-pause-followup.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1543-dev-manual-pause-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply sticky pause through manual outbound
        run: |
          python3 - <<'PY'
          from pathlib import Path

          state_path = Path('src/services/candidateStateService.js')
          state = state_path.read_text()
          old = """export async function finalizeManualOutboundDelivery(client, input = {}) {
            const candidateClient = requireCandidateClient(client);
            const candidateId = requireCandidateId(input.candidateId);
            const expected = requireClaimedManualOutboundSnapshot(input.expected);
            const sentAtInput = input.sentAt === undefined ? new Date() : input.sentAt;
            const sentAt = requireValidDate(sentAtInput, 'candidate_manual_outbound_sent_at');

            return applyConditionalCandidatePauseTransition(candidateClient, {
              candidateId,
              expected: manualOutboundExpectedWhere(expected),
              data: {
                lastOutboundAt: sentAt,
                botResumeMode: 'manual_resume_dashboard'
              }
            });
          }
          """.replace('          ', '')
          new = """export async function finalizeManualOutboundDelivery(client, input = {}) {
            const candidateClient = requireCandidateClient(client);
            const candidateId = requireCandidateId(input.candidateId);
            const expected = requireClaimedManualOutboundSnapshot(input.expected);
            const previous = input.previous == null ? null : normalizeManualOutboundSnapshot(input.previous);
            const sentAtInput = input.sentAt === undefined ? new Date() : input.sentAt;
            const sentAt = requireValidDate(sentAtInput, 'candidate_manual_outbound_sent_at');
            const preserveExplicitAdminPause = Boolean(
              previous?.botPaused
              && previous?.botResumeMode === EXPLICIT_ADMIN_PAUSE_MODE
            );

            return applyConditionalCandidatePauseTransition(candidateClient, {
              candidateId,
              expected: manualOutboundExpectedWhere(expected),
              data: preserveExplicitAdminPause
                ? {
                  botPaused: true,
                  botPausedAt: previous.botPausedAt,
                  botPausedBy: previous.botPausedBy,
                  botPauseReason: previous.botPauseReason,
                  botResumeMode: EXPLICIT_ADMIN_PAUSE_MODE,
                  reminderScheduledFor: previous.reminderScheduledFor,
                  reminderState: previous.reminderState,
                  lastOutboundAt: sentAt
                }
                : {
                  lastOutboundAt: sentAt,
                  botResumeMode: 'manual_resume_dashboard'
                }
            });
          }
          """.replace('          ', '')
          assert old in state, 'finalizeManualOutboundDelivery block not found'
          state_path.write_text(state.replace(old, new, 1))

          delivery_path = Path('src/services/manualOutboundDeliveryService.js')
          delivery = delivery_path.read_text()
          old_call = """      const candidateResult = await finalizeManualOutboundDelivery(tx, {
                candidateId,
                expected: preparation.claimed,
                sentAt
              });
          """.replace('          ', '')
          new_call = """      const candidateResult = await finalizeManualOutboundDelivery(tx, {
                candidateId,
                expected: preparation.claimed,
                previous: preparation.previous,
                sentAt
              });
          """.replace('          ', '')
          assert old_call in delivery, 'manual outbound finalizer call not found'
          delivery_path.write_text(delivery.replace(old_call, new_call, 1))

          pause_test_path = Path('test/candidateAdminPauseStateService.test.js')
          pause_test = pause_test_path.read_text()
          old_import = "import { EXPLICIT_ADMIN_PAUSE_MODE } from '../src/services/botAutomationPolicy.js';"
          new_import = "import { EXPLICIT_ADMIN_PAUSE_MODE, shouldResumeAutomationOnInbound } from '../src/services/botAutomationPolicy.js';"
          assert old_import in pause_test
          pause_test = pause_test.replace(old_import, new_import, 1)
          assertion_anchor = "  assert.equal(result.candidate.botResumeMode, EXPLICIT_ADMIN_PAUSE_MODE);\n  assert.equal(result.candidate.reminderScheduledFor, null);"
          assert assertion_anchor in pause_test
          pause_test = pause_test.replace(
            assertion_anchor,
            "  assert.equal(result.candidate.botResumeMode, EXPLICIT_ADMIN_PAUSE_MODE);\n  assert.equal(shouldResumeAutomationOnInbound(result.candidate), false);\n  assert.equal(result.candidate.reminderScheduledFor, null);",
            1
          )
          pause_test_path.write_text(pause_test)

          delivery_test_path = Path('test/manualOutboundDeliveryService.test.js')
          delivery_test = delivery_test_path.read_text()
          import_anchor = "} from '../src/services/candidateStateService.js';\n"
          assert import_anchor in delivery_test
          delivery_test = delivery_test.replace(
            import_anchor,
            import_anchor + "import { EXPLICIT_ADMIN_PAUSE_MODE, shouldResumeAutomationOnInbound } from '../src/services/botAutomationPolicy.js';\n",
            1
          )
          test_anchor = "test('un rechazo HTTP confirmado marca FAILED y restaura todo el snapshot previo', async () => {"
          assert test_anchor in delivery_test
          regression = """test('envío manual exitoso conserva una pausa explícita de DEV hasta reactivación administrativa', async () => {
            const explicitPauseAt = new Date('2026-07-16T00:45:00.000Z');
            const explicitPausedCandidate = {
              ...baseCandidate,
              botPaused: true,
              botPausedAt: explicitPauseAt,
              botPausedBy: 'dev',
              botPauseReason: 'Revisión manual de conversación',
              botResumeMode: EXPLICIT_ADMIN_PAUSE_MODE,
              reminderScheduledFor: null,
              reminderState: 'CANCELLED'
            };
            const harness = createHarness({ candidate: explicitPausedCandidate });

            const result = await deliverManualOutboundText(harness.prisma, input, {
              sendText: harness.sendText,
              now: createClock('2026-07-16T01:02:00.000Z', '2026-07-16T01:02:02.000Z')
            });

            assert.equal(result.sent, true);
            assert.equal(harness.calls.sends.length, 1);
            assert.equal(harness.state.candidate.botPaused, true);
            assert.equal(harness.state.candidate.botResumeMode, EXPLICIT_ADMIN_PAUSE_MODE);
            assert.equal(harness.state.candidate.botPausedAt.toISOString(), explicitPauseAt.toISOString());
            assert.equal(harness.state.candidate.botPausedBy, 'dev');
            assert.equal(harness.state.candidate.botPauseReason, 'Revisión manual de conversación');
            assert.equal(harness.state.candidate.reminderScheduledFor, null);
            assert.equal(harness.state.candidate.reminderState, 'CANCELLED');
            assert.equal(harness.state.candidate.lastOutboundAt.toISOString(), '2026-07-16T01:02:02.000Z');
            assert.equal(shouldResumeAutomationOnInbound(harness.state.candidate), false);
          });

          """.replace('          ', '')
          delivery_test_path.write_text(delivery_test.replace(test_anchor, regression + test_anchor, 1))
          PY
          git checkout origin/main -- lorren_comportamiento_completo.md test/adminBotPause.test.js
      - name: Run focal regressions
        run: node --test test/adminBotPause.test.js test/candidateAdminPauseStateService.test.js test/manualOutboundDeliveryService.test.js
      - name: Check syntax
        run: |
          node --check src/services/botAutomationPolicy.js
          node --check src/services/candidateStateService.js
          node --check src/services/manualOutboundDeliveryService.js
          node --check test/candidateAdminPauseStateService.test.js
          node --check test/manualOutboundDeliveryService.test.js
      - name: Commit focused change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/botAutomationPolicy.js src/services/candidateStateService.js src/services/manualOutboundDeliveryService.js test/candidateAdminPauseStateService.test.js test/manualOutboundDeliveryService.test.js lorren_comportamiento_completo.md test/adminBotPause.test.js
          git commit -m 'fix(dev): preserve explicit pause through manual outbound'
          git push origin HEAD:fix/1543-dev-manual-pause-lock
