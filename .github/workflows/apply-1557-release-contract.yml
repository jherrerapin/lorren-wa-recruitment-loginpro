name: Apply consent release contract patch

on:
  push:
    branches:
      - feat/1557-consentimiento-botones-trazabilidad

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply consent release contract') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/1557-consentimiento-botones-trazabilidad
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node scripts/apply-1557-release-contract.mjs
      - name: Remove temporary patch harness
        run: |
          rm -f scripts/apply-1557-release-contract.mjs
          rm -f .github/workflows/apply-1557-release-contract.yml
      - name: Commit patched release contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(bot): validar privacidad sin etiquetas técnicas (#1557) [apply consent release contract]"
          git push origin HEAD:feat/1557-consentimiento-botones-trazabilidad
