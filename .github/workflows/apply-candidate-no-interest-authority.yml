name: Apply Candidate no-interest authority

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-candidate-no-interest-authority.mjs
      - test/candidateNoInterestStateService.test.js
      - test/conversationEngineNoInterestAuthority.test.js
      - .github/workflows/apply-candidate-no-interest-authority.yml
  push:
    branches:
      - refactor/512-candidate-no-interest-authority
    paths:
      - scripts/apply-candidate-no-interest-authority.mjs
      - test/candidateNoInterestStateService.test.js
      - test/conversationEngineNoInterestAuthority.test.js
      - .github/workflows/apply-candidate-no-interest-authority.yml

permissions:
  contents: write

concurrency:
  group: apply-candidate-no-interest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: refactor/512-candidate-no-interest-authority
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply exact no-interest patch
        run: node scripts/apply-candidate-no-interest-authority.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check src/services/candidateStateService.js
          node --check src/services/conversationEngine.js

      - name: Validate no-interest state service
        run: node --test test/candidateNoInterestStateService.test.js

      - name: Validate conversationEngine no-interest integration
        run: node --test test/conversationEngineNoInterestAuthority.test.js

      - name: Validate historical engine authority
        run: node --test test/conversationEngineStepAuthority.test.js test/conversationEngineGuardRails.test.js

      - name: Validate progress authority scanner
        run: node --test test/candidateProgressAuthority.test.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Create validated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/candidateStateService.js
          git add src/services/conversationEngine.js
          git add test/candidateNoInterestStateService.test.js
          git add test/conversationEngineNoInterestAuthority.test.js
          git add test/conversationEngineStepAuthority.test.js
          git add test/candidateProgressAuthority.test.js
          git add config/candidate-progress-authority.json
          git add docs/architecture/candidate-state-transition-inventory.md
          git commit -m "refactor: centralizar cierre por falta de interés"

      - name: Push validated commit
        run: git push origin HEAD:refactor/512-candidate-no-interest-authority
