name: Diagnose Candidate rejection scanner

on:
  push:
    branches:
      - refactor/519-candidate-rejection-authority
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/519-candidate-rejection-authority
          persist-credentials: false
      - name: Apply text transformations
        run: |
          node scripts/apply-candidate-requirement-rejection-authority.mjs
          node scripts/fix-generated-candidate-rejection-scanner.mjs
      - name: Capture syntax and diff checks
        id: checks
        shell: bash
        run: |
          set +e
          node --version > scanner-syntax.txt 2>&1
          node --check test/candidateProgressAuthority.test.js >> scanner-syntax.txt 2>&1
          syntax_status=$?
          git diff --check > diff-check.txt 2>&1
          diff_status=$?
          echo "syntax_exit_code=$syntax_status" >> scanner-syntax.txt
          echo "diff_exit_code=$diff_status" >> diff-check.txt
          echo "syntax_status=$syntax_status" >> "$GITHUB_OUTPUT"
          echo "diff_status=$diff_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload generated diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: generated-candidate-rejection-diagnostic
          path: |
            src/services/candidateStateService.js
            src/services/conversationEngine.js
            config/candidate-progress-authority.json
            docs/architecture/candidate-state-transition-inventory.md
            test/candidateProgressAuthority.test.js
            test/conversationEngineGuardRails.test.js
            scanner-syntax.txt
            diff-check.txt
      - name: Fail when a check failed
        if: steps.checks.outputs.syntax_status != '0' || steps.checks.outputs.diff_status != '0'
        run: |
          cat scanner-syntax.txt
          cat diff-check.txt
          exit 1
