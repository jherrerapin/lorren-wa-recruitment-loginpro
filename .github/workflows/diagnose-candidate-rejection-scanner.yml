name: Diagnose Candidate rejection scanner

on:
  push:
    branches:
      - refactor/519-candidate-rejection-authority
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/519-candidate-rejection-authority
          persist-credentials: false
      - name: Apply text transformations
        run: |
          node scripts/apply-candidate-requirement-rejection-authority.mjs
          node scripts/fix-generated-candidate-rejection-scanner.mjs
      - name: Capture generated scanner syntax result
        id: syntax
        shell: bash
        run: |
          set +e
          node --version > scanner-syntax.txt 2>&1
          node --check test/candidateProgressAuthority.test.js >> scanner-syntax.txt 2>&1
          status=$?
          echo "exit_code=$status" >> scanner-syntax.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload generated scanner and syntax output
        uses: actions/upload-artifact@v4
        with:
          name: generated-candidate-progress-diagnostic
          path: |
            test/candidateProgressAuthority.test.js
            scanner-syntax.txt
      - name: Fail when syntax check failed
        if: steps.syntax.outputs.status != '0'
        run: |
          cat scanner-syntax.txt
          exit 1
