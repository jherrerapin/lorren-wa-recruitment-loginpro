name: Finalize CV token savings

on:
  push:
    branches:
      - fix/cv-token-savings-persistent-cache
    paths:
      - .cv-finalize/apply

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-token-savings-persistent-cache
          fetch-depth: 0

      - name: Apply final functional patches
        shell: python
        run: |
          from pathlib import Path

          service = Path('src/services/cvIntelligence.js')
          text = service.read_text()
          old = '''  const comparisonEntries = readable.map((item) => {
    const candidatePayload = candidateForMatching(item.candidate, item.analysis);
    return {
      item,
      candidatePayload,
      modelUsed,
      fingerprint: reviewCacheKey('candidate-match', {
        model: modelUsed,
        comparisonProfile,
        candidate: candidatePayload
      })
    };
  });'''
          new = '''  const comparisonEntries = readable.map((item) => {
    const candidatePayload = candidateForMatching(item.candidate, item.analysis);
    const documentReference = parseCvAnalysisEvidence(item.analysis)?.documentReference
      || candidateCvReference(item.candidate);
    return {
      item,
      candidatePayload,
      modelUsed,
      fingerprint: reviewCacheKey('candidate-match', {
        model: modelUsed,
        comparisonProfile,
        documentReference,
        candidate: candidatePayload
      })
    };
  });'''
          if old not in text:
              raise SystemExit('comparison fingerprint block not found')
          service.write_text(text.replace(old, new, 1))

          schema = Path('prisma/schema.prisma')
          s = schema.read_text()
          vacancy_anchor = '  dispatchWorkers        DispatchWorkerVacancy[]\n}'
          candidate_anchor = '  dispatchWorker         DispatchWorker?\n\n  @@index([campaignId])'
          model_anchor = 'model AppUser {'
          if not all(anchor in s for anchor in (vacancy_anchor, candidate_anchor, model_anchor)):
              raise SystemExit('Prisma insertion anchor not found')
          s = s.replace(vacancy_anchor, '''  dispatchWorkers        DispatchWorkerVacancy[]
  cvReviewProfiles       CvReviewProfile[]
  cvCandidateComparisons CvCandidateComparison[]
  cvAnalysisUsages       CvAnalysisUsage[]
}''', 1)
          s = s.replace(candidate_anchor, '''  dispatchWorker         DispatchWorker?
  cvCandidateComparisons CvCandidateComparison[]

  @@index([campaignId])''', 1)
          models = '''model CvReviewProfile {
  id                 String   @id @default(cuid())
  fingerprint        String   @unique
  vacancyId          String
  vacancy            Vacancy  @relation(fields: [vacancyId], references: [id], onDelete: Cascade)
  modelUsed          String
  interpretedProfile Json
  createdAt          DateTime @default(now())
  updatedAt          DateTime @updatedAt

  @@index([vacancyId])
}

model CvCandidateComparison {
  id          String    @id @default(cuid())
  fingerprint String    @unique
  candidateId String
  candidate   Candidate @relation(fields: [candidateId], references: [id], onDelete: Cascade)
  vacancyId   String?
  vacancy     Vacancy?  @relation(fields: [vacancyId], references: [id], onDelete: SetNull)
  modelUsed   String
  level       String
  score       Float
  reasons     Json
  evidence    Json
  gaps        Json
  createdAt   DateTime  @default(now())
  updatedAt   DateTime  @updatedAt

  @@index([candidateId])
  @@index([vacancyId])
}

model CvAnalysisUsage {
  id                String   @id @default(cuid())
  stage             String
  vacancyId         String?
  vacancy           Vacancy? @relation(fields: [vacancyId], references: [id], onDelete: SetNull)
  candidateCount    Int      @default(0)
  modelUsed         String
  inputTokens       Int      @default(0)
  cachedInputTokens Int      @default(0)
  cacheWriteTokens  Int      @default(0)
  outputTokens      Int      @default(0)
  reasoningTokens   Int      @default(0)
  totalTokens       Int      @default(0)
  createdAt         DateTime @default(now())

  @@index([createdAt])
  @@index([stage, createdAt])
  @@index([vacancyId, createdAt])
}

model AppUser {'''
          schema.write_text(s.replace(model_anchor, models, 1))

          tests = Path('test/cvTokenSavings.test.js')
          t = tests.read_text().replace(
              'return structuredResponse({      results:',
              'return structuredResponse({\n      results:',
              1
          )
          old_test = '''  const changedInput = JSON.parse(requests[0].input[1].content[0].text);
  assert.deepEqual(changedInput.candidates.map((item) => item.candidateId), ['existing']);
});'''
          new_test = '''  const changedInput = JSON.parse(requests[0].input[1].content[0].text);
  assert.deepEqual(changedInput.candidates.map((item) => item.candidateId), ['existing']);

  clearCvIntelligenceCachesForTest();
  requests.length = 0;
  const replacementStorageKey = 'candidates/existing/hv-updated.pdf';
  const replacedCvCandidate = {
    ...firstCandidate,
    cvStorageKey: replacementStorageKey,
    cvOriginalName: 'existing-updated.pdf',
    attachmentAnalyses: [{
      ...firstCandidate.attachmentAnalyses[0],
      rawResponse: {
        ...firstCandidate.attachmentAnalyses[0].rawResponse,
        documentReference: `storage:${replacementStorageKey}`
      }
    }]
  };
  prisma.setCandidates([replacedCvCandidate, newCandidate]);
  await reviewVacancyCandidates(prisma, { vacancyId: targetVacancy.id, desiredProfile }, { openAiPost });
  assert.equal(requests.length, 1);
  const replacedCvInput = JSON.parse(requests[0].input[1].content[0].text);
  assert.deepEqual(replacedCvInput.candidates.map((item) => item.candidateId), ['existing']);
});'''
          if old_test not in t:
              raise SystemExit('CV replacement test anchor not found')
          tests.write_text(t.replace(old_test, new_test, 1))

      - name: Validate final scope
        shell: bash
        run: |
          set -euo pipefail
          node --check src/services/cvIntelligence.js
          node --check test/cvTokenSavings.test.js
          npm ci
          DATABASE_URL='postgresql://user:pass@localhost:5432/lorren_test' npx prisma validate
          npm run build
          node --test test/cvTokenSavings.test.js test/cvIntelligenceReviewContracts.test.js test/attachmentAnalysisContract.test.js
          git diff --check

      - name: Commit final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cv-finalize
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/services/cvIntelligence.js prisma/schema.prisma test/cvTokenSavings.test.js .cv-finalize
          git commit -m 'fix: completar ahorro persistente de tokens HV'
          git push origin HEAD:fix/cv-token-savings-persistent-cache