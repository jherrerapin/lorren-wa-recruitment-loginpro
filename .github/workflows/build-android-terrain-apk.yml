name: Build Android terrain APK

on:
  push:
    branches:
      - fix/android-crew-bluetooth-optimistic-sync
    paths:
      - '.github/workflows/build-android-terrain-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-crew-bluetooth-optimistic-sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Build debug APK
        working-directory: mobile/android
        run: >-
          gradle :app:assembleDebug
          -PlorrenPortalBaseUrl=https://lorren-wa-recruitment-loginpro-production.up.railway.app
          -PlorrenVersionCode=2
          -PlorrenVersionName=0.1.1-terrain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lorren-terrain-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
