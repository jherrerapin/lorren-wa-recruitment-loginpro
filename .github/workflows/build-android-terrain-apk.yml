name: Build Android terrain APK

on:
  push:
    branches:
      - fix/android-crew-bluetooth-optimistic-sync
    paths:
      - '.github/workflows/build-android-terrain-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/android-crew-bluetooth-optimistic-sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect Android SDK
        run: |
          echo "Installed platforms:"
          ls -1 /usr/local/lib/android/sdk/platforms || true
          echo "Installed build tools:"
          ls -1 /usr/local/lib/android/sdk/build-tools || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Build debug APK
        working-directory: mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace -PlorrenPortalBaseUrl=https://lorren-wa-recruitment-loginpro-production.up.railway.app -PlorrenVersionCode=2 -PlorrenVersionName=0.1.1-terrain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lorren-terrain-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
