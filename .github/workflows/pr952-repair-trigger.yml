name: Trigger validated PR 952 repair

on:
  pull_request:
    branches:
      - release/901-conversational-candidate-preconsent

permissions:
  contents: write

concurrency:
  group: pr952-repair-trigger
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'automation/pr952-repair-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the protected repair branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: release/901-conversational-candidate-preconsent
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${BRANCH_NAME}"
          git checkout -B "${BRANCH_NAME}" FETCH_HEAD

      - name: Execute the reviewed repair plan from the branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: release/901-conversational-candidate-preconsent
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr952-codex-regressions-red.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if lines[index] != '        run: |':
                  index += 1
                  continue
              index += 1
              block = []
              while index < len(lines):
                  line = lines[index]
                  if line and not line.startswith('          '):
                      break
                  block.append(line[10:] if line.startswith('          ') else '')
                  index += 1
              blocks.append('\n'.join(block).rstrip())

          if len(blocks) < 7:
              raise SystemExit(f'Expected the complete repair plan, found only {len(blocks)} shell blocks')

          # The first block is the push-event checkout. This trigger already checked out
          # the canonical branch, so execute every subsequent validated step in order.
          script = '#!/usr/bin/env bash\nset -euo pipefail\n\n' + '\n\n'.join(blocks[1:]) + '\n'
          Path('/tmp/pr952-repair.sh').write_text(script, encoding='utf-8')
          PY
          chmod +x /tmp/pr952-repair.sh
          /tmp/pr952-repair.sh
