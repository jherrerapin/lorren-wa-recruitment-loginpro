name: Diagnose engine follow-up deduplication

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose-harness:
    if: github.head_ref == 'fix/599-dedupe-engine-followup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture conversation harness output
        run: |
          mkdir -p diagnostics
          set +e
          node --test test/conversation-harness.test.js > diagnostics/599-conversation-harness.tap 2>&1
          status=$?
          echo "$status" > diagnostics/599-conversation-harness.status
          exit 0

      - name: Commit harness diagnostic
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/599-conversation-harness.tap diagnostics/599-conversation-harness.status
          if ! git diff --cached --quiet; then
            git commit -m "test: capturar divergencia del harness #599"
            git push origin "HEAD:${HEAD_REF}"
          fi
