name: Apply engine follow-up deduplication

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/599-dedupe-engine-followup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact patch
        run: node scripts/apply-599-dedupe-engine-followup.mjs

      - name: Validate syntax
        run: |
          node --check src/routes/webhook.js
          node --check src/services/replyComposition.js
          node --check test/replyComposition.test.js
          node --check test/webhookEngineFollowUpComposition.test.js

      - name: Run focused composition regressions
        run: node --test test/replyComposition.test.js test/webhookEngineFollowUpComposition.test.js

      - name: Run conversation engine guard regressions
        run: node --test test/conversationEngineGuardRails.test.js test/conversation-harness.test.js

      - name: Run conversation replays
        run: |
          node --test test/conversationReplayFixtures.test.js test/conversationReplayInterpretation.test.js test/conversationReplayPlanning.test.js test/conversationReplayIntegral.test.js test/conversationReplayRecovery.test.js

      - name: Commit generated webhook patch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/webhook.js
          git commit -m "fix: evitar seguimiento duplicado del engine"
          git push origin "HEAD:${HEAD_REF}"
