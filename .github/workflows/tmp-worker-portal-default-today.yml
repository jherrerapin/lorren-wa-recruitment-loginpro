name: Apply worker portal default today

on:
  push:
    branches:
      - fix/worker-portal-default-today-20260810

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/worker-portal-default-today-20260810
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply focused change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader_path = Path('src/public/worker-biometric.js')
          loader = loader_path.read_text(encoding='utf-8')
          old = "    document.body.classList.add('portal-filters-ready');\n    setPreset('all');\n    return true;"
          new = "    document.body.classList.add('portal-filters-ready');\n    setPreset('today');\n    return true;"
          if loader.count(old) != 1:
              raise SystemExit(f'Expected one initialization block, found {loader.count(old)}')
          loader_path.write_text(loader.replace(old, new, 1), encoding='utf-8')

          test_path = Path('test/workerPortalDefaultToday.test.js')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const read = (path) => readFile(new URL(`../${path}`, import.meta.url), 'utf8');

          test('el Portal del Auxiliar inicia mostrando las asignaciones de hoy', async () => {
            const loader = await read('src/public/worker-biometric.js');
            const portalView = await read('src/views/workerPortal.ejs');

            assert.match(portalView, /data-portal-preset=\"today\">Hoy<\/button>/);
            assert.match(loader, /function bogotaDateKey\(/);
            assert.match(loader, /timeZone:\s*'America\/Bogota'/);
            assert.match(loader, /if \(name === 'today'\) \{\s*fromInput\.value = today;\s*toInput\.value = today;/);
            assert.match(loader, /document\.body\.classList\.add\('portal-filters-ready'\);\s*setPreset\('today'\);\s*return true;/);
          });
          """, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check src/public/worker-biometric.js
          node --test test/workerPortalDefaultToday.test.js

      - name: Commit validated change
        shell: bash
        run: |
          rm .github/workflows/tmp-worker-portal-default-today.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/worker-biometric.js test/workerPortalDefaultToday.test.js .github/workflows/tmp-worker-portal-default-today.yml
          git commit -m "fix(portal): mostrar asignaciones de hoy por defecto"
          git push origin HEAD:fix/worker-portal-default-today-20260810
