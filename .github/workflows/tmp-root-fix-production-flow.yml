      - name: Require zero new full-suite failure identities
        run: |
          set -euo pipefail
          extract() {
            awk '
              function emit_pending() {
                if (pending != "" && !is_subtest_container) print pending
                pending = ""; is_subtest_container = 0
              }
              /^[[:space:]]*not ok [0-9]+ - / {
                emit_pending(); identity=$0
                sub(/^[[:space:]]*not ok [0-9]+ - /, "", identity)
                sub(/[[:space:]]+#.*$/, "", identity)
                sub(/[[:space:]]+$/, "", identity)
                pending=identity; next
              }
              pending != "" && /^[[:space:]]*failureType:[[:space:]].*subtestsFailed/ { is_subtest_container=1; next }
              END { emit_pending() }
            ' "$1" | LC_ALL=C sort -u > "$2"
          }
          extract base.log base.failures
          extract current.log current.failures
          LC_ALL=C comm -23 current.failures base.failures > unexpected.failures
          LC_ALL=C comm -13 current.failures base.failures > resolved.failures
          echo "=== CURRENT SUMMARY ==="
          grep -E '^# (tests|pass|fail|cancelled|skipped) ' current.log | tail -n 5 || true
          echo "=== BASE SUMMARY ==="
          grep -E '^# (tests|pass|fail|cancelled|skipped) ' base.log | tail -n 5 || true
          echo "=== UNEXPECTED IDENTITIES ==="
          cat unexpected.failures || true
          echo "=== RESOLVED BASE IDENTITIES ==="
          cat resolved.failures || true
          if [ -s unexpected.failures ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              echo "--- $id ---"
              grep -F -B 8 -A 30 -- "$id" current.log | head -n 90 || true
            done < unexpected.failures
            exit 1
          fi

