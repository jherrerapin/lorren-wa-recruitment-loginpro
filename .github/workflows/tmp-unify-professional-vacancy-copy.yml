name: tmp-unify-professional-vacancy-copy
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Adjust temporary patch runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_unify_professional_vacancy_copy.py')
          text = path.read_text(encoding='utf-8')
          old = "    t = replace_once(t, old, new, f'vacancy first wording {index}')"
          new = "    t = t.replace(old, new) if index == 6 else replace_once(t, old, new, f'vacancy first wording {index}')"
          if text.count(old) != 1:
              raise SystemExit('temporary runner replacement target not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply professional vacancy patch
        run: python3 scripts/tmp_unify_professional_vacancy_copy.py
      - name: Install dependencies
        run: |
          npm ci
          npm run prisma:generate
      - name: Validate vacancy and conversation regressions
        run: |
          node --check src/services/vacancyPublicInfo.js
          node --check src/services/vacancyFirstGate.js
          node --check src/services/dataConsentGate.js
          node --check test/vacancyConfiguredInformationContract.test.js
          node --test test/vacancyConfiguredInformationContract.test.js test/vacancyPresentationFormatAudit.test.js test/vacancyFirstGate.test.js test/conversationIntent.test.js test/productionPaidAdFlowRegressions.test.js test/conversationAuditPaidAdRegressions.test.js test/conversation-replay/vacancyConsentOrderReplay.js
      - name: Commit validated changes and cleanup
        run: |
          rm .github/workflows/tmp-unify-professional-vacancy-copy.yml
          rm scripts/tmp_unify_professional_vacancy_copy.py
          git add src/services/vacancyPublicInfo.js src/services/vacancyFirstGate.js src/services/dataConsentGate.js test/vacancyConfiguredInformationContract.test.js test/vacancyFirstGate.test.js .github/workflows/tmp-unify-professional-vacancy-copy.yml scripts/tmp_unify_professional_vacancy_copy.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: unificar presentación profesional de vacantes"
          git push origin HEAD:fix/production-ad-flow-20260808
