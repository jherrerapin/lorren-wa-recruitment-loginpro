name: Refine issue 944 vacancy registration order

on:
  pull_request:
    branches:
      - automation/944-vacancy-registration-order-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'fix/944-vacancy-registration-order-date-filter' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          ref: fix/944-vacancy-registration-order-date-filter
          fetch-depth: 0
          persist-credentials: true

      - name: Load refinement
        run: |
          git fetch origin automation/944-vacancy-registration-order-runner
          git show origin/automation/944-vacancy-registration-order-runner:.github/scripts/refine-issue-944.py > /tmp/refine-issue-944.py

      - name: Apply refinement
        run: python3 /tmp/refine-issue-944.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma and syntax
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/vacancyCandidateRegistrationPolicy.js
          node --check src/services/vacancyDashboardSearchExpansion.js
          node --check src/routes/admin.js
          node --check test/vacancyDashboardSearchExpansion.test.js

      - name: Run focused regressions
        run: |
          node --test test/vacancyDashboardSearchExpansion.test.js
          git diff --check

      - name: Create and verify refined commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preservar rango y alcance de vacante (#944)"
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 5
          test "${files[0]}" = "src/routes/admin.js"
          test "${files[1]}" = "src/services/vacancyCandidateRegistrationPolicy.js"
          test "${files[2]}" = "src/services/vacancyDashboardSearchExpansion.js"
          test "${files[3]}" = "src/views/list.ejs"
          test "${files[4]}" = "test/vacancyDashboardSearchExpansion.test.js"

      - name: Push refined correction
        run: git push origin HEAD:fix/944-vacancy-registration-order-date-filter
