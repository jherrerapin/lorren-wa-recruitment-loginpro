name: Apply supervisor message repository migration

on:
  push:
    branches:
      - refactor/441-supervisor-message-repository

permissions:
  contents: write

concurrency:
  group: apply-supervisor-message-repository
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/441-supervisor-message-repository
          fetch-depth: 0

      - name: Apply exact supervisor migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/adminSupervisor.js')
          source = path.read_text()
          import_anchor = "import { storeCandidateCv } from './cvStorage.js';\n"
          import_line = "import { persistOutboundConversationMessage } from './conversationMessageRepository.js';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor missing')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old = """async function saveSupervisorOutbound(prisma, candidateId, body, rawPayload = {}) {
            if (!prisma?.message?.create || !candidateId) return null;
            return prisma.message.create({
              data: {
                candidateId,
                direction: MessageDirection.OUTBOUND,
                messageType: MessageType.TEXT,
                body,
                rawPayload: {
                  ...rawPayload,
                  target: 'admin_supervisor',
                  visibility: 'internal',
                  neverSendToCandidate: true,
                  language: 'es-CO',
                  supervisorPhone: getSupervisorPhone(),
                  body
                }
              }
            });
          }
          """
          new = """async function saveSupervisorOutbound(prisma, candidateId, body, rawPayload = {}) {
            if (!prisma?.message?.create || !candidateId) return null;
            const result = await persistOutboundConversationMessage(prisma, {
              candidateId,
              messageType: MessageType.TEXT,
              body,
              rawPayload: {
                ...rawPayload,
                target: 'admin_supervisor',
                visibility: 'internal',
                neverSendToCandidate: true,
                language: 'es-CO',
                supervisorPhone: getSupervisorPhone(),
                body
              }
            });
            return result.message;
          }
          """

          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('saveSupervisorOutbound anchor missing')
          path.write_text(source)
          PY

      - name: Commit migration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/adminSupervisor.js
          git commit -m "refactor: delegar mensajes del supervisor en repositorio compartido"
          git push origin HEAD:refactor/441-supervisor-message-repository
