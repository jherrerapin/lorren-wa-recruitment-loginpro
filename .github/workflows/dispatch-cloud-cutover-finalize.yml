name: Dispatch Cloud API final structural cleanup

on:
  push:
    branches:
      - feat/1027-dispatch-whatsapp-cloud-api
    paths:
      - .github/workflows/dispatch-cloud-cutover-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: feat/1027-dispatch-whatsapp-cloud-api

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Apply structural cleanup
        run: python scripts/dispatch-cloud-cutover-finalize.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate structural cutover
        shell: bash
        run: |
          node --check src/routes/dispatchOpsExtras.js
          node --check src/routes/dispatchAssignmentConfirmations.js
          node --check src/services/dispatchAuditMiddleware.js
          node --check src/services/dispatchWhatsappWebhookService.js
          node --test test/dispatchWhatsappCloudCutover.test.js test/dispatchWhatsappRuntimeContracts.test.js

      - name: Commit structural cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dispatchOpsExtras.js src/routes/dispatchAssignmentConfirmations.js src/services/dispatchAuditMiddleware.js src/services/dispatchWhatsappWebhookService.js src/views/operacionesAsignacionesConfirmacion.ejs test/dispatchWhatsappCloudCutover.test.js
          git commit -m "refactor(dispatch): make Cloud API the confirmation authority"
          git push origin HEAD:feat/1027-dispatch-whatsapp-cloud-api
