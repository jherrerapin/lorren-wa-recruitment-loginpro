name: Dispatch Cloud API final selector cleanup

on:
  push:
    branches:
      - feat/1027-dispatch-whatsapp-cloud-api
    paths:
      - .github/workflows/dispatch-cloud-cutover-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: feat/1027-dispatch-whatsapp-cloud-api

      - name: Apply final selector cleanup
        run: python scripts/dispatch-cloud-cutover-finalize.py

      - name: Validate final route source
        shell: bash
        run: |
          node --check src/routes/dispatchAssignmentConfirmations.js
          ! grep -q 'assignment-message' src/routes/dispatchAssignmentConfirmations.js
          ! grep -Fq '${FINAL_ASSIGNMENT_CARD_SELECTOR} ${FINAL_ASSIGNMENT_CARD_SELECTOR}' src/routes/dispatchAssignmentConfirmations.js

      - name: Commit final source cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dispatchAssignmentConfirmations.js
          git commit -m "fix(dispatch): clean confirmed assignment selector after cutover"
          git push origin HEAD:feat/1027-dispatch-whatsapp-cloud-api
