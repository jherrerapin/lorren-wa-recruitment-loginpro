name: Apply 1561 experience fix

on:
  push:
    branches:
      - fix/1561-experiencia-multiproposito-una-linea
    paths:
      - .github/workflows/apply-1561-experience-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply semantic fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          candidate_path = Path('src/services/candidateData.js')
          candidate = candidate_path.read_text()
          helper_anchor = "function detectExperienceSummary(text = '') {"
          helpers = r'''function hasMultipurposeProfileEvidenceBeforeExperience(value = '') {
            const compact = normalizeLooseText(value);
            if (!compact) return false;
            return /\b(?:cc|cedula|documento|ppt|edad|localidad|barrio|residencia|municipio|restriccion|transporte)\b/.test(compact)
              || /\b\d{5,12}\b/.test(compact);
          }

          function stripGenericExperienceMetadata(value = '') {
            return cleanExperienceStatement(value)
              .replace(/^[\s:;,.\-]+/, '')
              .replace(/^(?:de\s+)?(?:(?:m[aá]s\s+de|aproximadamente)\s+)?(?:\d+|un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s*(?:mes(?:es)?|a[nñ]os?|semanas?)\b[\s:;,.\-]*/i, '')
              .replace(/^(?:en|como|de|sobre|realizando|haciendo)\s+/i, '')
              .replace(/^[\s:;,.\-]+/, '')
              .trim();
          }

          function focusExperienceSummaryStatement(statement = '') {
            const raw = cleanExperienceStatement(statement);
            if (!raw) return null;

            const anchor = /\bexperiencia(?:\s+laboral)?\b/i.exec(raw);
            if (!anchor) return raw;

            const prefix = raw.slice(0, anchor.index);
            const suffix = raw.slice(anchor.index + anchor[0].length);
            const detail = stripGenericExperienceMetadata(suffix);

            if (!detail) return null;
            if (hasMultipurposeProfileEvidenceBeforeExperience(prefix)) return detail;
            return raw;
          }

          '''
          if 'function focusExperienceSummaryStatement' not in candidate:
            if helper_anchor not in candidate:
              raise SystemExit('candidate helper anchor not found')
            candidate = candidate.replace(helper_anchor, helpers + helper_anchor, 1)

          old_line = '    if (isSafeExperienceStatement(statement)) summaries.push(statement);'
          new_lines = '''    const focusedStatement = focusExperienceSummaryStatement(statement);\n    const focusedWasIsolated = Boolean(focusedStatement && focusedStatement !== cleanExperienceStatement(statement));\n    if (focusedStatement && isSafeExperienceStatement(focusedStatement, { requireSummaryCue: !focusedWasIsolated })) {\n      summaries.push(focusedStatement);\n    }'''
          if old_line in candidate:
            candidate = candidate.replace(old_line, new_lines, 1)
          elif new_lines not in candidate:
            raise SystemExit('candidate summary decision not found')
          candidate_path.write_text(candidate)

          sanitizer_path = Path('src/services/fieldSanitizer.js')
          sanitizer = sanitizer_path.read_text()
          context_anchor = '''function hasGroundedExperienceSummaryContext(text = '', context = {}, turnType = null) {\n  if (hasExplicitPositiveExperienceEvidence(text)) return true;\n  if (looksLikeQuestionText(text, turnType)) return false;\n  return fieldWasPending('experienceSummary', context) && hasExperienceEvidence(text);\n}\n'''
          sanitizer_helpers = r'''
          function experienceSummaryProfileEvidenceScore(value = '') {
            const normalized = normalizeText(value);
            if (!normalized) return 0;

            let score = 0;
            if (/\b(?:cc|cedula|cedula de ciudadania|documento|ppt)\b[^.]{0,80}\b\d{5,12}\b/.test(normalized)) score += 2;
            if (/\bedad\s*(?:es|de)?\s*\d{1,2}\b/.test(normalized)) score += 1;
            if (/\b(?:localidad|barrio|residencia|municipio)\b(?:\s+de)?\s+[a-z]/.test(normalized)) score += 1;
            if (/\b(?:medio de transporte|transporte publico|me movilizo|me transporto)\b/.test(normalized)) score += 1;
            if (/\brestricciones?\s+medicas?\b/.test(normalized)) score += 1;
            return score;
          }

          function hasMeaningfulExperienceSummaryDetail(value = '') {
            const normalized = normalizeText(value);
            if (!normalized) return false;

            const detail = normalized
              .replace(/\b(?:si|sii|sip|claro|afirmativo)\b/g, ' ')
              .replace(/\b(?:tengo|cuento con|poseo|acredito|he adquirido)\b/g, ' ')
              .replace(/\bexperiencia(?: laboral)?\b/g, ' ')
              .replace(/\b(?:mas de|aproximadamente)?\s*(?:\d+|un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s*(?:mes(?:es)?|anos?|semanas?)\b/g, ' ')
              .replace(/\b(?:en|de|del|la|el|los|las|un|una|y|o|como|laboral)\b/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            return detail.length >= 5 && /[a-z]/.test(detail);
          }
          '''
          if 'function experienceSummaryProfileEvidenceScore' not in sanitizer:
            if context_anchor not in sanitizer:
              raise SystemExit('sanitizer context anchor not found')
            sanitizer = sanitizer.replace(context_anchor, context_anchor + sanitizer_helpers, 1)

          validation_anchor = '''  if (!hasGroundedExperienceSummaryContext(text, context, turnType)) {\n    return { ok: false, reason: 'missing_experience_summary_context' };\n  }\n'''
          validation_checks = '''  if (!hasMeaningfulExperienceSummaryDetail(raw)) {\n    return { ok: false, reason: 'experience_summary_without_work_detail' };\n  }\n  if (experienceSummaryProfileEvidenceScore(raw) >= 2) {\n    return { ok: false, reason: 'experience_summary_contains_profile_fields' };\n  }\n'''
          if validation_checks not in sanitizer:
            if validation_anchor not in sanitizer:
              raise SystemExit('sanitizer validation anchor not found')
            sanitizer = sanitizer.replace(validation_anchor, validation_anchor + validation_checks, 1)
          sanitizer_path.write_text(sanitizer)
          PY
      - run: npm ci
      - name: Validate focused regressions
        run: >-
          node --test
          test/contextualExperienceMultipurposeRegression.test.js
          test/experiencePersistencePipeline.test.js
          test/conversationUnderstanding.test.js
      - name: Validate syntax
        run: node --check src/services/candidateData.js && node --check src/services/fieldSanitizer.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "jherrerapin"
          git config user.email "37624185+jherrerapin@users.noreply.github.com"
          git add src/services/candidateData.js src/services/fieldSanitizer.js
          git commit -m "fix(bot): aislar experiencia multipropósito #1561"
          git push
