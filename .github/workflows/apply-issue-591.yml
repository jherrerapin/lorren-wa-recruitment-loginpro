name: Apply issue 591 test worker exclusion

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/591-exclude-test-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/591-exclude-test-worker
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact correction
        run: python3 .github/scripts/apply-issue-591.py

      - name: Remove temporary application files
        run: rm -f .github/issue-591-trigger .github/scripts/apply-issue-591.py .github/workflows/apply-issue-591.yml issue-591-test-diagnostic.txt

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma and syntax
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/dispatchOperationalCoverage.js
          node --check src/services/dispatchAutoAssignment.js
          node --check src/routes/dispatchOpsExtras.js
          node --check src/services/dispatchWhatsappWebServiceV6.js
          node --check src/services/dispatchWorkerDeactivationAnalytics.js
          node --check src/services/dispatchWorkerToggleAnySource.js
          node --check src/services/dispatchWorkerExitReasons.js
          node --check src/services/dispatchProgrammingPdfService.js
          node --check src/routes/dispatchDashboardMetrics.js
          node --check test/dispatchTestWorkerExclusion.test.js

      - name: Run focused regressions
        shell: bash
        run: |
          set +e
          diagnostic="$(mktemp)"
          {
            node --test test/dispatchTestWorkerExclusion.test.js
            node --test test/dispatchWorkerContractAutoAssignment.test.js
            node --test test/dispatchProgrammingPartialSend.test.js
            node --test test/dispatchWhatsappRuntimeContracts.test.js
          } >"$diagnostic" 2>&1
          status=$?
          cat "$diagnostic"
          if [ "$status" -ne 0 ]; then
            git restore .
            cp "$diagnostic" issue-591-test-diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue-591-test-diagnostic.txt
            git commit -m "chore: registrar diagnóstico de pruebas #591 [skip ci]"
            git push origin HEAD:fix/591-exclude-test-worker
            exit "$status"
          fi

      - name: Commit canonical correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: excluir perfil de pruebas de cobertura operativa (#591)"
          git push origin HEAD:fix/591-exclude-test-worker
