name: Validate canonical harness expectations

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-characterize:
    if: github.head_ref == 'fix/615-repair-merged-harness-alignment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact fixture alignment
        run: node scripts/apply-615-align-harness-contracts.mjs

      - name: Validate canonical fixture contract
        run: |
          node --check test/fixtures/conversationCases.js
          node --check test/conversationHarnessCanonicalExpectations.test.js
          node --test test/conversationHarnessCanonicalExpectations.test.js

      - name: Validate transport normalization contract
        run: node --test test/dispatchTransportNormalization.test.js

      - name: Validate candidate parser contract
        run: node --test test/candidateData.test.js

      - name: Commit aligned fixtures
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test/fixtures/conversationCases.js
            git commit -m "test: alinear expectativas canónicas del harness"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Characterize harness after fixture alignment
        run: |
          mkdir -p diagnostics
          set +e
          node --test test/conversation-harness.test.js > diagnostics/615-harness.tap 2>&1
          status=$?
          set -e
          grep -E '^    not ok [0-9]+ - ' diagnostics/615-harness.tap | sed 's/^    //' > diagnostics/615-remaining-failures.txt || true
          count=$(wc -l < diagnostics/615-remaining-failures.txt | tr -d ' ')
          printf 'status=%s\nremaining_failures=%s\nprevious_failures=22\n' "$status" "$count" > diagnostics/615-harness-summary.txt
          for id in greeting-not-name city-with-multiple-vacancies-asks-which-one city-only-does-not-auto-assign-even-with-single-active-city-vacancy bus-and-independent-recognized; do
            if grep -q "$id" diagnostics/615-remaining-failures.txt; then
              echo "Scenario $id still fails after canonical expectation alignment."
              exit 1
            fi
          done
          if [ "$count" -gt 18 ]; then
            echo "Canonical expectation alignment did not reduce the corpus as expected."
            exit 1
          fi

      - name: Commit harness characterization
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/615-harness.tap diagnostics/615-remaining-failures.txt diagnostics/615-harness-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: caracterizar harness después de #615"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Run conversation replays
        run: |
          node --test test/conversationReplayFixtures.test.js test/conversationReplayInterpretation.test.js test/conversationReplayPlanning.test.js test/conversationReplayIntegral.test.js test/conversationReplayRecovery.test.js
