name: tmp-professional-vacancy-presentation
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Apply vacancy presentation and flow fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, value): Path(path).write_text(value, encoding='utf-8')
          def once(text, old, new, label):
              count = text.count(old)
              if count != 1: raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          p='src/services/vacancyPublicInfo.js'; t=read(p)
          t=t.replace('la edad configurada es','la edad requerida es')
          t=t.replace('el rango de edad configurado es de','el rango de edad es de')
          t=t.replace('la edad mínima configurada es','la edad mínima es')
          t=t.replace('la edad máxima configurada es','la edad máxima es')
          if 'export function buildProfessionalVacancyPresentation' not in t:
              t += r'''

function publicVacancyCity(vacancy = {}) {
  return vacancy?.operation?.city?.name || vacancy?.city || '';
}

function publicVacancyTitle(vacancy = {}) {
  return String(vacancy?.title || vacancy?.role || 'Vacante disponible').trim();
}

function bulletLine(value = '') {
  const cleaned = cleanConfiguredFragment(value);
  return cleaned ? `• ${cleaned}` : '';
}

export function buildProfessionalVacancyPresentation(vacancy = {}, { includeInterestPrompt = false } = {}) {
  const title = publicVacancyTitle(vacancy);
  const city = publicVacancyCity(vacancy);
  const roleDescription = cleanConfiguredFragment(vacancy?.roleDescription);
  const requirements = cleanConfiguredFragment(vacancy?.requirements);
  const conditions = cleanConfiguredFragment(vacancy?.conditions);
  const address = cleanConfiguredFragment(vacancy?.operationAddress);
  const documents = cleanConfiguredFragment(vacancy?.requiredDocuments);
  const publicRequirements = getConfiguredPublicRequirementSentences(vacancy, requirements)
    .map((value) => cleanConfiguredFragment(value))
    .filter(Boolean);

  const blocks = [`*Vacante: ${title}*`];
  if (city) blocks.push(`*Ciudad:* ${city}`);
  if (roleDescription) blocks.push(`*Funciones del cargo*\n${roleDescription}`);
  const requirementLines = [requirements, ...publicRequirements].map(bulletLine).filter(Boolean);
  if (requirementLines.length) blocks.push(`*Requisitos*\n${requirementLines.join('\n')}`);
  if (conditions) blocks.push(`*Condiciones*\n${conditions}`);
  if (address) blocks.push(`*Lugar de trabajo*\n${address}`);
  if (documents) blocks.push(`*Documentos para el proceso*\n${documents}`);
  if (blocks.length <= (city ? 2 : 1)) blocks.push('La vacante está activa para recibir postulaciones.');

  const parts = ['Te comparto la información de la vacante:', blocks.join('\n\n')];
  if (includeInterestPrompt) parts.push('Si deseas continuar con la postulación, confírmame y avanzamos.');
  return parts.join('\n\n');
}
'''
