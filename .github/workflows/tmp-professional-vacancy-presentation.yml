'''+t[end:]
          start=t.index("function buildVacancyInformationAnswer(vacancy = null, inboundText = '') {"); end=t.index('\nfunction buildInactiveVacancyReply',start)
          t=t[:start]+r'''function buildVacancyInformationAnswer(vacancy = null, inboundText = '') {
  if (!vacancy) return '';
  const turn = analyzeConversationTurn(inboundText);
  if (!turn.vacancyInformationRequest && !turn.question) return '';
  const normalized = normalizeResolverText(inboundText);
  const title = vacancyTitle(vacancy);
  const city = vacancyCity(vacancy);
  const location = city ? ` en ${city}` : '';
  const roleDescription = cleanConfiguredFragment(vacancy?.roleDescription);
  const requirements = cleanConfiguredFragment(vacancy?.requirements);
  const conditions = cleanConfiguredFragment(vacancy?.conditions);
  const address = cleanConfiguredFragment(vacancy?.operationAddress);
  const documents = cleanConfiguredFragment(vacancy?.requiredDocuments);

  if (/\b(empresa|compania|cliente|quien contrata|para que empresa|operacion)\b/.test(normalized)) {
    const operationName = String(vacancy?.operation?.name || '').trim();
    return operationName
      ? `El proceso de selección es gestionado por LoginPro Service. La operación asociada a esta vacante es ${operationName}.`
      : 'El proceso de selección es gestionado por LoginPro Service.';
  }
  if (/\b(funcion|funciones|labor|labores|hace|hacer|haria|toca|consiste|responsabilidad|responsabilidades)\b/.test(normalized)) {
    return roleDescription
      ? `Para la vacante de ${title}${location}, las funciones del cargo son: ${roleDescription}.`
      : `La información disponible de la vacante de ${title}${location} no incluye una descripción adicional de funciones.`;
  }
  if (/\b(edad|rango de edad)\b/.test(normalized)) {
    const ageRequirement = getConfiguredAgeRequirementText(vacancy);
    return ageRequirement
      ? `Para la vacante de ${title}${location}, ${ageRequirement}.`
      : `La información disponible de la vacante de ${title}${location} no especifica un rango de edad.`;
  }
  if (/\b(experiencia|tiempo de experiencia)\b/.test(normalized)) {
    const experienceRequirement = getConfiguredExperienceRequirementText(vacancy);
    if (experienceRequirement) return `Para la vacante de ${title}${location}, ${experienceRequirement}.`;
    return requirements && /\bexperiencia\b/i.test(requirements)
      ? `Para la vacante de ${title}${location}, los requisitos son: ${requirements}.`
      : `La información disponible de la vacante de ${title}${location} no especifica un requisito adicional de experiencia.`;
  }
  if (/\b(requisito|requisitos|perfil|estudio|formacion|moto|carro|transporte|vehiculo)\b/.test(normalized)) {
    return requirements
      ? `Para la vacante de ${title}${location}, los requisitos son: ${requirements}.`
      : `La información disponible de la vacante de ${title}${location} no incluye requisitos adicionales.`;
  }
  if (/\b(documento|documentos|papeles)\b/.test(normalized)) {
    return documents
      ? `Para el proceso de ${title}${location}, los documentos requeridos son: ${documents}.`
      : `La información disponible de la vacante de ${title}${location} no especifica documentos adicionales.`;
  }
  if (/\b(salario|sueldo|pago|horario|turno|beneficio|beneficios|condiciones|contrato|prestaciones)\b/.test(normalized)) {
    return conditions
      ? `Para la vacante de ${title}${location}, las condiciones son: ${conditions}.`
      : `La información disponible de la vacante de ${title}${location} no especifica ese detalle.`;
  }
  if (/\b(ubicacion|direccion|zona|sector|donde|queda)\b/.test(normalized)) {
    return address
      ? `El lugar de trabajo para la vacante de ${title}${location} es: ${address}.`
      : `La información disponible de la vacante de ${title}${location} no incluye una ubicación más específica.`;
  }
  return buildVacancyOverview(vacancy);
}
'''+t[end:]
