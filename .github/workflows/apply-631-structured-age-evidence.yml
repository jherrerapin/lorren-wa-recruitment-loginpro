name: Validate structured age evidence

# Pausado temporalmente para controlar el consumo mensual de GitHub Actions.
# Se conserva la ejecución manual desde la pestaña Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-characterize:
    if: github.head_ref == 'fix/631-structured-age-evidence'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact structured age patch
        run: node scripts/apply-631-structured-age-evidence.mjs

      - name: Validate syntax
        run: |
          node --check src/services/ageEvidence.js
          node --check src/services/candidateData.js
          node --check src/routes/webhook.js
          node --check test/structuredAgeEvidence.test.js
          node --check test/structuredAgeHarnessIntegration.test.js

      - name: Run focused structured age regressions
        run: node --test test/structuredAgeEvidence.test.js

      - name: Validate Ibagué age 24 integration
        run: node --test --test-name-pattern="ibague-flow-name-correction" test/structuredAgeHarnessIntegration.test.js

      - name: Validate Ibagué age 30 integration
        run: node --test --test-name-pattern="ibague-role-phrase" test/structuredAgeHarnessIntegration.test.js

      - name: Validate future birthday integration
        run: node --test --test-name-pattern="future-birthday" test/structuredAgeHarnessIntegration.test.js

      - name: Run existing age and parser regressions
        run: node --test test/candidateAgeEvidence.test.js test/candidateAgeHarnessIntegration.test.js test/candidateData.test.js test/fieldSanitizer.test.js

      - name: Run conversation understanding regressions
        run: node --test test/conversationUnderstanding.test.js test/conversationNormalizationCharacterization.test.js

      - name: Commit generated runtime patch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/services/ageEvidence.js src/services/candidateData.js src/routes/webhook.js
            git commit -m "fix: aceptar edad estructurada y cumpleaños futuro"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Characterize harness after structured age repair
        run: |
          mkdir -p diagnostics
          set +e
          node --test test/conversation-harness.test.js > diagnostics/631-harness.tap 2>&1
          status=$?
          set -e
          grep -E '^    not ok [0-9]+ - ' diagnostics/631-harness.tap | sed 's/^    //' > diagnostics/631-remaining-failures.txt || true
          count=$(wc -l < diagnostics/631-remaining-failures.txt | tr -d ' ')
          printf 'status=%s\nremaining_failures=%s\nprevious_failures=16\n' "$status" "$count" > diagnostics/631-harness-summary.txt
          if [ "$count" -gt 16 ]; then
            echo "Structured age repair introduced additional harness failures."
            exit 1
          fi

      - name: Upload harness diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-age-harness
          path: |
            diagnostics/631-harness.tap
            diagnostics/631-remaining-failures.txt
            diagnostics/631-harness-summary.txt
          if-no-files-found: error

      - name: Run conversation replays
        run: |
          node --test test/conversationReplayFixtures.test.js test/conversationReplayInterpretation.test.js test/conversationReplayPlanning.test.js test/conversationReplayIntegral.test.js test/conversationReplayRecovery.test.js
