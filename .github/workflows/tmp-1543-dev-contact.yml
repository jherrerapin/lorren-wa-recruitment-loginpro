name: Temporary 1543 DEV contact

on:
  push:
    branches:
      - feat/1543-dev-share-user-contact
    paths:
      - .github/workflows/tmp-1543-dev-contact.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1543-dev-share-user-contact
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply DEV contact sharing and history trace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin_path = Path('src/routes/admin.js')
          admin = admin_path.read_text()

          helper_anchor = 'export function isInterviewCoordinationHandoffCandidate(candidate = {}) {'
          assert helper_anchor in admin
          helper = (
            "export function buildDevShareableUserContact(user = {}) {\n"
            "  const role = String(user?.role || '').trim().toUpperCase();\n"
            "  if (!user?.id || user?.isActive === false || role === 'DEV') return null;\n"
            "  const phone = normalizeCoordinatorContactPhone(user?.dispatchAlertPhone)\n"
            "    || normalizeCoordinatorContactPhone(user?.recoveryPhone);\n"
            "  if (!phone) return null;\n"
            "  return {\n"
            "    id: String(user.id),\n"
            "    label: appUserLabel(user),\n"
            "    displayPhone: phone.displayPhone\n"
            "  };\n"
            "}\n\n"
          )
          admin = admin.replace(helper_anchor, helper + helper_anchor, 1)

          outbound_window = (
            "    const outboundWindow = req.userRole === 'dev'\n"
            "      ? await getOutboundWindowStatus(prisma, candidate.id)\n"
            "      : null;\n"
          )
          assert outbound_window in admin
          contacts_query = outbound_window + (
            "    const shareableUserContacts = req.userRole === 'dev'\n"
            "      ? (await prisma.appUser.findMany({\n"
            "        where: { isActive: true, role: { not: 'DEV' } },\n"
            "        select: { id: true, username: true, displayName: true, email: true, role: true, isActive: true, dispatchAlertPhone: true, recoveryPhone: true },\n"
            "        orderBy: { username: 'asc' }\n"
            "      })).map(buildDevShareableUserContact).filter(Boolean)\n"
            "      : [];\n"
          )
          admin = admin.replace(outbound_window, contacts_query, 1)

          render_anchor = '      outboundWindow, cvSuccess, cvError,'
          assert render_anchor in admin
          admin = admin.replace(render_anchor, '      shareableUserContacts,\n      outboundWindow, cvSuccess, cvError,', 1)

          outbound_start = admin.index("router.post('/candidates/:id/outbound'")
          outbound_end = admin.index("router.post('/candidates/:id/request-hv'", outbound_start)
          outbound = admin[outbound_start:outbound_end]
          body_anchor = "    let body;\n    if (action === 'free_text') {"
          assert body_anchor in outbound
          share_logic = (
            "    let body;\n"
            "    let contactToShare = null;\n"
            "    if (action === 'share_user_contact') {\n"
            "      const contactUserId = normalizeString(req.body.contactUserId);\n"
            "      if (!contactUserId) {\n"
            "        return res.redirect(`/admin/candidates/${id}?outboundError=` + encodeURIComponent('Selecciona un usuario válido.'));\n"
            "      }\n"
            "      const contactUser = await prisma.appUser.findFirst({\n"
            "        where: { id: contactUserId, isActive: true, role: { not: 'DEV' } },\n"
            "        select: { id: true, username: true, displayName: true, email: true, role: true, isActive: true, dispatchAlertPhone: true, recoveryPhone: true }\n"
            "      });\n"
            "      contactToShare = buildDevShareableUserContact(contactUser);\n"
            "      if (!contactToShare) {\n"
            "        return res.redirect(`/admin/candidates/${id}?outboundError=` + encodeURIComponent('El usuario no está disponible o no tiene un WhatsApp válido.'));\n"
            "      }\n"
            "      body = `Puedes comunicarte con ${contactToShare.label} al WhatsApp ${contactToShare.displayPhone}.`;\n"
            "    } else if (action === 'free_text') {"
          )
          outbound = outbound.replace(body_anchor, share_logic, 1)
          old_payload = (
            "        source: 'admin_outbound',\n"
            "        action: action || 'free_text',\n"
            "        preserveExactBody: action === 'free_text'\n"
          )
          assert old_payload in outbound
          new_payload = (
            "        source: action === 'share_user_contact' ? 'admin_share_user_contact' : 'admin_outbound',\n"
            "        action: action || 'free_text',\n"
            "        sharedAppUserId: contactToShare?.id || null,\n"
            "        preserveExactBody: action === 'free_text' || action === 'share_user_contact'\n"
          )
          outbound = outbound.replace(old_payload, new_payload, 1)
          admin = admin[:outbound_start] + outbound + admin[outbound_end:]
          admin_path.write_text(admin)

          view_path = Path('src/views/detail.ejs')
          view = view_path.read_text()
          reminder_form = (
            "        <form method=\"post\" action=\"/admin/candidates/<%= candidate.id %>/outbound\" class=\"status-form\" style=\"flex-wrap: wrap;\">\n"
            "          <input type=\"hidden\" name=\"action\" value=\"reminder\" />\n"
            "          <button type=\"submit\">Enviar recordatorio</button>\n"
            "        </form>\n"
          )
          assert reminder_form in view
          contact_forms = reminder_form + (
            "        <% if (Array.isArray(shareableUserContacts) && shareableUserContacts.length) { %>\n"
            "          <div style=\"width:100%;font-size:12px;color:#475569;margin-top:6px;\">Enviar contacto de usuario:</div>\n"
            "          <% for (const contact of shareableUserContacts) { %>\n"
            "            <form method=\"post\" action=\"/admin/candidates/<%= candidate.id %>/outbound\" class=\"status-form\" style=\"flex-wrap: wrap;\">\n"
            "              <input type=\"hidden\" name=\"action\" value=\"share_user_contact\" />\n"
            "              <input type=\"hidden\" name=\"contactUserId\" value=\"<%= contact.id %>\" />\n"
            "              <button type=\"submit\" <%= outboundWindow && !outboundWindow.isOpen ? 'disabled title=\"Ventana de 24h cerrada\"' : '' %>>Enviar <%= contact.label %> · <%= contact.displayPhone %></button>\n"
            "            </form>\n"
            "          <% } %>\n"
            "        <% } %>\n"
          )
          view = view.replace(reminder_form, contact_forms, 1)

          old_history = (
            "        <% for (const m of sorted) { %>\n"
            "          <% const isBot = m.direction === 'OUTBOUND'; %>\n"
          )
          assert old_history in view
          new_history = (
            "        <% for (const m of sorted) { %>\n"
            "          <% const isBot = m.direction === 'OUTBOUND'; %>\n"
            "          <% const messageSource = String(m.rawPayload?.source || ''); %>\n"
            "          <% const outboundSender = messageSource === 'admin_interview_template'\n"
            "            ? 'Citación de entrevista'\n"
            "            : (messageSource === 'admin_share_user_contact' ? 'Contacto enviado por DEV' : 'Bot'); %>\n"
          )
          view = view.replace(old_history, new_history, 1)
          old_sender = "              <strong><%= isBot ? 'Bot' : 'Candidato' %></strong> &middot; <%= formatDateTimeCO(m.createdAt) %>"
          assert old_sender in view
          view = view.replace(old_sender, "              <strong><%= isBot ? outboundSender : 'Candidato' %></strong> &middot; <%= formatDateTimeCO(m.createdAt) %>", 1)
          view_path.write_text(view)

          test_path = Path('test/adminDevUserContactShare.test.js')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { buildDevShareableUserContact } from '../src/routes/admin.js';

          const adminSource = fs.readFileSync('src/routes/admin.js', 'utf8');
          const detailView = fs.readFileSync('src/views/detail.ejs', 'utf8');

          function between(content, start, end) {
            const startIndex = content.indexOf(start);
            assert.ok(startIndex >= 0, `No se encontró ${start}`);
            const endIndex = content.indexOf(end, startIndex + start.length);
            assert.ok(endIndex > startIndex, `No se encontró ${end}`);
            return content.slice(startIndex, endIndex);
          }

          test('DEV comparte solo usuarios no-DEV activos con teléfono persistido válido', () => {
            assert.deepEqual(buildDevShareableUserContact({
              id: 'user-coordinator-1', role: 'ADMIN', isActive: true,
              displayName: 'Coordinación Prueba', dispatchAlertPhone: '3001112233'
            }), {
              id: 'user-coordinator-1', label: 'Coordinación Prueba', displayPhone: '+57 300 111 2233'
            });
            assert.equal(buildDevShareableUserContact({
              id: 'user-dev-1', role: 'DEV', isActive: true,
              displayName: 'DEV Prueba', dispatchAlertPhone: '3001112233'
            }), null);
            assert.equal(buildDevShareableUserContact({
              id: 'user-inactive-1', role: 'ADMIN', isActive: false,
              displayName: 'Usuario Inactivo', dispatchAlertPhone: '3001112233'
            }), null);
            assert.equal(buildDevShareableUserContact({
              id: 'user-no-phone-1', role: 'ADMIN', isActive: true,
              displayName: 'Sin Teléfono', dispatchAlertPhone: '123'
            }), null);
            assert.equal(buildDevShareableUserContact({
              id: 'user-fallback-1', role: 'ADMIN', isActive: true,
              displayName: 'Coordinación Respaldo', recoveryPhone: '3004445566'
            })?.displayPhone, '+57 300 444 5566');
          });

          test('detalle DEV carga contactos por ID desde AppUser y nunca expone usuarios DEV', () => {
            const route = between(adminSource, "router.get('/candidates/:id'", "router.post('/candidates/:id/bot-pause'");
            assert.match(route, /prisma\.appUser\.findMany\(/);
            assert.match(route, /where:\s*\{\s*isActive:\s*true,\s*role:\s*\{\s*not:\s*'DEV'\s*\}\s*\}/);
            assert.match(route, /shareableUserContacts/);
          });

          test('envío de contacto resuelve AppUser en servidor y usa la entrega manual canónica', () => {
            const route = between(adminSource, "router.post('/candidates/:id/outbound'", "router.post('/candidates/:id/request-hv'");
            assert.match(route, /action === 'share_user_contact'/);
            assert.match(route, /normalizeString\(req\.body\.contactUserId\)/);
            assert.match(route, /prisma\.appUser\.findFirst\(/);
            assert.match(route, /role:\s*\{\s*not:\s*'DEV'\s*\}/);
            assert.doesNotMatch(route, /req\.body\.(?:phone|displayPhone|dispatchAlertPhone|recoveryPhone|contactName)/);
            assert.match(route, /sendAdminOutboundMessage\(prisma, candidate, body/);
            assert.match(route, /source:\s*action === 'share_user_contact' \? 'admin_share_user_contact'/);
            assert.match(route, /preserveExactBody:\s*action === 'free_text' \|\| action === 'share_user_contact'/);
          });

          test('DEV muestra un botón por contacto y el historial identifica citaciones y contactos enviados', () => {
            assert.match(detailView, /name=\"action\" value=\"share_user_contact\"/);
            assert.match(detailView, /name=\"contactUserId\" value=\"<%= contact\.id %>\"/);
            assert.match(detailView, /Enviar <%= contact\.label %> · <%= contact\.displayPhone %>/);
            assert.match(detailView, /admin_interview_template/);
            assert.match(detailView, /Citación de entrevista/);
            assert.match(detailView, /admin_share_user_contact/);
            assert.match(detailView, /Contacto enviado por DEV/);
            assert.doesNotMatch(detailView, /name=\"(?:phone|displayPhone|dispatchAlertPhone|recoveryPhone|contactName)\"/);
          });
          """.replace('          ', ''))
          PY
      - name: Run focal regressions
        run: node --test test/adminDevUserContactShare.test.js test/adminManualOutboundDeliveryAuthority.test.js
      - name: Check syntax
        run: |
          node --check src/routes/admin.js
          node --check test/adminDevUserContactShare.test.js
      - name: Commit focused change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.js src/views/detail.ejs test/adminDevUserContactShare.test.js
          git commit -m 'feat(dev): share registered user contacts from conversation'
          git push origin HEAD:feat/1543-dev-share-user-contact
