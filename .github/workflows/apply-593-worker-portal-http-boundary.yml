name: Diagnose worker portal HTTP boundary hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/593-worker-portal-http-boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Capture exact patch result
        run: node scripts/diagnose-593-worker-portal-http-boundary.mjs

      - name: Commit diagnostic
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/593-apply-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: capturar diagnóstico HTTP #593"
            git push origin "HEAD:${HEAD_REF}"
          fi
