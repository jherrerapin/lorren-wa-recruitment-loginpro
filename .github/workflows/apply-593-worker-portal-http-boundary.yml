name: Apply worker portal HTTP boundary hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/593-worker-portal-http-boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact hotfix
        run: node scripts/apply-593-worker-portal-http-boundary-v2.mjs

      - name: Validate syntax
        run: |
          node --check src/server.js
          node --check src/routes/workerPortal.js
          node --check src/services/workerPortalActivationAbuseGuard.js
          node --check test/workerPortalActivationRouter.test.js
          node --check test/workerPortalActivationAbuseGuard.test.js

      - name: Run focused portal regressions
        run: |
          node --test test/workerPortalActivationAbuseGuard.test.js
          node --test test/workerPortalActivationRouter.test.js
          node --test test/workerPortalSessionPolicy.test.js test/activateWorkerPortalSession.test.js test/prismaWorkerPortalSessionRepository.test.js

      - name: Run dispatch and server regressions
        run: |
          node --test test/dispatchWhatsappRuntimeContracts.test.js
          node --test test/dispatchClientsOperationsContracts.test.js

      - name: Run conversation replays
        run: |
          node --test test/conversationReplayFixtures.test.js test/conversationReplayInterpretation.test.js test/conversationReplayPlanning.test.js test/conversationReplayIntegral.test.js test/conversationReplayRecovery.test.js

      - name: Commit generated hotfix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js src/routes/workerPortal.js src/services/workerPortalActivationAbuseGuard.js test/workerPortalActivationRouter.test.js test/workerPortalActivationAbuseGuard.test.js docs/architecture/14_asistencia_operativa_activacion_http_portal.md
          git commit -m "fix: asegurar frontera HTTP del Portal del Auxiliar"
          git push origin "HEAD:${HEAD_REF}"
