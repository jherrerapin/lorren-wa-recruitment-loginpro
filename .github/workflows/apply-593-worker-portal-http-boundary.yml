name: Diagnose worker portal HTTP boundary hotfix

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    if: github.head_ref == 'fix/593-worker-portal-http-boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact hotfix
        run: node scripts/apply-593-worker-portal-http-boundary.mjs
