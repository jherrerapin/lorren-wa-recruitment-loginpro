name: Apply Candidate manual review pause authority push

on:
  push:
    branches:
      - refactor/551-candidate-manual-review-pause-authority

permissions:
  contents: write

concurrency:
  group: apply-manual-review-pause-push
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: refactor/551-candidate-manual-review-pause-authority
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/manual-review.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/manual-review.patch.gz.b64 | gzip -d > /tmp/manual-review.patch
          git apply /tmp/manual-review.patch

      - name: Check JavaScript syntax
        run: |
          node --check src/services/candidateStateService.js
          node --check src/routes/webhook.js
          node --check test/candidateManualReviewPauseStateService.test.js
          node --check test/webhookManualReviewPauseAuthority.test.js
          node --check test/candidateProgressAuthority.test.js

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate focused authority and regressions
        run: node --test test/candidateManualReviewPauseStateService.test.js test/webhookManualReviewPauseAuthority.test.js test/candidateProgressAuthority.test.js test/candidateExplicitPauseStateService.test.js test/conversationEngineGuardRails.test.js test/turnOrchestratorContracts.test.js test/conversationReplayRecovery.test.js test/conversationReplayConsentAttachmentEdges.test.js

      - name: Validate formatting
        run: git diff --check

      - name: Publish clean validated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git read-tree origin/main
          git add src/services/candidateStateService.js src/routes/webhook.js config/candidate-progress-authority.json docs/architecture/candidate-state-transition-inventory.md test/candidateProgressAuthority.test.js test/candidateManualReviewPauseStateService.test.js test/webhookManualReviewPauseAuthority.test.js
          tree_sha=$(git write-tree)
          parent_sha=$(git rev-parse origin/main)
          commit_sha=$(printf '%s\n' 'refactor: centralizar pausa por revisión manual' | git commit-tree "$tree_sha" -p "$parent_sha")
          git push --force origin "$commit_sha:refs/heads/refactor/551-candidate-manual-review-pause-authority"
          echo "validated_commit=$commit_sha"
