name: Dispatch Cloud API cutover cleanup

on:
  push:
    branches:
      - feat/1027-dispatch-whatsapp-cloud-api
    paths:
      - .github/workflows/dispatch-cloud-cutover-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: feat/1027-dispatch-whatsapp-cloud-api

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Remove legacy dispatch UI and CI remnants
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          view_path = Path('src/views/operacionesAsignacionesConfirmacion.ejs')
          source = view_path.read_text(encoding='utf-8')
          original = source

          source = source.replace(
              '.assigned-card .assignment-message{grid-column:1 / -1;min-height:60px;font-size:12px;padding:7px}',
              ''
          )
          source = source.replace(
              '.template-card textarea,.assignment-message{width:100%;min-height:76px;border:1px solid var(--border);border-radius:10px;padding:9px;font:inherit;resize:vertical}',
              ''
          )
          source = source.replace(
              '.variable-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}',
              ''
          )
          source = source.replace(
              '.variable-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--navy);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;cursor:pointer}',
              ''
          )

          template_pattern = re.compile(
              r'<% if \(coverageComplete && !selectedRequestComplete\) \{ %><section class="template-card"><strong>Mensaje base para WhatsApp</strong>.*?</section><% \} %>',
              re.DOTALL
          )
          replacement = (
              '<% if (coverageComplete && !selectedRequestComplete) { %>'
              '<section class="template-card">'
              '<strong>WhatsApp oficial de despacho</strong>'
              '<p class="muted">El contenido se envía con la plantilla Utility aprobada en Meta y se completa automáticamente con los datos reales de cada asignación.</p>'
              '<div class="template-actions"><button type="button" class="btn btn-primary" id="sendAllWhatsapp">Enviar plantilla a todos</button></div>'
              '</section><% } %>'
          )
          source, template_count = template_pattern.subn(replacement, source, count=1)
          if template_count != 1:
              raise SystemExit('No se encontró exactamente un bloque editable de WhatsApp para reemplazar.')

          source = source.replace(
              '<% if (coverageComplete && !selectedRequestComplete && assignmentActive) { %><textarea class="assignment-message"></textarea><% } %>',
              ''
          )
          source = source.replace(
              'title="Enviar WhatsApp" aria-label="Enviar WhatsApp">WA</button>',
              'title="Enviar plantilla oficial de WhatsApp" aria-label="Enviar plantilla oficial de WhatsApp">WA</button>'
          )

          lines = source.splitlines()
          rewritten = []
          for line in lines:
              stripped = line.lstrip()
              indent = line[:len(line) - len(stripped)]
              if stripped.startswith('function sanitizeAssignmentTemplate('):
                  continue
              if stripped.startswith('function renderMessage('):
                  continue
              if stripped.startswith('async function sendDispatchWhatsapp('):
                  rewritten.append(indent + "async function sendDispatchWhatsapp(button){const phone=button.dataset.waPhone;const card=button.closest('.assigned-card');const context={assignmentId:card?.dataset.assignmentId||'',serviceRequestId:card?.dataset.serviceRequestId||qs('#selectedRequestSummary')?.dataset.serviceRequestId||'',workerId:card?.dataset.workerId||'',recipientName:card?.dataset.workerName||'',messageType:'DISPATCH_ASSIGNMENT_CONFIRMATION_REQUEST'};if(!phone){showToast('No hay número de WhatsApp para este auxiliar.');return;}if(!context.assignmentId||!context.serviceRequestId||!context.workerId){showToast('No se pudo identificar la asignación. Recarga el tablero e intenta nuevamente.');return;}button.disabled=true;const originalText=button.innerHTML;button.innerHTML='...';try{const response=await fetch('/admin/operaciones/whatsapp/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,context})});const data=await response.json();if(response.status===503){showToast(data.message||'WhatsApp oficial de despacho no está configurado.');return;}if(!response.ok||!data.ok)throw new Error(data.message||'No se pudo enviar la plantilla oficial.');showToast('Plantilla oficial enviada correctamente.');}catch(error){showToast(error.message||'Error enviando WhatsApp.');}finally{button.disabled=false;button.innerHTML=originalText;}}")
                  continue
              if stripped.startswith('function refreshLinks('):
                  rewritten.append(indent + "function refreshLinks(){qsa('.assigned-card').forEach((card)=>{const link=card.querySelector('.whatsapp-link');if(!link)return;link.dataset.waPhone=normalizePhone(card.dataset.workerPhone);link.onclick=function(){sendDispatchWhatsapp(link);};});}")
                  continue
              rewritten.append(line)
          source = '\n'.join(rewritten) + ('\n' if original.endswith('\n') else '')

          start_marker = "qsa('.variable-btn').forEach((button)=>button.addEventListener('click',()=>{"
          start = source.find(start_marker)
          if start >= 0:
              end_marker = "refreshLinks();}));"
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit('No se pudo cerrar el listener heredado de variables.')
              source = source[:start] + source[end + len(end_marker):]

          source = source.replace("qs('#globalTemplate')?.addEventListener('input',refreshLinks);", '')
          source = source.replace("qsa('.assignment-message').forEach((textarea)=>textarea.addEventListener('input',refreshLinks));", '')

          forbidden_view = [
              'id="globalTemplate"',
              'class="assignment-message"',
              'data.waMessage',
              'JSON.stringify({phone,message,context})',
              'function renderMessage(',
              'function sanitizeAssignmentTemplate('
          ]
          leftovers = [token for token in forbidden_view if token in source]
          if leftovers:
              raise SystemExit(f'Restos de mensaje libre en tablero: {leftovers}')
          if source == original:
              raise SystemExit('El tablero no cambió; limpieza no aplicada.')
          view_path.write_text(source, encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          ci = ci.replace('      DISPATCH_WWEB_AUTO_START: "false"\n', '')
          ci = ci.replace('      PUPPETEER_SKIP_DOWNLOAD: "true"\n', '')
          if 'DISPATCH_WWEB_' in ci or 'PUPPETEER_SKIP_DOWNLOAD' in ci:
              raise SystemExit('Quedaron variables de WhatsApp Web/Puppeteer en CI.')
          ci_path.write_text(ci, encoding='utf-8')
          PY

      - name: Regenerate npm lockfile without retired runtime
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify retired packages are absent from lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.['']?.dependencies || {};
          for (const name of ['whatsapp-web.js', 'qrcode', 'qrcode-terminal']) {
            if (root[name]) throw new Error(`${name} sigue declarado en el lockfile raíz.`);
            if (lock.packages?.[`node_modules/${name}`]) throw new Error(`${name} sigue presente en el lockfile.`);
          }
          for (const path of Object.keys(lock.packages || {})) {
            if (path === 'node_modules/puppeteer' || path === 'node_modules/puppeteer-core' || path === 'node_modules/@puppeteer/browsers') {
              throw new Error(`${path} sigue presente en el lockfile.`);
            }
          }
          NODE

      - name: Validate changed JavaScript contracts
        shell: bash
        run: |
          node --check src/routes/dispatchProgrammingNotifications.js
          node --check src/routes/dispatchWhatsappNotifications.js
          node --check src/routes/dispatchWhatsappWebhook.js
          node --check src/services/dispatchWhatsappCloudConfig.js
          node --check src/services/dispatchWhatsappCloudClient.js
          node --check src/services/dispatchWhatsappAssignmentService.js
          node --check src/services/dispatchWhatsappWebhookService.js
          grep -q 'WhatsApp oficial de despacho' src/views/operacionesAsignacionesConfirmacion.ejs
          ! grep -q 'Mensaje base para WhatsApp' src/views/operacionesAsignacionesConfirmacion.ejs
          ! grep -q 'assignment-message' src/views/operacionesAsignacionesConfirmacion.ejs
          ! grep -q 'DISPATCH_WWEB_' .github/workflows/ci.yml
          ! grep -q 'PUPPETEER_SKIP_DOWNLOAD' .github/workflows/ci.yml

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          rm .github/workflows/dispatch-cloud-cutover-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml src/views/operacionesAsignacionesConfirmacion.ejs .github/workflows/dispatch-cloud-cutover-cleanup.yml
          git commit -m "refactor(dispatch): complete WhatsApp Cloud API cutover cleanup"
          git push origin HEAD:feat/1027-dispatch-whatsapp-cloud-api
