name: Run biometric resume fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run embedded focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-biometric-resume-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(block, 'embedded-biometric-patch', 'exec'))

          integration_path = Path('test/workerBiometricIntegrationContracts.test.js')
          integration = integration_path.read_text(encoding='utf-8')
          old = "  assert.match(loader, /20260801-biometric-integrity-v2/);"
          new = "  assert.match(loader, /BIOMETRIC_ASSET_RELEASE\\s*=\\s*'20260803-worker-portal-runtime-v5'/);"
          if integration.count(old) != 1:
              raise SystemExit('Expected one stale biometric release assertion')
          integration_path.write_text(integration.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate focused change
        run: |
          node --check src/public/worker-biometric-mobile.js
          node --test \
            test/workerBiometricResumeContracts.test.js \
            test/workerBiometricMobileStabilityContracts.test.js \
            test/workerBiometricIntegrationContracts.test.js \
            test/workerPortalUiCacheContracts.test.js

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/apply-biometric-resume-fix.yml
          rm .github/workflows/run-biometric-resume-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/worker-biometric-mobile.js test/workerBiometricResumeContracts.test.js test/workerBiometricIntegrationContracts.test.js .github/workflows/apply-biometric-resume-fix.yml .github/workflows/run-biometric-resume-fix-pr.yml
          git commit -m "fix: reanudar biometría después de varias horas"
          git push origin HEAD:${{ github.head_ref }}
