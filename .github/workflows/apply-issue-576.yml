name: Apply issue 576 WhatsApp recovery

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/576-whatsapp-stuck-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/576-whatsapp-stuck-recovery
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact recovery corrections
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply-issue-576-v2.py > issue-576-application-diagnostic.txt 2>&1
          status=$?
          cat issue-576-application-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue-576-application-diagnostic.txt
            git commit -m "chore: registrar diagnóstico de aplicación #576" || true
            git push origin HEAD:fix/576-whatsapp-stuck-recovery
            exit "$status"
          fi
          rm -f issue-576-application-diagnostic.txt

      - name: Remove temporary files
        run: rm -f .github/issue-576-trigger .github/scripts/apply-issue-576.py .github/scripts/apply-issue-576-v2.py .github/workflows/apply-issue-576.yml issue-576-application-diagnostic.txt

      - name: Install locked dependencies
        run: npm ci

      - name: Validate syntax and focused regressions
        shell: bash
        run: |
          set +e
          {
            node --check src/routes/dispatchWaRouterV2.js &&
            node --check src/services/dispatchWhatsappWebService.js &&
            node --check src/services/dispatchWhatsappWebServiceV6.js &&
            node --check test/dispatchWhatsappRuntimeContracts.test.js &&
            node --test test/dispatchWhatsappRuntimeContracts.test.js
          } > issue-576-test-diagnostic.txt 2>&1
          status=$?
          cat issue-576-test-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add issue-576-test-diagnostic.txt
            git commit -m "chore: registrar diagnóstico de pruebas #576" || true
            git push origin HEAD:fix/576-whatsapp-stuck-recovery
            exit "$status"
          fi
          rm -f issue-576-test-diagnostic.txt

      - name: Commit canonical correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recuperar conexión WhatsApp atascada (#576)"
          git push origin HEAD:fix/576-whatsapp-stuck-recovery
