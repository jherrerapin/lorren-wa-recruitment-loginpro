name: Bootstrap reusable turn plan

on:
  push:
    branches: [refactor/681-reuse-turn-plan]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: activar aplicación de #681'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Reuse reviewed patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-681-reuse-turn-plan.yml').read_text()
          start = source.index("          node <<'NODE'\n") + len("          node <<'NODE'\n")
          end = source.index("\n          NODE", start)
          lines = source[start:end].splitlines()
          Path('/tmp/apply-681.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          node /tmp/apply-681.js

      - name: Validate focused plan reuse
        run: |
          node --check src/routes/webhook.js
          node --check src/services/chatEngine.js
          node --check test/conversationEngineStepAuthority.test.js
          USE_CONVERSATION_ENGINE=true node --test test/conversationUnderstanding.test.js test/conversationEngineStepAuthority.test.js
          USE_CONVERSATION_ENGINE=false node --test test/conversationUnderstanding.test.js test/conversationEngineStepAuthority.test.js

      - name: Commit three-file change
        run: |
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/routes/webhook.js src/services/chatEngine.js test/conversationEngineStepAuthority.test.js | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/webhook.js src/services/chatEngine.js test/conversationEngineStepAuthority.test.js
          git commit -m "refactor: reutilizar una decisión válida por turno (#681)"
          git push origin HEAD:${{ github.ref_name }}
