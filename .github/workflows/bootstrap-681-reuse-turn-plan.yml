name: Bootstrap reusable turn plan

on:
  push:
    branches: [refactor/681-reuse-turn-plan]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: activar aplicación de #681'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Reuse reviewed patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-681-reuse-turn-plan.yml').read_text()
          start = source.index("          node <<'NODE'\n") + len("          node <<'NODE'\n")
          end = source.index("\n          NODE", start)
          lines = source[start:end].splitlines()
          Path('/tmp/apply-681.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          node /tmp/apply-681.js

      - name: Extend compatibility signature to full engine context
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExactlyOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first === -1) throw new Error(`Missing ${label}.`);
            if (source.indexOf(before, first + before.length) !== -1) {
              throw new Error(`Found ${label} more than once.`);
            }
            return source.replace(before, after);
          }

          const webhookPath = 'src/routes/webhook.js';
          let webhook = fs.readFileSync(webhookPath, 'utf8');
          webhook = replaceExactlyOnce(
            webhook,
            `function buildEnginePlanContextKey(candidate = {}, vacancy = null, inboundText = '') {`,
            `function buildEnginePlanContextKey(candidate = {}, vacancy = null, inboundText = '', recentMessages = [], nextSlot = null) {`,
            'plan context key signature'
          );
          webhook = replaceExactlyOnce(
            webhook,
            `    inboundText: normalizeText(inboundText)\n`,
            `    recentMessages: (recentMessages || []).slice(-8).map((message) => ({\n      direction: message?.direction || null,\n      body: String(message?.body || ''),\n      source: message?.rawPayload?.source || null,\n      actor: message?.rawPayload?.actor || null,\n      createdAt: message?.createdAt?.toISOString?.() || String(message?.createdAt || '') || null\n    })),\n    nextSlot: nextSlot?.slot ? {\n      slotId: nextSlot.slot.id || null,\n      scheduledAt: nextSlot.date?.toISOString?.() || null,\n      formattedDate: nextSlot.formattedDate || null,\n      isAlternative: Boolean(nextSlot.isAlternative),\n      isConfirmedBooking: Boolean(nextSlot.isConfirmedBooking)\n    } : null,\n    inboundText: normalizeText(inboundText)\n`,
            'plan context payload'
          );
          const oldCall = `buildEnginePlanContextKey(candidate, vacancy, inboundText)`;
          const newCall = `buildEnginePlanContextKey(candidate, vacancy, inboundText, recentMessages, nextSlot)`;
          const callCount = webhook.split(oldCall).length - 1;
          if (callCount !== 2) throw new Error(`Expected two plan key calls; found ${callCount}.`);
          webhook = webhook.split(oldCall).join(newCall);
          if ((webhook.match(/recentMessages: \(recentMessages \|\| \[\]\)/g) || []).length !== 1) {
            throw new Error('Recent message fingerprint missing.');
          }
          if ((webhook.match(/nextSlot: nextSlot\?\.slot/g) || []).length !== 1) {
            throw new Error('Slot fingerprint missing.');
          }
          fs.writeFileSync(webhookPath, webhook);

          const testPath = 'test/conversationEngineStepAuthority.test.js';
          let testSource = fs.readFileSync(testPath, 'utf8');
          testSource = replaceExactlyOnce(
            testSource,
            `  assert.match(source, /options\\.enginePreview\\.contextKey === currentPlanContextKey/);\n`,
            `  assert.match(source, /options\\.enginePreview\\.contextKey === currentPlanContextKey/);\n  assert.match(source, /recentMessages: \\(recentMessages \\|\\| \\[\\]\\)\\.slice\\(-8\\)/);\n  assert.match(source, /nextSlot: nextSlot\\?\\.slot/);\n`,
            'context signature regression'
          );
          fs.writeFileSync(testPath, testSource);
          NODE

      - name: Validate focused plan reuse
        run: |
          node --check src/routes/webhook.js
          node --check src/services/chatEngine.js
          node --check test/conversationEngineStepAuthority.test.js
          USE_CONVERSATION_ENGINE=true node --test test/conversationUnderstanding.test.js test/conversationEngineStepAuthority.test.js
          USE_CONVERSATION_ENGINE=false node --test test/conversationUnderstanding.test.js test/conversationEngineStepAuthority.test.js

      - name: Commit three-file change
        run: |
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/routes/webhook.js src/services/chatEngine.js test/conversationEngineStepAuthority.test.js | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/webhook.js src/services/chatEngine.js test/conversationEngineStepAuthority.test.js
          git commit -m "refactor: reutilizar una decisión válida por turno (#681)"
          git push origin HEAD:${{ github.ref_name }}
