name: Diagnose manual outbound TAP 491

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 492 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: refactor/491-manual-outbound-delivery

      - name: Apply migration in runner
        run: python scripts/apply-manual-outbound-491.py

      - name: Instrument mock state in runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/adminManualOutbound.test.js')
          source = path.read_text()
          marker = "    const outbound = prisma.state.messages.find((message) => message.direction === 'OUTBOUND');"
          if marker not in source:
              raise SystemExit('diagnostic marker not found')
          source = source.replace(
              marker,
              "    console.error('DIAGNOSTIC_MESSAGES=' + JSON.stringify(prisma.state.messages, null, 2));\n" + marker,
              1
          )
          path.write_text(source)
          PY

      - name: Install and generate
        shell: bash
        run: |
          npm ci --silent
          npm run prisma:generate --silent

      - name: Capture historical integration TAP
        id: test
        shell: bash
        run: |
          set +e
          node --test test/adminManualOutbound.test.js > admin-manual-outbound.tap 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic TAP
        uses: actions/upload-artifact@v4
        with:
          name: admin-manual-outbound-tap
          path: admin-manual-outbound.tap
          if-no-files-found: error
          retention-days: 3

      - name: Enforce historical integration result
        shell: bash
        run: |
          cat admin-manual-outbound.tap
          test "${{ steps.test.outputs.exit_code }}" = "0"
