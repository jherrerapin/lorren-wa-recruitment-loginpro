name: Apply dynamic assigned rest flow
on:
  push:
    branches:
      - fix/dispatch-rest-assignment-warning-20260810
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/dispatch-rest-assignment-warning-20260810
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused UI flow
        run: python scripts/tmp-apply-rest-warning.py
      - name: Validate focused rest flow
        run: node --test test/dispatchWorkerRestWarningUi.test.js test/dispatchWorkerRestAssignmentRegression.test.js test/dispatchWorkerRestBulkSundayRegression.test.js
      - name: Commit validated change
        run: |
          git rm .github/workflows/tmp-inspect-rest-flow.yml scripts/tmp-apply-rest-warning.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/operacionesAsignacionesConfirmacion.ejs test/dispatchWorkerRestWarningUi.test.js
          git commit -m "fix(dispatch): advertir asignación antes de dar descanso"
          git push origin HEAD:fix/dispatch-rest-assignment-warning-20260810