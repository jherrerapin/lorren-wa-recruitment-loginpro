name: Apply issue 873 complete candidate search

on:
  pull_request_target:
    branches:
      - automation/873-complete-candidate-search-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/873-complete-candidate-search' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Load exact correction from trusted base branch
        run: |
          git fetch origin automation/873-complete-candidate-search-runner
          git show origin/automation/873-complete-candidate-search-runner:.github/scripts/apply-issue-873.py > /tmp/apply-issue-873.py

      - name: Apply exact correction
        run: python3 /tmp/apply-issue-873.py

      - name: Validate focused behavior
        run: |
          node --check src/services/candidateDashboardSearch.js
          node --check src/routes/admin.js
          node --check test/candidateDashboardSearch.test.js
          node --test test/candidateDashboardSearch.test.js
          git diff --check

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.js src/views/list.ejs src/services/candidateDashboardSearch.js test/candidateDashboardSearch.test.js
          git commit -m "fix: buscar candidatos completos en toda la vacante (#873)"
          git push origin HEAD:fix/873-complete-candidate-search
