name: Refine issue 728 Excel worker review

on:
  pull_request:
    branches:
      - automation/728-excel-review-runner
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/728-excel-worker-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          ref: fix/728-excel-worker-review
          fetch-depth: 0
          persist-credentials: true

      - name: Load refinement
        run: |
          git fetch origin automation/728-excel-review-runner
          git show origin/automation/728-excel-review-runner:.github/scripts/refine-issue-728.py > /tmp/refine-issue-728.py

      - name: Apply refinement
        run: python3 /tmp/refine-issue-728.py

      - name: Remove functional trigger
        run: rm -f .github/issue-728-refine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate focused correction
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/dispatchWorkerExcelImport.js
          node --check src/routes/dispatchOpsExtras.js
          node --check test/dispatchWorkerExcelImport.test.js
          node --test test/dispatchWorkerExcelImport.test.js
          node --test test/dispatchWorkerContractAutoAssignment.test.js
          git diff --check

      - name: Commit refined correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reforzar aprobación de cambios Excel (#728)"
          git push origin HEAD:fix/728-excel-worker-review
