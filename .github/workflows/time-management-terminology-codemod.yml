name: One-shot time management terminology codemod

on:
  push:
    branches:
      - refactor/time-management-terminology

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
    steps:
      - name: Check out terminology branch
        uses: actions/checkout@v5
        with:
          ref: refactor/time-management-terminology
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository-wide terminology codemod
        run: node scripts/apply-time-management-terminology.mjs

      - name: Persist codemod workspace for inspection
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No terminology changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: apply Gestión de Tiempo terminology workspace"
          git push origin HEAD:refactor/time-management-terminology

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print0)

      - name: Validate repository-wide terminology
        run: node --test test/timeManagementPresentationTerminology.test.js

      - name: Run Gestión de Tiempo focal regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t focal < <(find test -maxdepth 1 -type f \( -name 'payroll*.test.js' -o -name 'dispatchDevPayroll*.test.js' -o -name 'testWorkspace*.test.js' \) | sort)
          node --test \
            test/adminModuleNavigation.test.js \
            test/adminResponsiveShellRegression.test.js \
            test/attendanceClearMarks.test.js \
            test/dispatchDisabledWorkerHistory.test.js \
            test/dispatchWorkerRestAssignmentRegression.test.js \
            test/liveSearchTypeaheadContracts.test.js \
            test/operationalAccessRoles.test.js \
            "${focal[@]}"
