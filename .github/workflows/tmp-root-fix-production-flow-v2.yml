name: tmp-root-fix-production-flow-v2
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  fix-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Apply root fix script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-root-fix-production-flow.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/root_fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/root_fix.py
      - name: Install and generate
        run: |
          npm ci
          npm run prisma:generate
      - name: Run focused root-contract tests
        run: |
          node --test test/activeVacancyQuestionIntake.test.js test/webhookMultiline.test.js test/leaderVacancyResolution.test.js test/vacancyCorrectionPriority.test.js test/vacancyBeforeConsentReplay.test.js test/conversation-harness.test.js test/productionConversationReplay.test.js test/webhookStatusAndBufferContract.test.js
      - name: Capture current full suite
        run: |
          set +e
          npm test > current.log 2>&1
          echo $? > current.exit
          set -e
      - uses: actions/checkout@v5
        with:
          ref: ed754a71254393ad9de57c4551a65b4fc731fbfd
          path: .baseline
          persist-credentials: false
      - name: Capture base full suite
        run: |
          cd .baseline
          npm ci
          npm run prisma:generate
          set +e
          npm test > "$GITHUB_WORKSPACE/base.log" 2>&1
          echo $? > "$GITHUB_WORKSPACE/base.exit"
          set -e
      - name: Require zero new full-suite failure identities
        run: |
          set -euo pipefail
          extract() {
            awk '
              function emit_pending() { if (pending != "" && !is_subtest_container) print pending; pending = ""; is_subtest_container = 0 }
              /^[[:space:]]*not ok [0-9]+ - / { emit_pending(); identity=$0; sub(/^[[:space:]]*not ok [0-9]+ - /, "", identity); sub(/[[:space:]]+#.*$/, "", identity); sub(/[[:space:]]+$/, "", identity); pending=identity; next }
              pending != "" && /^[[:space:]]*failureType:[[:space:]].*subtestsFailed/ { is_subtest_container=1; next }
              END { emit_pending() }
            ' "$1" | LC_ALL=C sort -u > "$2"
          }
          extract base.log base.failures
          extract current.log current.failures
          LC_ALL=C comm -23 current.failures base.failures > unexpected.failures
          echo "=== CURRENT SUMMARY ==="
          grep -E '^# (tests|pass|fail|cancelled|skipped) ' current.log | tail -n 5 || true
          echo "=== BASE SUMMARY ==="
          grep -E '^# (tests|pass|fail|cancelled|skipped) ' base.log | tail -n 5 || true
          echo "=== UNEXPECTED IDENTITIES ==="
          cat unexpected.failures || true
          if [ -s unexpected.failures ]; then
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              echo "--- $id ---"
              grep -F -B 8 -A 30 -- "$id" current.log | head -n 90 || true
            done < unexpected.failures
            exit 1
          fi
      - name: Commit validated root fix
        run: |
          git add src/routes/webhook.js src/services/vacancyFirstGate.js test/activeVacancyQuestionIntake.test.js test/fixtures/conversationCases.js test/webhookMultiline.test.js test/leaderVacancyResolution.test.js test/vacancyCorrectionPriority.test.js test/conversation-replay/vacancyConsentOrderReplay.js test/vacancyBeforeConsentReplay.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: cerrar consentimiento y seguridad del flujo de pauta"
          git push origin HEAD:fix/production-ad-flow-20260808
