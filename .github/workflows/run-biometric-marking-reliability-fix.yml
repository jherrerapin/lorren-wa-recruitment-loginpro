name: Run biometric marking reliability fix

on:
  push:
    branches:
      - fix/biometric-marking-reliability

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/biometric-marking-reliability
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-biometric-marking-reliability-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(block, 'embedded-biometric-reliability-patch', 'exec'))
          PY

      - name: Validate biometric and portal contracts
        shell: bash
        run: |
          node --check src/public/worker-biometric-mobile.js
          node --check src/public/worker-portal-biometric-flow.js
          node --check src/services/workerBiometricService.js
          node --check src/routes/workerPortal.js
          node --test test/worker*Biometric*.test.js test/workerPortalUiCacheContracts.test.js

      - name: Commit validated fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/apply-biometric-marking-reliability-fix.yml
          rm .github/workflows/run-biometric-marking-reliability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public/worker-biometric-mobile.js \
            src/public/worker-portal-biometric-flow.js \
            src/public/worker-biometric.js \
            src/public/worker-portal-sw.js \
            src/services/workerBiometricService.js \
            src/routes/workerPortal.js \
            test/workerBiometricIntegrationContracts.test.js \
            test/workerBiometricMarkingReliabilityContracts.test.js \
            test/workerPortalUiCacheContracts.test.js \
            .github/workflows/apply-biometric-marking-reliability-fix.yml \
            .github/workflows/run-biometric-marking-reliability-fix.yml
          git commit -m "fix: estabilizar marcación y reconocimiento facial"
          git push origin HEAD:fix/biometric-marking-reliability
