name: Contextual fallback gate

# Pausado temporalmente para controlar el consumo mensual de GitHub Actions.
# Se conserva la ejecución manual desde la pestaña Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextual-fallback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-contextual-fallbacks:
    name: Validate contextual fallbacks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and generate Prisma Client
        run: |
          npx prisma validate
          npm run prisma:generate

      - name: Check changed JavaScript syntax
        run: |
          node --check src/services/contextualReply.js
          node --check test/contextualReply.test.js
          node --check test/contextualReplyRobustness.test.js
          node --check test/contextualReplyLogging.test.js
          node --check test/hardeningP0.test.js
          node --check test/p9CvOnlyPdfDocx.test.js
          node --check test/replySimilarityPolicy.test.js
          node --check test/responsePolicyRemoval.test.js

      - name: Run contextual fallback regressions
        run: >-
          node --test
          test/contextualReply.test.js
          test/contextualReplyRobustness.test.js
          test/contextualReplyLogging.test.js
          test/hardeningP0.test.js
          test/p9CvOnlyPdfDocx.test.js
          test/replySimilarityPolicy.test.js
          test/responsePolicyRemoval.test.js
