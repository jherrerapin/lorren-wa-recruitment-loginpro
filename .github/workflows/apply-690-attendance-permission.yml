name: Apply attendance user permission

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/690-attendance-user-permission
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply focused implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runner = Path('.github/scripts/apply-690-attendance-permission.py')
          text = runner.read_text(encoding='utf-8')
          old_regex = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new_regex = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if text.count(old_regex) != 1:
              raise SystemExit('runner regex helper not found exactly once')
          text = text.replace(old_regex, new_regex, 1)

          old_guard = "    if count != 1:\n        raise RuntimeError(f'{path}: expected one literal match, found {count}')"
          new_guard = "    if count == 0 and text.count(new) == 1:\n        return\n    if count != 1:\n        raise RuntimeError(f'{path}: expected one literal match, found {count}')"
          if text.count(old_guard) != 1:
              raise SystemExit('runner literal helper guard not found exactly once')
          text = text.replace(old_guard, new_guard, 1)

          handled_blocks = [
              r"\nreplace_once\(\n    'src/server\.js',\n    '''      canAccessDispatch: true,.*?\n\)\n",
              r"\nreplace_once\(\n    'src/server\.js',\n    '''         canAccessDispatch: role === 'dev',.*?\n\)\n"
          ]
          for pattern in handled_blocks:
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'handled server block not found: {pattern}')
          runner.write_text(text, encoding='utf-8')

          server_path = Path('src/server.js')
          server = server_path.read_text(encoding='utf-8')
          server, auth_count = re.subn(
              r'(?m)^(\s*)canAccessDispatch:\s*true,\n\1canAccessMetaAds:\s*true,',
              lambda match: f"{match.group(1)}canAccessDispatch: true,\n{match.group(1)}canAccessAttendance: true,\n{match.group(1)}canAccessMetaAds: true,",
              server,
              count=1
          )
          if auth_count != 1:
              raise SystemExit(f'auth select permission insertion count: {auth_count}')
          server, env_count = re.subn(
              r"(?m)^(\s*)canAccessDispatch:\s*role === 'dev',\n\1canAccessMetaAds:\s*role === 'dev',",
              lambda match: f"{match.group(1)}canAccessDispatch: role === 'dev',\n{match.group(1)}canAccessAttendance: role === 'dev',\n{match.group(1)}canAccessMetaAds: role === 'dev',",
              server,
              count=1
          )
          if env_count != 1:
              raise SystemExit(f'env session permission insertion count: {env_count}')
          server_path.write_text(server, encoding='utf-8')
          PY
          set +e
          python .github/scripts/apply-690-attendance-permission.py > .github/apply-690-error.log 2>&1
          status=$?
          cat .github/apply-690-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/apply-690-error.log
            git commit -m "chore: capture attendance runner error [skip ci]"
            git push origin HEAD:feat/690-attendance-user-permission
            exit "$status"
          fi
          rm -f .github/apply-690-error.log

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check modified JavaScript syntax
        run: |
          node --check src/services/attendanceFeatureAccess.js
          node --check src/routes/dispatchBridge.js
          node --check src/routes/admin.js
          node --check src/routes/locations.js
          node --check src/server.js
          node --check src/services/dispatchAuditMiddleware.js

      - name: Run focused attendance permission tests
        run: |
          node --test test/attendanceFeatureAccess.test.js
          node --test test/attendanceFeatureGateContracts.test.js
          node --test test/attendanceUserPermissionContracts.test.js
          node --test test/attendanceAdminContracts.test.js

      - name: Run complete automated suite
        run: |
          set +e
          npm test > .github/apply-690-test-error.log 2>&1
          status=$?
          cat .github/apply-690-test-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/apply-690-test-error.log
            git commit -m "chore: capture attendance suite error [skip ci]"
            git push origin HEAD:feat/690-attendance-user-permission
            exit "$status"
          fi
          rm -f .github/apply-690-test-error.log

      - name: Remove temporary automation and commit
        run: |
          rm -f .github/scripts/apply-690-attendance-permission.py
          rm -f .github/workflows/apply-690-attendance-permission.yml
          rm -f .github/apply-690-error.log
          rm -f .github/apply-690-test-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add DEV-managed attendance permission"
          git push origin HEAD:feat/690-attendance-user-permission
