name: Apply attendance user permission

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/690-attendance-user-permission
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply focused implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-690-attendance-permission.py')
          text = path.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if text.count(old) != 1:
              raise SystemExit('runner regex helper not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          set +e
          python .github/scripts/apply-690-attendance-permission.py > .github/apply-690-error.log 2>&1
          status=$?
          cat .github/apply-690-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/apply-690-error.log
            git commit -m "chore: capture attendance runner error [skip ci]"
            git push origin HEAD:feat/690-attendance-user-permission
            exit "$status"
          fi
          rm -f .github/apply-690-error.log

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check modified JavaScript syntax
        run: |
          node --check src/services/attendanceFeatureAccess.js
          node --check src/routes/dispatchBridge.js
          node --check src/routes/admin.js
          node --check src/routes/locations.js
          node --check src/server.js
          node --check src/services/dispatchAuditMiddleware.js

      - name: Run focused attendance permission tests
        run: |
          node --test test/attendanceFeatureAccess.test.js
          node --test test/attendanceFeatureGateContracts.test.js
          node --test test/attendanceUserPermissionContracts.test.js
          node --test test/attendanceAdminContracts.test.js

      - name: Run complete automated suite
        run: npm test

      - name: Remove temporary automation and commit
        run: |
          rm -f .github/scripts/apply-690-attendance-permission.py
          rm -f .github/workflows/apply-690-attendance-permission.yml
          rm -f .github/apply-690-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add DEV-managed attendance permission"
          git push origin HEAD:feat/690-attendance-user-permission
