name: Apply Candidate reschedule progress authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.head_ref == 'refactor/562-candidate-reschedule-progress-authority'
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out slice branch
        uses: actions/checkout@v4
        with:
          ref: refactor/562-candidate-reschedule-progress-authority
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact slice
        run: python3 scripts/apply-562-candidate-reschedule-progress-authority.py

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate JavaScript syntax
        run: |
          node --check src/services/candidateStateService.js
          node --check src/services/chatEngine.js
          node --check test/candidateInterviewRescheduleProgressStateService.test.js
          node --check test/chatEngineInterviewBookingAuthority.test.js
          node --check test/candidateProgressAuthority.test.js

      - name: Validate focused authority and regressions
        run: |
          node --test \
            test/candidateInterviewRescheduleProgressStateService.test.js \
            test/chatEngineInterviewBookingAuthority.test.js \
            test/candidateProgressAuthority.test.js \
            test/interviewBookingReminderStateService.test.js \
            test/webhookInterviewBookingAuthority.test.js \
            test/conversationEngineGuardRails.test.js \
            test/turnOrchestratorContracts.test.js \
            test/conversationReplayRecovery.test.js \
            test/conversationReplayConsentAttachmentEdges.test.js

      - name: Publish clean functional commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: centralizar reflejo de reprogramación (#562)"
          git push origin HEAD:refactor/562-candidate-reschedule-progress-authority
