name: Issue 768 scheduling parity

on:
  pull_request:
    branches:
      - automation/768-scheduling-parity-validation

permissions:
  contents: read

jobs:
  diagnose-scheduling-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_test
      LORREN_SEND_DELAY_MS: 0
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run exact agenda diagnostics
        shell: bash
        run: |
          cases='["parity-interview-cancellation","parity-attendance-confirmation","parity-no-available-slots"]'
          node test/helpers/runConversationParityCases.js false "$cases" > /tmp/mode-false.log 2>&1
          node test/helpers/runConversationParityCases.js true "$cases" > /tmp/mode-true.log 2>&1
          grep '^__LORREN_PARITY__' /tmp/mode-false.log | tail -1 | sed 's/^__LORREN_PARITY__//' > /tmp/mode-false.json
          grep '^__LORREN_PARITY__' /tmp/mode-true.log | tail -1 | sed 's/^__LORREN_PARITY__//' > /tmp/mode-true.json
          node - <<'NODE'
          const fs = require('fs');
          const withoutEngine = JSON.parse(fs.readFileSync('/tmp/mode-false.json', 'utf8'));
          const withEngine = JSON.parse(fs.readFileSync('/tmp/mode-true.json', 'utf8'));
          const byId = (rows) => Object.fromEntries(rows.map((row) => [row.caseId, row]));
          const a = byId(withoutEngine);
          const b = byId(withEngine);
          const caseIds = Object.keys(a);
          const output = Object.fromEntries(caseIds.map((caseId) => [caseId, {
            withoutEngine: a[caseId],
            withEngine: b[caseId]
          }]));
          fs.writeFileSync('/tmp/issue-768-diagnostic.json', JSON.stringify(output, null, 2));
          NODE
          cat /tmp/issue-768-diagnostic.json

      - name: Upload normalized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: issue-768-scheduling-diagnostic
          path: /tmp/issue-768-diagnostic.json
          if-no-files-found: error
          retention-days: 1
