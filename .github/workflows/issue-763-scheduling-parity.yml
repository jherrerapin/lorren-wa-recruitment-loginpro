name: Issue 763 scheduling parity

on:
  pull_request:
    branches:
      - automation/763-isolated-scheduling-parity

permissions:
  contents: write

jobs:
  validate-scheduling-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_test
      LORREN_SEND_DELAY_MS: 0
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Capture exact base suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/base.log 2>&1
          base_exit=$?
          set -e
          grep '^not ok' /tmp/base.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/base.failures || true
          echo "BASE_EXIT=$base_exit" >> "$GITHUB_ENV"
          echo "Base failures: $(wc -l < /tmp/base.failures)"

      - name: Apply exact fixture patch
        run: node .github/scripts/apply-issue-763.mjs

      - name: Validate focused scheduling matrix
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            node --check test/fixtures/conversationParityCases.js
            node --check test/helpers/runConversationParityCases.js
            node --check test/conversationEngineParity.test.js
            node --test test/conversationEngineParity.test.js
          } > /tmp/issue-763-focused.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-763-focused.log
          exit "$status"

      - name: Upload focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-763-scheduling-parity-log
          path: /tmp/issue-763-focused.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after focused failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Compare full suite with exact base
        shell: bash
        run: |
          set +e
          npm test > /tmp/head.log 2>&1
          head_exit=$?
          set -e
          grep '^not ok' /tmp/head.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/head.failures || true
          if ! diff -u /tmp/base.failures /tmp/head.failures; then
            echo 'Los fixtures cambiaron la lista de fallos de la rama base.'
            exit 1
          fi
          if [ "$BASE_EXIT" = "0" ] && [ "$head_exit" != "0" ]; then
            exit 1
          fi

      - name: Validate clean diff
        run: git diff --check

      - name: Commit functional files only
        shell: bash
        run: |
          git add test/fixtures/conversationParityCases.js test/helpers/runConversationParityCases.js test/conversationEngineParity.test.js
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: aislar paridad de agenda #763'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
