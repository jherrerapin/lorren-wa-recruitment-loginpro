name: PR1405 Targeted Validation

on:
  push:
    branches:
      - fix/1403-entity-precedence-audit
  pull_request:
    branches:
      - main

jobs:
  targeted-conversation-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run targeted validation and capture output
        id: targeted
        shell: bash
        run: |
          set +e
          {
            echo '== syntax =='
            node --check src/services/conversationUnderstanding.js
            syntax_status=$?
            echo "syntax_status=$syntax_status"
            echo '== tests =='
            node --test \
              test/conversationUnderstanding.test.js \
              test/fieldSanitizer.test.js \
              test/candidateData.test.js \
              test/structuredAgeEvidence.test.js \
              test/candidateAgeEvidence.test.js \
              test/aiFirstRecruitmentGuards.test.js
            test_status=$?
            echo "test_status=$test_status"
            final_status=$(( syntax_status || test_status ))
            echo "final_status=$final_status"
            exit $final_status
          } 2>&1 | tee targeted-validation.log
          exit ${PIPESTATUS[0]}

      - name: Upload targeted validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1405-targeted-validation-log
          path: targeted-validation.log
          if-no-files-found: error
          retention-days: 1
