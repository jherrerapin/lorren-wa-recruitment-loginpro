name: Apply issue 677 WhatsApp reliability

on:
  pull_request:
    branches:
      - automation/677-whatsapp-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/677-whatsapp-confirmation-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          ref: fix/677-whatsapp-confirmation-reliability
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Correct status-view transformation in application recipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-issue-677.py')
          source = path.read_text(encoding='utf-8')
          old = '''status_old = "return { ready, initializing, reconnecting: Boolean(reconnectTimer), manualLogoutRequested, lastQr, lastError, lastReadyAt, lastAuthenticatedAt, catchupRunning, lastCatchupAt, lastCatchupStartedAt, lastCatchupProcessed, pendingReconciliationRunning, lastPendingReconciliationAt, lastPendingReconciliationProcessed, ...authStorageInfo() };"
          status_new = "return { ready, initializing, reconnecting: Boolean(reconnectTimer), manualLogoutRequested, lastQr, lastError, lastReadyAt, lastAuthenticatedAt, lastInboundAt, lastConfirmationAt, lastHealthCheckAt, lastHealthState, lastHealthError, catchupRunning, lastCatchupAt, lastCatchupStartedAt, lastCatchupProcessed, pendingReconciliationRunning, lastPendingReconciliationAt, lastPendingReconciliationProcessed, ...authStorageInfo() };"
          if v6.count(status_old) != 2:
              raise SystemExit(f'estado runtime: se esperaban 2 coincidencias y se encontraron {v6.count(status_old)}')
          v6 = v6.replace(status_old, status_new)
          '''
          new = '''status_old = "return { ready, initializing, reconnecting: Boolean(reconnectTimer), manualLogoutRequested, lastQr, lastError, lastReadyAt, lastAuthenticatedAt, catchupRunning, lastCatchupAt, lastCatchupStartedAt, lastCatchupProcessed, pendingReconciliationRunning, lastPendingReconciliationAt, lastPendingReconciliationProcessed, ...authStorageInfo() };"
          status_new = "return { ready, initializing, reconnecting: Boolean(reconnectTimer), manualLogoutRequested, lastQr, lastError, lastReadyAt, lastAuthenticatedAt, lastInboundAt, lastConfirmationAt, lastHealthCheckAt, lastHealthState, lastHealthError, catchupRunning, lastCatchupAt, lastCatchupStartedAt, lastCatchupProcessed, pendingReconciliationRunning, lastPendingReconciliationAt, lastPendingReconciliationProcessed, ...authStorageInfo() };"
          v6 = replace_once(v6, status_old, status_new, 'estado runtime interno')
          status_view_old = "return { ready, initializing, reconnecting: Boolean(reconnectTimer), manualLogoutRequested, lastQr, qrImage, lastError, lastReadyAt, lastAuthenticatedAt, catchupRunning, lastCatchupAt, lastCatchupStartedAt, lastCatchupProcessed, pendingReconciliationRunning, lastPendingReconciliationAt, lastPendingReconciliationProcessed, ...authStorageInfo() };"
          status_view_new = "return { ready, initializing, reconnecting: Boolean(reconnectTimer), manualLogoutRequested, lastQr, qrImage, lastError, lastReadyAt, lastAuthenticatedAt, lastInboundAt, lastConfirmationAt, lastHealthCheckAt, lastHealthState, lastHealthError, catchupRunning, lastCatchupAt, lastCatchupStartedAt, lastCatchupProcessed, pendingReconciliationRunning, lastPendingReconciliationAt, lastPendingReconciliationProcessed, ...authStorageInfo() };"
          v6 = replace_once(v6, status_view_old, status_view_new, 'estado runtime de vista')
          '''
          if source.count(old) != 1:
              raise SystemExit(f'No se encontró el bloque de estado esperado: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply exact reliability changes
        run: |
          if [ -f .github/issue-677-apply-error.txt ]; then
            cat .github/issue-677-apply-error.txt
            exit 1
          fi
          set +e
          python3 .github/scripts/apply-issue-677.py > /tmp/issue-677-apply.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-677-apply.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/issue-677-apply.log .github/issue-677-apply-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/issue-677-apply-error.txt
            git commit -m "chore: capturar diagnóstico de aplicación #677"
            git push origin HEAD:fix/677-whatsapp-confirmation-reliability
            exit "$status"
          fi

      - name: Remove temporary application files
        run: rm -f .github/scripts/apply-issue-677.py .github/issue-677-apply-error.txt .github/issue-677-trigger

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma and syntax
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/dispatchWhatsappWebServiceV6.js
          node --check src/services/dispatchWhatsappWebService.js
          node --check test/dispatchWhatsappRuntimeContracts.test.js

      - name: Run focused WhatsApp regressions
        run: node --test test/dispatchWhatsappRuntimeContracts.test.js

      - name: Commit canonical correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: garantizar confirmaciones de WhatsApp despacho (#677)"
          git push origin HEAD:fix/677-whatsapp-confirmation-reliability
