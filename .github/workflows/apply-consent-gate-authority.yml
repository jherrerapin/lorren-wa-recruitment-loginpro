name: Apply consent gate authority migration

on:
  push:
    branches:
      - refactor/439-consent-gate-authority

permissions:
  contents: write

concurrency:
  group: apply-consent-gate-authority
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/439-consent-gate-authority
          fetch-depth: 0

      - name: Apply exact consent gate migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/dataConsentGate.js')
          source = path.read_text()
          import_anchor = "import { isSupervisorPhone } from './adminSupervisor.js';\n"
          import_line = "import { recordCandidateDataConsent } from './consentStateService.js';\n"

          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor missing')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old_function = """async function recordConsent(prisma, req, candidate, status, resumeUpdate = {}) {
            const now = new Date();
            const accepted = status === 'ACCEPTED';
            const updateData = {
              dataConsentStatus: status,
              dataConsentVersion: DATA_CONSENT_VERSION,
              dataConsentText: DATA_CONSENT_TEXT,
              dataConsentSource: 'WHATSAPP_CANDIDATE',
              dataConsentAcceptedAt: accepted ? now : null,
              dataConsentRevokedAt: accepted ? null : now,
              dataConsentRecordedBy: 'candidate_whatsapp',
              currentStep: accepted ? ConversationStep.COLLECTING_DATA : ConversationStep.DONE,
              status: accepted ? candidate.status : CandidateStatus.NUEVO,
              botResumeMode: null,
              lastInboundAt: now,
              ...(accepted ? resumeUpdate : {})
            };

            const [updatedCandidate] = await prisma.$transaction([
              prisma.candidate.update({ where: { id: candidate.id }, data: updateData }),
              prisma.candidateDataConsentEvent.create({
                data: {
                  candidateId: candidate.id,
                  status,
                  version: DATA_CONSENT_VERSION,
                  text: DATA_CONSENT_TEXT,
                  source: 'WHATSAPP_CANDIDATE',
                  actorUsername: 'candidate_whatsapp',
                  ipAddress: req.ip || null,
                  userAgent: req.get('user-agent') || null,
                  note: accepted ? 'Aceptación registrada por respuesta de WhatsApp.' : 'Revocatoria registrada por respuesta de WhatsApp.'
                }
              })
            ]);
            return updatedCandidate;
          }
          """
          new_function = """async function recordConsent(prisma, req, candidate, status, resumeUpdate = {}) {
            const now = new Date();
            const accepted = status === 'ACCEPTED';
            const result = await recordCandidateDataConsent(prisma, {
              candidateId: candidate.id,
              status,
              version: DATA_CONSENT_VERSION,
              text: DATA_CONSENT_TEXT,
              source: 'WHATSAPP_CANDIDATE',
              actorUsername: 'candidate_whatsapp',
              ipAddress: req.ip || null,
              userAgent: req.get('user-agent') || null,
              note: accepted ? 'Aceptación registrada por respuesta de WhatsApp.' : 'Revocatoria registrada por respuesta de WhatsApp.',
              candidatePatch: {
                currentStep: accepted ? ConversationStep.COLLECTING_DATA : ConversationStep.DONE,
                status: accepted ? candidate.status : CandidateStatus.NUEVO,
                botResumeMode: null,
                lastInboundAt: now,
                ...(accepted ? resumeUpdate : {})
              },
              now
            });
            return result.candidate;
          }
          """

          if old_function in source:
              source = source.replace(old_function, new_function, 1)
          elif new_function not in source:
              raise SystemExit('recordConsent anchor missing')

          path.write_text(source)
          PY

      - name: Commit migration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dataConsentGate.js
          git commit -m "refactor: delegar gate en autoridad de consentimiento"
          git push origin HEAD:refactor/439-consent-gate-authority
