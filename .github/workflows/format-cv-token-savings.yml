name: Format CV token savings

on:
  push:
    branches:
      - fix/cv-token-savings-persistent-cache
    paths:
      - .format/apply-cv-token-savings

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-token-savings-persistent-cache
          fetch-depth: 0

      - name: Fix assembled line boundaries
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/cvIntelligence.js')
          text = path.read_text()
          replacements = {
              "function compact(value = '') {  return String(value || '').trim();": "function compact(value = '') {\n  return String(value || '').trim();",
              "if (prisma?.cvCandidateComparison?.findMany) {      rows =": "if (prisma?.cvCandidateComparison?.findMany) {\n      rows =",
              "function candidateCvReference(candidate = {}) {  const storageKey": "function candidateCvReference(candidate = {}) {\n  const storageKey",
              "const classification = textResult.reason === 'unsupported_file_type'      ?": "const classification = textResult.reason === 'unsupported_file_type'\n      ?",
              "filter(Boolean).slice(0, 5)      : [],": "filter(Boolean).slice(0, 5)\n      : [],"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected boundary: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/services/cvIntelligence.js
          npm ci
          DATABASE_URL='postgresql://user:pass@localhost:5432/lorren_test' npx prisma validate
          npm run build
          node --test test/cvTokenSavings.test.js test/cvIntelligenceReviewContracts.test.js test/attachmentAnalysisContract.test.js
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .format
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/services/cvIntelligence.js .format
          git commit -m 'style: corregir formato del ahorro de tokens HV'
          git push origin HEAD:fix/cv-token-savings-persistent-cache