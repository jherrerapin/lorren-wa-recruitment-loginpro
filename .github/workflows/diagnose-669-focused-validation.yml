name: Diagnose focused 669 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'refactor/669-single-turn-interpretation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      OPENAI_API_KEY: test-openai-key
      META_PHONE_NUMBER_ID: meta-phone-id
      META_ACCESS_TOKEN: meta-access-token
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Reuse exact patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-669-single-turn-interpretation.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          Path('/tmp/apply-669.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          node /tmp/apply-669.js
      - name: Run checks independently
        run: |
          set +e
          : > focused-summary.txt
          run_check() {
            name="$1"
            shift
            "$@" > "${name}.log" 2>&1
            code=$?
            printf '%s=%s\n' "$name" "$code" >> focused-summary.txt
          }
          run_check service-syntax node --check src/services/conversationUnderstanding.js
          run_check webhook-syntax node --check src/routes/webhook.js
          run_check test-syntax node --check test/conversationUnderstanding.test.js
          run_check understanding-tests node --test test/conversationUnderstanding.test.js
          run_check interpretation-replay node --test test/conversationReplayInterpretation.test.js
          run_check planning-replay node --test test/conversationReplayPlanning.test.js
          cat focused-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-669-focused
          path: |
            focused-summary.txt
            *.log
          if-no-files-found: error
          retention-days: 2
