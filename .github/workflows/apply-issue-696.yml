name: Apply issue 696 logout fix

on:
  pull_request:
    branches:
      - automation/696-logout-runner
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/696-logout-redirect'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
      NODE_ENV: test
    steps:
      - name: Check out functional branch
        uses: actions/checkout@v4
        with:
          ref: fix/696-logout-redirect
          fetch-depth: 0
          persist-credentials: true

      - name: Load exact fix recipe
        run: |
          git fetch origin automation/696-logout-runner
          git show origin/automation/696-logout-runner:.github/scripts/apply-issue-696.py > /tmp/apply-issue-696.py

      - name: Apply exact fix
        run: |
          python3 /tmp/apply-issue-696.py
          rm -f .github/issue-696-trigger.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate logout fix
        run: |
          npx prisma validate
          npm run prisma:generate
          node --check src/services/adminSession.js
          node --check src/server.js
          node --check test/adminSession.test.js
          node --test test/adminSession.test.js
          git diff --check

      - name: Commit canonical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restaurar cierre de sesión del panel (#696)"
          git push origin HEAD:fix/696-logout-redirect
