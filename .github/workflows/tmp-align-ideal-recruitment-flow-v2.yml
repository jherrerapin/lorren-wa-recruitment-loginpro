name: tmp-align-ideal-recruitment-flow-v2
on:
  push:
    branches:
      - fix/production-ad-flow-20260808
permissions:
  contents: write
jobs:
  align-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-ad-flow-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Apply runtime and contract alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def one(text, old, new, label):
              n = text.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1, got {n}')
              return text.replace(old, new, 1)

          # webhook: pass the resolved vacancy to reply safety for normal gate replies.
          p='src/routes/webhook.js'; t=read(p)
          target="""  if (vacancyFirstGateDecision.action === VacancyFirstGateAction.REPLY) {
            const applied = await applyVacancyFirstGateUpdates(vacancyFirstGateDecision.candidateUpdates);
            if (!applied.applied) return;
            return reply(prisma, candidate.id, from, vacancyFirstGateDecision.reply, cleanText, {
              body: vacancyFirstGateDecision.reply,
              source: 'vacancy_first_gate',
              reason: vacancyFirstGateDecision.reason,
              replyKind: vacancyFirstGateDecision.replyKind
            });
          }"""
          repl="""  if (vacancyFirstGateDecision.action === VacancyFirstGateAction.REPLY) {
            const applied = await applyVacancyFirstGateUpdates(vacancyFirstGateDecision.candidateUpdates);
            if (!applied.applied) return;
            return reply(prisma, candidate.id, from, vacancyFirstGateDecision.reply, cleanText, {
              body: vacancyFirstGateDecision.reply,
              source: 'vacancy_first_gate',
              reason: vacancyFirstGateDecision.reason,
              replyKind: vacancyFirstGateDecision.replyKind,
              safetyVacancy: currentVacancy || vacancyFirstGateDecision.vacancy || null
            });
          }"""
          t=one(t,target,repl,'gate reply safety context'); write(p,t)

          # vacancyFirstGate: present information once; if interest is already explicit, request consent immediately.
          p='src/services/vacancyFirstGate.js'; t=read(p)
          old="""function buildActiveVacancyInterestReply(vacancy = {}, inboundText = '') {
            const answer = buildVacancyInformationAnswer(vacancy, inboundText) || buildVacancyOverview(vacancy);
            return `${answer} Si después de revisar esta información te interesa continuar, confírmame y seguimos con la postulación.`;
          }"""
          new="""function buildActiveVacancyInformationReply(vacancy = {}, inboundText = '') {
            return buildVacancyInformationAnswer(vacancy, inboundText) || buildVacancyOverview(vacancy);
          }

          function buildActiveVacancyInterestReply(vacancy = {}, inboundText = '') {
            const answer = buildActiveVacancyInformationReply(vacancy, inboundText);
            return `${answer} Si después de revisar esta información te interesa continuar, confírmame y seguimos con la postulación.`;
          }"""
          t=one(t,old,new,'vacancy info helper')
          old="""  if (resolution.resolved && resolution.vacancy && isOpenVacancy(resolution.vacancy)) {
            if (requiresConsentBeforeCollection(candidate)) {
              return {
                action: VacancyFirstGateAction.REPLY,
                reason: 'ACTIVE_VACANCY_RESOLVED_AWAIT_INTEREST',
                replyKind: 'ACTIVE_VACANCY_INTEREST_PROMPT',
                vacancyId: resolution.vacancy.id,
                vacancy: resolution.vacancy,
                candidateUpdates: buildAwaitingApplicationInterestUpdates(resolution.vacancy.id),
                reply: buildActiveVacancyInterestReply(resolution.vacancy, inboundText),
                resolution
              };
            }
            return { action: VacancyFirstGateAction.ASSIGN_VACANCY_AND_CONTINUE, reason: 'ACTIVE_VACANCY_RESOLVED', vacancyId: resolution.vacancy.id, vacancy: resolution.vacancy, resolution };
          }"""
          new="""  if (resolution.resolved && resolution.vacancy && isOpenVacancy(resolution.vacancy)) {
            if (requiresConsentBeforeCollection(candidate)) {
              const resolvedTurn = analyzeConversationTurn(inboundText, { currentStep });
              if (resolvedTurn.interest) {
                return {
                  action: VacancyFirstGateAction.REPLY,
                  reason: 'ACTIVE_VACANCY_RESOLVED_AWAIT_CONSENT',
                  replyKind: 'DATA_CONSENT_PROMPT',
                  vacancyId: resolution.vacancy.id,
                  vacancy: resolution.vacancy,
                  candidateUpdates: {
                    vacancyId: resolution.vacancy.id,
                    currentStep: GREETING_SENT,
                    botResumeMode: buildConsentPendingMode(),
                    reminderScheduledFor: null,
                    reminderState: 'SKIPPED'
                  },
                  reply: [
                    buildActiveVacancyInformationReply(resolution.vacancy, inboundText),
                    buildDataConsentPromptReply()
                  ].filter(Boolean).join('\\n\\n'),
                  resolution
                };
              }
              return {
                action: VacancyFirstGateAction.REPLY,
                reason: 'ACTIVE_VACANCY_RESOLVED_AWAIT_INTEREST',
                replyKind: 'ACTIVE_VACANCY_INTEREST_PROMPT',
                vacancyId: resolution.vacancy.id,
                vacancy: resolution.vacancy,
                candidateUpdates: buildAwaitingApplicationInterestUpdates(resolution.vacancy.id),
                reply: buildActiveVacancyInterestReply(resolution.vacancy, inboundText),
                resolution
              };
            }
            return { action: VacancyFirstGateAction.ASSIGN_VACANCY_AND_CONTINUE, reason: 'ACTIVE_VACANCY_RESOLVED', vacancyId: resolution.vacancy.id, vacancy: resolution.vacancy, resolution };
          }"""
          t=one(t,old,new,'resolved vacancy explicit interest'); write(p,t)

          # campaign confirmation: same flexibility and company question support.
          p='src/services/dataConsentGate.js'; t=read(p)
          old="""function buildVacancyInfoReply(vacancy = {}) {
            const city = vacancyCity(vacancy);
            const parts = [`Perfecto, te comparto la información registrada de ${vacancyTitle(vacancy)}${city ? ` en ${city}` : ''}.`];
            if (vacancy.roleDescription) parts.push(`El cargo consiste en ${vacancy.roleDescription}.`);
            if (vacancy.operationAddress) parts.push(`Zona de operación: ${vacancy.operationAddress}.`);
            if (vacancy.requirements) parts.push(`Requisitos: ${vacancy.requirements}.`);
            if (vacancy.conditions) parts.push(`Condiciones: ${vacancy.conditions}.`);
            if (vacancy.requiredDocuments) parts.push(`Documentos para el proceso: ${vacancy.requiredDocuments}.`);
            parts.push('¿Te interesa continuar con esta postulación?');
            return parts.join('\\n\\n');
          }"""
          new="""function buildVacancyInfoReply(vacancy = {}, { askInterest = true } = {}) {
            const city = vacancyCity(vacancy);
            const parts = [`Perfecto, te comparto la información registrada de ${vacancyTitle(vacancy)}${city ? ` en ${city}` : ''}.`];
            if (vacancy.roleDescription) parts.push(`El cargo consiste en ${vacancy.roleDescription}.`);
            if (vacancy.operationAddress) parts.push(`Zona de operación: ${vacancy.operationAddress}.`);
            if (vacancy.requirements) parts.push(`Requisitos: ${vacancy.requirements}.`);
            if (vacancy.conditions) parts.push(`Condiciones: ${vacancy.conditions}.`);
            if (vacancy.requiredDocuments) parts.push(`Documentos para el proceso: ${vacancy.requiredDocuments}.`);
            if (askInterest) parts.push('¿Te interesa continuar con esta postulación?');
            return parts.join('\\n\\n');
          }"""
          t=one(t,old,new,'campaign vacancy info helper')
          anchor="""  if (/\\b(salario|sueldo|pago|cuanto pagan|cuanto es)\\b/.test(normalized)) {"""
          insert="""  if (/\\b(empresa|compania|cliente|quien contrata|para que empresa|operacion)\\b/.test(normalized)) {
            const operationName = String(vacancy?.operation?.name || '').trim();
            const operationPart = operationName ? ` La operación registrada para esta vacante es ${operationName}.` : '';
            return `El proceso de selección lo gestiona LoginPro.${operationPart}`;
          }
          """ + anchor
          t=one(t,anchor,insert,'campaign company question')
          old="""  if (isAffirmativeVacancyConfirmation(body)) {
            const cvResendRequired = candidate.botResumeMode === CAMPAIGN_CONFIRMATION_CV_MODE;
            await prisma.candidate.update({
              where: { id: candidate.id },
              data: {
                currentStep: ConversationStep.GREETING_SENT,
                botResumeMode: cvResendRequired ? PRE_CONSENT_CV_RESEND_MODE : APPLICATION_INTEREST_PENDING_MODE
              }
            });
            const reply = [questionReply, buildVacancyInfoReply(vacancy)].filter(Boolean).join('\\n\\n');
            await sendAndStore(prisma, candidate.id, from, reply, 'campaign_vacancy_confirmed', { vacancyId: vacancy.id, cvResendRequired });
            return true;
          }"""
          new="""  if (isAffirmativeVacancyConfirmation(body)) {
            const cvResendRequired = candidate.botResumeMode === CAMPAIGN_CONFIRMATION_CV_MODE;
            const turn = analyzeConversationTurn(body, { currentStep: candidate.currentStep });
            const interestAlreadyExplicit = Boolean(turn.interest);
            const nextMode = interestAlreadyExplicit
              ? buildConsentPendingMode({ cvResendRequired })
              : (cvResendRequired ? PRE_CONSENT_CV_RESEND_MODE : APPLICATION_INTEREST_PENDING_MODE);
            await prisma.candidate.update({
              where: { id: candidate.id },
              data: {
                currentStep: ConversationStep.GREETING_SENT,
                botResumeMode: nextMode
              }
            });
            const reply = interestAlreadyExplicit
              ? [questionReply, buildVacancyInfoReply(vacancy, { askInterest: false }), CONSENT_PROMPT].filter(Boolean).join('\\n\\n')
              : [questionReply, buildVacancyInfoReply(vacancy)].filter(Boolean).join('\\n\\n');
            await sendAndStore(prisma, candidate.id, from, reply, interestAlreadyExplicit ? 'campaign_vacancy_confirmed_interest_consent' : 'campaign_vacancy_confirmed', { vacancyId: vacancy.id, cvResendRequired });
            return true;
          }"""
          t=one(t,old,new,'campaign confirmation interest'); write(p,t)

          # tests: direct active-vacancy intake.
          p='test/activeVacancyQuestionIntake.test.js'; t=read(p)
          t=t.replace("interés explícito y pregunta responde primero y entra a recolección", "interés explícito y pregunta responde primero y solicita consentimiento")
          t=one(t,"""  assert.equal(result.candidate.currentStep, 'COLLECTING_DATA');
            assert.match(result.reply, /condiciones registradas/i);
            assert.match(result.reply, /comp[aá]rteme/i);""","""  assert.equal(result.candidate.currentStep, 'GREETING_SENT');
            assert.match(String(result.candidate.botResumeMode), /^awaiting_data_consent/);
            assert.match(result.reply, /condiciones registradas/i);
            assert.match(result.reply, /autorización|autorizas|tratamiento de datos/i);
            assert.doesNotMatch(result.reply, /comp[aá]rteme/i);""",'active interest test')
          t=one(t,"""  assert.match(result.reply, /condiciones registradas/i);
            assert.doesNotMatch(result.reply, /comp[aá]rteme/i);""","""  assert.match(result.reply, /condiciones registradas/i);
            assert.match(result.reply, /Contrato por obra y proceso con entrevista/i);
            assert.doesNotMatch(result.reply, /no tengo una condición registrada/i);
            assert.doesNotMatch(result.reply, /comp[aá]rteme/i);""",'info-only safety test')
          write(p,t)

          # harness fixtures.
          p='test/fixtures/conversationCases.js'; t=read(p)
          t=one(t,"candidate: { vacancyId: 'vac-sched', currentStep: 'COLLECTING_DATA' },\n      lastReplyIncludes: ['condiciones registradas', 'comparteme'],","candidate: { vacancyId: 'vac-sched', currentStep: 'GREETING_SENT' },\n      lastReplyIncludes: ['condiciones registradas', 'autoriz'],",'answer question fixture')
          t=one(t,"vacancyId: 'vac-bodega-siberia',\n        currentStep: 'COLLECTING_DATA'","vacancyId: 'vac-bodega-siberia',\n        currentStep: 'GREETING_SENT'",'funza fixture step')
          t=one(t,"lastReplyIncludes: ['comparteme'],\n      lastReplyNotIncludes: ['Desde que ciudad nos escribes y para que vacante o cargo']","lastReplyIncludes: ['Auxiliar de Bodega Siberia', 'autoriz'],\n      lastReplyNotIncludes: ['comparteme', 'Desde que ciudad nos escribes y para que vacante o cargo']",'funza fixture reply')
          write(p,t)

          # latency tests.
          p='test/webhookMultiline.test.js'; t=read(p)
          t=t.replace('la ventana multilinea usa 90 segundos para consolidar antes de razonar','la ventana multilinea usa 8 segundos por defecto antes de razonar')
          t=t.replace('assert.equal(earlyWindow, 90000);','assert.equal(earlyWindow, 8000);').replace('assert.equal(resolvedWindow, 90000);','assert.equal(resolvedWindow, 8000);')
          t=t.replace('la ventana de razonamiento se puede configurar y queda acotada a 90 segundos','la ventana de razonamiento se puede configurar y queda acotada a 20 segundos')
          t=t.replace("assert.equal(getMultilineWindowMs({ currentStep: 'ASK_CV', vacancyResolved: true }), 90000);","assert.equal(getMultilineWindowMs({ currentStep: 'ASK_CV', vacancyResolved: true }), 20000);")
          write(p,t)

          # replay expectations: info-only waits for interest; explicit interest moves to consent after presenting info.
          p='test/conversation-replay/vacancyConsentOrderReplay.js'; t=read(p)
          t=t.replace("includes: ['condiciones registradas', '¿Deseas postularte y continuar con este proceso?']","includes: ['condiciones registradas', 'te interesa continuar']")
          t=t.replace("includes: ['requisitos registrados', '¿Deseas postularte y continuar con este proceso?']","includes: ['requisitos registrados', 'te interesa continuar']")
          old="""      reason: 'ACTIVE_VACANCY_RESOLVED_AWAIT_INTEREST',
                replyKind: 'ACTIVE_VACANCY_INTEREST_PROMPT',
                includes: ['Encontré la vacante', '¿Deseas postularte y continuar con este proceso?'],
                excludes: ['nombre completo', 'documento', 'edad', 'transporte', 'hoja de vida', 'Autorizo a LoginPro'],
                currentStep: 'GREETING_SENT',
                botResumeMode: 'awaiting_application_interest'"""
          new="""      reason: 'ACTIVE_VACANCY_RESOLVED_AWAIT_CONSENT',
                replyKind: 'DATA_CONSENT_PROMPT',
                includes: ['información', 'Autorizo a LoginPro'],
                excludes: ['nombre completo', 'edad', 'transporte', 'hoja de vida'],
                currentStep: 'GREETING_SENT',
                botResumeMode: 'awaiting_data_consent'"""
          t=one(t,old,new,'explicit interest replay expectation'); write(p,t)

          # resolution tests: selected vacancy remains the same, but pre-consent action is REPLY/info.
          p='test/vacancyCorrectionPriority.test.js'; t=read(p)
          t=t.replace('VacancyFirstGateAction.ASSIGN_VACANCY_AND_CONTINUE','VacancyFirstGateAction.REPLY')
          t=t.replace("'ACTIVE_VACANCY_RESOLVED'","'ACTIVE_VACANCY_RESOLVED_AWAIT_INTEREST'")
          write(p,t)

          p='test/leaderVacancyResolution.test.js'; t=read(p)
          # Only the three stale pre-consent gate assertions in this file.
          stale='assert.equal(decision.action, VacancyFirstGateAction.ASSIGN_VACANCY_AND_CONTINUE);'
          if t.count(stale) < 3: raise SystemExit(f'leader stale count {t.count(stale)}')
          t=t.replace(stale,'assert.equal(decision.action, VacancyFirstGateAction.REPLY);',3)
          write(p,t)

          # Add focused tests for safety context and flexible explicit interest.
          p='test/productionPaidAdFlowRegressions.test.js'; t=read(p)
          marker="""test('producción: Esa si se reconoce como confirmación natural de la vacante', () => {"""
          extra="""test('producción: interés explícito al resolver vacante muestra información y pasa a consentimiento sin repreguntar interés', async () => {
            const decision = await resolveVacancyFirstGate({
              prisma: null,
              candidate: candidate(),
              currentVacancy: null,
              inboundText: 'Quiero postularme a líder de operación en Neiva',
              currentStep: 'GREETING_SENT',
              recentMessages: [],
              vacancyHints: { allVacancies: [vacancy], activeVacancies: [vacancy] }
            });
            assert.equal(decision.action, VacancyFirstGateAction.REPLY);
            assert.equal(decision.reason, 'ACTIVE_VACANCY_RESOLVED_AWAIT_CONSENT');
            assert.match(decision.reply, /Liderar y administrar equipos/i);
            assert.match(decision.reply, /autorización|autorizas/i);
            assert.doesNotMatch(decision.reply, /te interesa continuar/i);
            assert.doesNotMatch(decision.reply, /compárteme.*documento/i);
          });

          """+marker
          t=one(t,marker,extra,'explicit interest production regression'); write(p,t)
          PY
      - run: npm ci
      - run: npm run prisma:generate
      - name: Focused regression suite
        run: |
          node --test \
            test/activeVacancyQuestionIntake.test.js \
            test/conversation-harness.test.js \
            test/webhookMultiline.test.js \
            test/vacancyBeforeConsentReplay.test.js \
            test/vacancyCorrectionPriority.test.js \
            test/leaderVacancyResolution.test.js \
            test/productionPaidAdFlowRegressions.test.js \
            test/dataConsentPromptIdempotencyReplay.test.js \
            test/conversationalReleaseCandidatePreConsent.test.js
      - name: Capture current full suite
        shell: bash
        run: |
          set +e
          npm test > current.log 2>&1
          set -e
      - uses: actions/checkout@v5
        with:
          ref: ed754a71254393ad9de57c4551a65b4fc731fbfd
          path: .baseline
      - name: Capture base full suite
        shell: bash
        run: |
          cd .baseline
          npm ci
          npm run prisma:generate
          set +e
          npm test > "$GITHUB_WORKSPACE/base.log" 2>&1
          set -e
      - name: Compare exact failure identities
        shell: bash
        run: |
          set -euo pipefail
          extract() {
            awk '
              function emit_pending(){if(pending!=""&&!container)print pending; pending="";container=0}
              /^[[:space:]]*not ok [0-9]+ - /{emit_pending();x=$0;sub(/^[[:space:]]*not ok [0-9]+ - /,"",x);sub(/[[:space:]]+#.*$/,"",x);sub(/[[:space:]]+$/,"",x);pending=x;next}
              pending!=""&&/^[[:space:]]*failureType:[[:space:]].*subtestsFailed/{container=1;next}
              END{emit_pending()}
            ' "$1" | LC_ALL=C sort -u > "$2"
          }
          extract base.log base.failures
          extract current.log current.failures
          LC_ALL=C comm -23 current.failures base.failures > unexpected.failures
          echo '=== CURRENT ==='; grep -E '^# (tests|pass|fail|cancelled|skipped) ' current.log | tail -n 5 || true
          echo '=== BASE ==='; grep -E '^# (tests|pass|fail|cancelled|skipped) ' base.log | tail -n 5 || true
          echo '=== UNEXPECTED ==='; cat unexpected.failures || true
          if [ -s unexpected.failures ]; then
            while IFS= read -r id; do [ -z "$id" ] && continue; echo "--- $id ---"; grep -F -B 6 -A 24 -- "$id" current.log | head -n 60 || true; done < unexpected.failures
            exit 1
          fi
      - name: Commit validated changes and cleanup
        run: |
          rm -rf .baseline current.log base.log base.failures current.failures unexpected.failures
          rm -f .github/workflows/tmp-failure-identity-diagnostic.yml
          rm -f .github/workflows/tmp-align-ideal-recruitment-flow.yml
          rm -f .github/workflows/tmp-align-ideal-recruitment-flow-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: alinear flujo de pauta con consentimiento y contexto de vacante"
          git push origin HEAD:fix/production-ad-flow-20260808
