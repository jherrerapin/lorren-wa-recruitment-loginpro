name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-recruitment-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure-conversation-harness:
    name: Measure recruitment conversation harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Measure harness
        shell: bash
        run: |
          set +e
          node --test test/conversation-harness.test.js > harness.log 2>&1
          harness_exit=$?
          set -e
          cat harness.log
          awk '/^[[:space:]]*not ok [0-9]+ - / {
            line=$0
            sub(/^[[:space:]]*not ok [0-9]+ - /, "", line)
            sub(/[[:space:]]+#.*$/, "", line)
            print "::warning title=Conversation harness residual::" line
          }' harness.log
          echo "Harness exit: $harness_exit"
          exit 0

      - name: Validate release focal suite
        run: >-
          node --test
          test/recruitmentReleaseGate.test.js
          test/contextualResponseGate.test.js
          test/vacancyFirstGate.test.js
          test/dataConsentOrderReplay.test.js
          test/conversationEngineParity.test.js
