name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-recruitment-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-recruitment-release:
    name: Apply and validate recruitment release fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: audit/recruitment-release-debt
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply deterministic repair
        run: node scripts/apply-recruitment-release-fixes.mjs

      - name: Validate repaired syntax
        run: >-
          node --check src/services/contextualResponseGate.js &&
          node --check src/services/vacancyFirstGate.js &&
          node --check src/routes/webhook.js

      - name: Trace no-slot scheduling route
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          process.env.NODE_ENV = 'test';
          process.env.OPENAI_API_KEY = 'test-openai-key';
          process.env.USE_CONVERSATION_ENGINE = 'false';
          process.env.META_PHONE_NUMBER_ID = 'meta-phone-id';
          process.env.META_ACCESS_TOKEN = 'meta-access-token';
          process.env.LORREN_SEND_DELAY_MS = '0';
          const { conversationParityCases } = await import('./test/fixtures/conversationParityCases.js');
          const { runConversationCase } = await import('./test/helpers/conversationHarness.js');
          const { processText } = await import('./src/routes/webhook.js');
          const { createDebugTrace } = await import('./src/services/debugTrace.js');
          const scenario = conversationParityCases.find((item) => item.id === 'parity-no-available-slots');
          const result = await runConversationCase(scenario, {
            processText,
            createDebugTrace,
            assertExpectations: false,
            openAiCalls: [],
            recognizeCurrentEnginePrompt: true
          });
          console.log('NO_SLOT_CANDIDATE=' + JSON.stringify(result.candidate));
          console.log('NO_SLOT_OUTBOUND=' + JSON.stringify(result.outbound));
          console.log('NO_SLOT_TRACES=' + JSON.stringify(result.debugTraces));
          NODE

      - name: Validate repaired focal behavior
        run: >-
          node --test
          test/recruitmentReleaseGate.test.js
          test/contextualResponseGate.test.js
          test/vacancyFirstGate.test.js
          test/dataConsentOrderReplay.test.js
          test/conversationEngineParity.test.js

      - name: Commit repaired runtime and regressions
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Repair already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "fix(conversation): close residual recruitment release gaps"
          git push origin HEAD:audit/recruitment-release-debt
