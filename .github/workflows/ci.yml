name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      test-status: ${{ steps.tests.outputs.status }}
      test-summary: ${{ steps.tests.outputs.summary }}

    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print0)

      - name: Run automated tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?

          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<LORREN_TEST_SUMMARY"
            tail -n 200 test-output.log
            echo "LORREN_TEST_SUMMARY"
          } >> "$GITHUB_OUTPUT"

          exit "$status"

      - name: Enforce automated test result
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Automated tests failed. Review the Test diagnostics job."
          exit 1

  test-diagnostics:
    name: Test diagnostics
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Display concise test result
        env:
          TEST_STATUS: ${{ needs.validate.outputs.test-status }}
          TEST_SUMMARY: ${{ needs.validate.outputs.test-summary }}
        shell: bash
        run: |
          if [ -z "$TEST_STATUS" ]; then
            echo "The test step was not reached. Review the failed step in Validate application."
            exit 1
          fi

          echo "Automated test exit code: $TEST_STATUS"
          printf '%s\n' "$TEST_SUMMARY"

          if [ "$TEST_STATUS" != "0" ]; then
            exit 1
          fi
