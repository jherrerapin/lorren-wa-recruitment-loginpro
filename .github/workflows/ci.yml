name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-codex-findings:
    if: github.event.pull_request.number == 492 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: refactor/491-manual-outbound-delivery
          fetch-depth: 0

      - name: Apply bounded admin and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              if old not in source:
                  raise SystemExit(f'{label} not found')
              return source.replace(old, new, 1)

          admin = Path('src/routes/admin.js')
          source = admin.read_text()
          source = replace_once(
              source,
              "import {\n  deliverManualOutboundText,\n  getManualOutboundUserMessage\n} from '../services/manualOutboundDeliveryService.js';",
              "import {\n  deliverManualOutboundText,\n  getManualOutboundCompletionNotice,\n  getManualOutboundUserMessage\n} from '../services/manualOutboundDeliveryService.js';",
              'manual outbound import'
          )
          source = replace_once(
              source,
              """      await sendAdminOutboundMessage(prisma, booking.candidate, body, {
                source: 'admin_manual_interview_reminder',
                interviewBookingId: booking.id
              });
              await logCandidateAdminEvent(prisma, {""",
              """      const delivery = await sendAdminOutboundMessage(prisma, booking.candidate, body, {
                source: 'admin_manual_interview_reminder',
                interviewBookingId: booking.id
              });
              const notice = getManualOutboundCompletionNotice(
                delivery,
                'Recordatorio manual enviado correctamente.'
              );
              await logCandidateAdminEvent(prisma, {""",
              'manual reminder delivery capture'
          )
          source = replace_once(
              source,
              "return res.redirect(withFlashMessage(returnTo, 'success', 'Recordatorio manual enviado correctamente.'));",
              "return res.redirect(withFlashMessage(returnTo, notice.type, notice.message));",
              'manual reminder notice'
          )
          source = replace_once(
              source,
              """      await sendAdminOutboundMessage(prisma, candidate, body, {
                source: 'admin_manual_vacancy_info',
                actor: 'RECRUITER',
                action: 'send_vacancy_info',
                vacancyId: candidate.vacancy.id
              });
              return res.redirect(withFlashMessage(returnTo, 'success', 'Información de la vacante enviada correctamente.'));""",
              """      const delivery = await sendAdminOutboundMessage(prisma, candidate, body, {
                source: 'admin_manual_vacancy_info',
                actor: 'RECRUITER',
                action: 'send_vacancy_info',
                vacancyId: candidate.vacancy.id
              });
              const notice = getManualOutboundCompletionNotice(
                delivery,
                'Información de la vacante enviada correctamente.'
              );
              return res.redirect(withFlashMessage(returnTo, notice.type, notice.message));""",
              'vacancy info notice'
          )
          source = replace_once(
              source,
              """      await sendAdminOutboundMessage(prisma, candidate, body, {
                source: 'admin_outbound',
                action: action || 'free_text',
                preserveExactBody: action === 'free_text'
              });
              res.redirect(`/admin/candidates/${id}?outboundSuccess=` + encodeURIComponent('Mensaje enviado correctamente.'));""",
              """      const delivery = await sendAdminOutboundMessage(prisma, candidate, body, {
                source: 'admin_outbound',
                action: action || 'free_text',
                preserveExactBody: action === 'free_text'
              });
              const notice = getManualOutboundCompletionNotice(delivery, 'Mensaje enviado correctamente.');
              const noticeParam = notice.type === 'success' ? 'outboundSuccess' : 'outboundError';
              res.redirect(`/admin/candidates/${id}?${noticeParam}=` + encodeURIComponent(notice.message));""",
              'free outbound notice'
          )
          source = replace_once(
              source,
              """      await sendAdminOutboundMessage(prisma, candidate, body, {
                source: 'admin_request_hv',
                action: 'request_hv'
              });
              res.redirect(withFlashMessage(returnTo, 'success', 'Solicitud de HV enviada correctamente.'));""",
              """      const delivery = await sendAdminOutboundMessage(prisma, candidate, body, {
                source: 'admin_request_hv',
                action: 'request_hv'
              });
              const notice = getManualOutboundCompletionNotice(
                delivery,
                'Solicitud de HV enviada correctamente.'
              );
              res.redirect(withFlashMessage(returnTo, notice.type, notice.message));""",
              'request hv notice'
          )
          admin.write_text(source)

          structural = Path('test/adminManualOutboundDeliveryAuthority.test.js')
          structural_source = structural.read_text()
          structural_source = replace_once(
              structural_source,
              "/import \\{\\s*deliverManualOutboundText,\\s*getManualOutboundUserMessage\\s*\\} from '\\.\\.\\/services\\/manualOutboundDeliveryService\\.js';/",
              "/import \\{\\s*deliverManualOutboundText,\\s*getManualOutboundCompletionNotice,\\s*getManualOutboundUserMessage\\s*\\} from '\\.\\.\\/services\\/manualOutboundDeliveryService\\.js';/",
              'structural import regex'
          )
          structural_source += """

test('los cuatro consumidores convierten reconciliación pendiente en advertencia visible', () => {
  for (const [name, route] of [
    ['recordatorio de entrevista', interviewReminderRoute],
    ['información de vacante', vacancyInfoRoute],
    ['mensaje saliente', outboundRoute],
    ['solicitud de HV', requestHvRoute]
  ]) {
    assert.match(route, /const delivery = await sendAdminOutboundMessage\(/, `${name} no captura el resultado`);
    assert.match(route, /getManualOutboundCompletionNotice\(/, `${name} no convierte el resultado en aviso`);
  }
  assert.match(outboundRoute, /notice\.type === 'success' \? 'outboundSuccess' : 'outboundError'/);
});
"""
          structural.write_text(structural_source)

          service_test = Path('test/manualOutboundDeliveryService.test.js')
          test_source = service_test.read_text()
          test_source = replace_once(
              test_source,
              """import {
  deliverManualOutboundText,
  getManualOutboundUserMessage
} from '../src/services/manualOutboundDeliveryService.js';""",
              """import {
  deliverManualOutboundText,
  getManualOutboundCompletionNotice,
  getManualOutboundUserMessage
} from '../src/services/manualOutboundDeliveryService.js';""",
              'service test import'
          )
          test_source += """

test('count cero después de Meta queda SENT pero pendiente de reconciliación', async () => {
  const harness = createHarness({ candidate: baseCandidate });
  const originalUpdateMany = harness.prisma.candidate.updateMany;
  let updateAttempt = 0;
  harness.prisma.candidate.updateMany = async (args) => {
    updateAttempt += 1;
    if (updateAttempt === 2) return { count: 0 };
    return originalUpdateMany(args);
  };
  const result = await deliverManualOutboundText(harness.prisma, input, {
    sendText: harness.sendText,
    now: createClock('2026-07-16T01:35:00.000Z', '2026-07-16T01:35:01.000Z')
  });
  assert.equal(result.sent, true);
  assert.equal(result.deliveryState, 'SENT');
  assert.equal(result.candidateStateCount, 0);
  assert.equal(result.persistencePending, true);
  assert.equal(harness.state.messages[0].rawPayload.delivery.state, 'SENT');
  assert.equal(harness.state.messages[0].rawPayload.delivery.candidateStateCount, 0);
  const notice = getManualOutboundCompletionNotice(result, 'Mensaje enviado correctamente.');
  assert.equal(notice.type, 'error');
  assert.match(notice.message, /WhatsApp confirmó el envío/i);
  assert.match(notice.message, /No reenvíes/i);
});

test('éxito reconciliado conserva el aviso normal', () => {
  const notice = getManualOutboundCompletionNotice(
    { sent: true, persistencePending: false },
    'Mensaje enviado correctamente.'
  );
  assert.deepEqual(notice, {
    type: 'success',
    message: 'Mensaje enviado correctamente.'
  });
});

test('el error persistido del proveedor elimina tokens y credenciales', async () => {
  const harness = createHarness({ candidate: baseCandidate });
  const rejection = new Error('falló access_token=secreto Bearer token-supersecreto');
  rejection.response = { status: 400 };
  await assert.rejects(
    () => deliverManualOutboundText(harness.prisma, input, {
      sendText: async () => { throw rejection; },
      now: createClock('2026-07-16T01:40:00.000Z', '2026-07-16T01:40:01.000Z')
    }),
    /manual_outbound_provider_rejected/
  );
  const lastError = harness.state.messages[0].rawPayload.delivery.lastError;
  assert.match(lastError, /access_token=\[REDACTED\]/);
  assert.match(lastError, /Bearer \[REDACTED\]/);
  assert.doesNotMatch(lastError, /secreto|token-supersecreto/);
});
"""
          service_test.write_text(test_source)
          PY

      - name: Validate bounded findings
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/routes/admin.js test/adminManualOutboundDeliveryAuthority.test.js test/manualOutboundDeliveryService.test.js | sort)
          test "$changed" = "$expected"
          node --check src/routes/admin.js
          node --check test/adminManualOutboundDeliveryAuthority.test.js
          node --check test/manualOutboundDeliveryService.test.js
          node --check src/services/manualOutboundDeliveryService.js
          node --check src/services/botAutomationPolicy.js
          node --check test/adminBotPause.test.js
          npm ci --silent
          npm run prisma:generate --silent
          node --test test/manualOutboundDeliveryService.test.js
          node --test test/adminManualOutboundDeliveryAuthority.test.js test/adminManualOutbound.test.js
          node --test test/adminBotPause.test.js test/webhookCandidateStateAuthority.test.js
          git diff --check

      - name: Publish bounded findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.js test/adminManualOutboundDeliveryAuthority.test.js test/manualOutboundDeliveryService.test.js
          git commit -m 'fix: surface pending manual delivery reconciliation'
          git push origin HEAD:refactor/491-manual-outbound-delivery

  state-authority:
    name: Validate state authorities
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate state authority manifest
        run: node --test test/stateAuthorityManifest.test.js

      - name: Upload state authority diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: state-authority-observed
          path: state-authority-observed.json
          if-no-files-found: error
          retention-days: 3

  validate:
    name: Validate application
    needs: state-authority
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src test -type f -name '*.js' -print0)

      - name: Run conversation turn arbitration regressions
        run: node --test test/conversationIntent.test.js

      - name: Run flow-authority regression
        run: node --test test/flowDecisionAuthority.test.js

      - name: Run consent boundary regressions
        run: node --test test/flexibleApplicationFlow.test.js test/consentBoundaryHardening.test.js

      - name: Run consent and message authority regressions
        run: node --test test/consentStateService.test.js test/conversationMessageRepository.test.js

      - name: Run candidate state authority regressions
        run: node --test test/candidateStateService.test.js test/candidateAdminPauseStateService.test.js test/candidateWhatsAppOpenStateService.test.js test/candidateManualOutboundStateService.test.js test/webhookCandidateStateAuthority.test.js test/adminCandidatePauseAuthority.test.js test/adminCandidateWhatsAppOpenAuthority.test.js test/adminBotPause.test.js

      - name: Run interview booking authority regressions
        run: node --test test/interviewBookingStateService.test.js test/interviewSchedulerAuthority.test.js test/interviewLifecycle.test.js test/interviewBookingAdminStateService.test.js test/interviewBookingDeletionStateService.test.js test/adminInterviewBookingAuthority.test.js test/chatEngineInterviewBookingAuthority.test.js test/webhookInterviewBookingAuthority.test.js

      - name: Run supervisor coordination regressions
        run: node --test test/adminSupervisor.test.js

      - name: Run admin manual outbound regressions
        run: node --test test/manualOutboundDeliveryService.test.js test/adminManualOutboundDeliveryAuthority.test.js test/adminManualOutbound.test.js

      - name: Run webhook message authority regressions
        run: node --test test/webhookMessageAuthority.test.js test/webhookInboundMessageAuthority.test.js test/webhookIdempotency.test.js test/webhookPersistence.test.js test/turnOrchestratorContracts.test.js

      - name: Run reminder regressions
        run: node --test test/reminder.test.js test/interviewBookingReminderStateService.test.js

      - name: Run interview booking transition policy regressions
        run: node --test test/interviewBookingTransitionPolicy.test.js

      - name: Validate conversation replay fixtures
        run: node --test test/conversationReplayFixtures.test.js

      - name: Run conversation interpretation replay
        run: node --test test/conversationReplayInterpretation.test.js

      - name: Run conversation planning replay
        run: node --test test/conversationReplayPlanning.test.js

      - name: Run consent and attachment edge replay
        run: node --test test/conversationReplayConsentAttachmentEdges.test.js

      - name: Run integral replay for interest without consent
        env:
          REPLAY_FIXTURE_ID: consent-interest-is-not-consent-v1
        run: node --test test/conversationReplayIntegral.test.js

      - name: Run integral replay for vacancy question
        env:
          REPLAY_FIXTURE_ID: context-question-during-data-collection-v1
        run: node --test test/conversationReplayIntegral.test.js

      - name: Run integral replay for candidate correction
        env:
          REPLAY_FIXTURE_ID: context-correction-during-data-collection-v1
        run: node --test test/conversationReplayIntegral.test.js

      - name: Run integral replay for consent acceptance
        env:
          REPLAY_FIXTURE_ID: consent-explicit-acceptance-v1
        run: node --test test/conversationReplayIntegral.test.js

      - name: Run integral replay for consent rejection
        env:
          REPLAY_FIXTURE_ID: consent-explicit-rejection-v1
        run: node --test test/conversationReplayIntegral.test.js

      - name: Run integral replay for pre-consent document
        env:
          REPLAY_FIXTURE_ID: attachment-document-before-consent-v1
        run: node --test test/conversationReplayIntegral.test.js

      - name: Run conversation recovery replay
        run: node --test test/conversationReplayRecovery.test.js

      - name: Run automated tests and publish debt report
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          test_exit=$?
          set -e
          tests_count=$(awk '/^# tests [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          pass_count=$(awk '/^# pass [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          fail_count=$(awk '/^# fail [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          cancelled_count=$(awk '/^# cancelled [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          skipped_count=$(awk '/^# skipped [0-9]+$/ { value = $3 } END { print value }' test-output.log)
          if ! [[ "$tests_count" =~ ^[0-9]+$ ]] || ! [[ "$fail_count" =~ ^[0-9]+$ ]]; then
            echo "::error::The automated test command did not produce a valid TAP summary."
            tail -n 120 test-output.log
            exit 1
          fi
          pass_count="${pass_count:-0}"
          cancelled_count="${cancelled_count:-0}"
          skipped_count="${skipped_count:-0}"
          {
            echo "## Automated test debt report"
            echo
            echo "This report is temporarily non-blocking while the unstable legacy baseline is investigated in issue #386."
            echo
            echo "| Metric | Result |"
            echo "| --- | ---: |"
            echo "| Tests | $tests_count |"
            echo "| Passed | $pass_count |"
            echo "| Failed | $fail_count |"
            echo "| Cancelled | $cancelled_count |"
            echo "| Skipped | $skipped_count |"
            echo "| Process exit code | $test_exit |"
            echo
            echo "<details>"
            echo "<summary>Failing top-level tests</summary>"
            echo
            echo '```text'
            grep -E '^not ok [0-9]+ - ' test-output.log || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Automated tests: total=$tests_count pass=$pass_count fail=$fail_count exit=$test_exit"
          if [ "$fail_count" -gt 0 ]; then
            echo "::warning::$fail_count legacy test failures remain. They are tracked in issue #386 and are not yet a blocking gate."
            grep -E '^not ok [0-9]+ - ' test-output.log || true
            exit 0
          fi
          if [ "$test_exit" -ne 0 ]; then
            echo "::error::The test command exited with code $test_exit without reporting test failures."
            tail -n 120 test-output.log
            exit 1
          fi
          echo "All automated tests passed."
