name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-recruitment-final-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-conversation-harness:
    name: Finalize recruitment conversation harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorren_ci?schema=public
      SESSION_SECRET: ci-only-placeholder-not-for-production
      OPENAI_ENABLED: "false"
      FF_RESPONSES_EXTRACTOR: "false"
      USE_CONVERSATION_ENGINE: "false"
      DISPATCH_WWEB_AUTO_START: "false"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: audit/recruitment-release-debt
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply final canonical alignment
        run: node scripts/apply-final-harness-alignment.mjs

      - name: Validate syntax
        run: >-
          node --check src/routes/webhook.js &&
          node --check src/services/vacancyFirstGate.js

      - name: Require conversation harness green
        run: node --test test/conversation-harness.test.js

      - name: Require recruitment focal suite green
        run: >-
          node --test
          test/recruitmentReleaseGate.test.js
          test/contextualResponseGate.test.js
          test/vacancyFirstGate.test.js
          test/dataConsentOrderReplay.test.js
          test/conversationEngineParity.test.js
          test/adminBotPause.test.js
          test/aiFirstRecruitmentGuards.test.js

      - name: Commit validated alignment
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Final alignment already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "test(conversation): align release harness with canonical behavior"
          git push origin HEAD:audit/recruitment-release-debt
