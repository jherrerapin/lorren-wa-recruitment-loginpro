name: Apply webhook interview authority 477

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.number == 478 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve generated test escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-webhook-interview-authority.mjs')
          content = path.read_text(encoding='utf-8')
          content = content.replace(
              "write(testPath, `import test from 'node:test';",
              "write(testPath, String.raw`import test from 'node:test';",
              1,
          )
          content = content.replace(
              r"  assert.notEqual(startIndex, -1, \`No se encontró el marcador inicial: \${start}\`);",
              "  assert.notEqual(startIndex, -1, 'No se encontró el marcador inicial: ' + start);",
              1,
          )
          content = content.replace(
              r"  assert.notEqual(endIndex, -1, \`No se encontró el marcador final: \${end}\`);",
              "  assert.notEqual(endIndex, -1, 'No se encontró el marcador final: ' + end);",
              1,
          )
          content = content.replace(
              "  const replyIndex = initialBookingBranch.indexOf('return reply');",
              "  const replyIndex = initialBookingBranch.lastIndexOf('return reply');",
              1,
          )
          path.write_text(content, encoding='utf-8')
          PY

      - name: Apply scoped migration
        run: node scripts/apply-webhook-interview-authority.mjs

      - name: Check webhook syntax
        run: node --check src/routes/webhook.js

      - name: Run webhook booking authority regression
        run: node --test test/webhookInterviewBookingAuthority.test.js

      - name: Validate state authority manifest
        run: node --test test/stateAuthorityManifest.test.js

      - name: Publish scoped migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          allowed='^(src/routes/webhook.js|test/webhookInterviewBookingAuthority.test.js|docs/architecture/state-authority-manifest.json|docs/architecture/state-authority-map.md|docs/architecture/interview-booking-transition-inventory.md|\.codex-477-bootstrap.md|scripts/apply-webhook-interview-authority.mjs)$'
          unexpected=$(git diff --cached --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files in scoped migration:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "refactor: delegar reservas del webhook en la autoridad"
          git push origin HEAD:${{ github.head_ref }}
