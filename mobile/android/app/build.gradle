plugins {
    id 'com.android.application'
}

def portalBaseUrl = providers.gradleProperty('lorrenPortalBaseUrl')
    .orElse('https://example.invalid')
    .get()
if (!portalBaseUrl.startsWith('https://')) {
    throw new GradleException('lorrenPortalBaseUrl must use https://')
}
def escapedPortalBaseUrl = portalBaseUrl.replace('\\', '\\\\').replace('"', '\\"')

def lorrenVersionCodeText = providers.gradleProperty('lorrenVersionCode').orElse('1').get()
def lorrenVersionName = providers.gradleProperty('lorrenVersionName').orElse('0.1.0').get().trim()
if (!(lorrenVersionCodeText ==~ /[1-9][0-9]{0,9}/)) {
    throw new GradleException('lorrenVersionCode must be a positive integer')
}
def lorrenVersionCode = lorrenVersionCodeText.toInteger()
if (lorrenVersionCode > 2100000000) {
    throw new GradleException('lorrenVersionCode is too large')
}
if (!(lorrenVersionName ==~ /[0-9]+(?:\.[0-9]+){1,3}(?:[-+][A-Za-z0-9._-]+)?/)) {
    throw new GradleException('lorrenVersionName is invalid')
}

android {
    namespace 'com.loginpro.lorren.portal'
    compileSdk 37

    defaultConfig {
        applicationId 'com.loginpro.lorren.portal'
        minSdk 26
        targetSdk 36
        versionCode lorrenVersionCode
        versionName lorrenVersionName
        buildConfigField 'String', 'PORTAL_BASE_URL', '"' + escapedPortalBaseUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.android.gms:play-services-nearby:19.4.0'
}
